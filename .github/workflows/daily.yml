name: Champipi — mise à jour quotidienne

on:
  schedule:
    - cron: "0 5 * * *"      # tous les jours ~07h (heure de Paris l'été)
  workflow_dispatch:          # permet aussi un lancement manuel

# Droits nécessaires au déploiement GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule exécution à la fois
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances Python
        run: pip install -r requirements.txt

      - name: Lancer le robot (génère site/index.html)
        run: python robot/run.py

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Chiffrer la page (mot de passe + mémorisation 3 jours)
        env:
          PW: ${{ secrets.SITE_PASSWORD }}
        run: |
          if [ -z "$PW" ]; then
            echo "::error::Le secret SITE_PASSWORD est absent. Ajoute-le dans Settings > Secrets and variables > Actions."
            exit 1
          fi
          # -t : gabarit maison (site/staticrypt_template.html) — écran d'ouverture
          # Champipi, textes en français et surtout remplacement du document SANS
          # document.write (sinon l'écran de lancement de la PWA Android reste figé).
          npx --yes staticrypt@3 site/index.html -p "$PW" --short --remember 3 -d public \
            -t site/staticrypt_template.html \
            --template-title "Champipi" \
            --template-instructions "Accès réservé — entre le mot de passe." \
            --template-placeholder "Mot de passe" \
            --template-button "Ouvrir" \
            --template-remember "Se souvenir de moi (3 jours)" \
            --template-error "Mot de passe incorrect." \
            --template-toggle-show "Afficher le mot de passe" \
            --template-toggle-hide "Masquer le mot de passe" \
            --template-color-primary "#2e5e34" --template-color-secondary "#f5f4f0"
          # StatiCrypt écrit public/index.html (page chiffrée, prête à publier).
          # --short : accepte un mot de passe court sans poser de question interactive.
          test -f public/index.html || { echo "::error::public/index.html non généré"; exit 1; }
          # Fichiers statiques (b) : géométrie versant + historique long. Servis
          # EN CLAIR (open-data public IGN/BRGM/SAFRAN), chargés à la demande par
          # la page. Ils vivent à côté de la page chiffrée dans public/.
          cp site/geom_*.json public/ 2>/dev/null || true
          cp site/hist_*.json public/ 2>/dev/null || true
          # Historique long des stations (pluie + T° par jour) : permet au calque
          # « stations météo » de suivre le curseur temporel au lieu de rester
          # figé sur la photo du jour. Chargé à la demande par la page.
          cp site/stations_hist.json public/ 2>/dev/null || true
          # version.json : date de génération + liste des fichiers de données, lu par
          # la PWA au lancement pour savoir si sa copie locale est à jour.
          cp site/version.json public/
          # Mode terrain (PWA) : service worker + manifest + icônes + vendor/
          cp site/sw.js site/manifest.webmanifest site/icon-192.png site/icon-512.png site/apple-touch-icon.png public/
          cp -r site/vendor public/vendor
          echo "Contenu de public/ :"; ls -la public/

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
