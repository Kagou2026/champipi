      <h2 style="margin:0">🌧️ Station ${num}</h2>
    </div>
    <p class="hint" style="margin-top:10px">${c.date?frDate(c.date)+" — ":""}${raison}</p>`;
  const b=document.getElementById("d-back"); if(b) b.addEventListener("click",fermerDetail);
}

function addDays(ds,n){ const d=new Date(ds+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
// Synthèse de prévision : prochaine fenêtre favorable + pousse attendue (+lag) +
// secteurs. Basée sur la PRÉVISION inline (D.prevision) : disponible sans avoir
// à charger le lourd historique.
function fillSynth(){
  const el=document.getElementById("prev-synth"); if(!el) return;
  const P=D.prevision;
  if(!P || !P.dates || !P.dates.length){ el.innerHTML=""; return; }
  const PD=P.dates, PM=P.mailles||{};
  const SEUIL=55;
  const bestAt=(k)=>{let bv=-1;for(const mid in PM){const a=PM[mid].i;const v=a?a[k]:null;if(v!=null&&v>bv)bv=v;}return bv;};
  let peakK=-1,peakV=-1;
  for(let k=0;k<PD.length;k++){const bv=bestAt(k); if(bv>peakV){peakV=bv; peakK=k;}}
  if(peakV<SEUIL){
    el.innerHTML=`<div class="synth-t">🍄 Prévision de sortie</div>
      <div>Pas de fenêtre nettement favorable prévue d'ici le ${frDate(PD[PD.length-1])} (meilleur indice attendu ${peakV<0?"—":peakV}).</div>
      <div class="synth-n">Prévision météo — fiabilité décroissante au-delà de ~5–7 j.</div>`;
    return;
  }
  let a=peakK,b=peakK;
  while(a-1>=0 && bestAt(a-1)>=SEUIL) a--;
  while(b+1<PD.length && bestAt(b+1)>=SEUIL) b++;
  const arr=[];
  for(const mid in PM){ const ai=PM[mid].i; const v=ai?ai[peakK]:null; if(v==null) continue;
    const p=D.mailles[mid]||{}; arr.push({mid,indice:v,altitude:p.altitude,geologie:p.geologie_classe}); }
  arr.sort((x,y)=>y.indice-x.indice); const top=arr.slice(0,3);
  const lag=(top[0]&&D.mailles[top[0].mid]&&D.mailles[top[0].mid].lag_jours)||12;
  const f1=addDays(PD[a],lag), f2=addDays(PD[b],lag);
  const NUM=["①","②","③"];
  const lien=(d)=>`<a data-goto="${d}" title="Voir la carte à cette date">${frDate(d)}</a>`;
  const secteurs=top.map((z,i)=>`<a data-mid="${z.mid}" data-goto="${PD[peakK]}" title="Centrer la carte sur ce secteur (maille 8 km)">${NUM[i]||""} ${Math.round(z.altitude||0)} m ${z.geologie||""} (${z.indice})</a>`).join(" · ");
  el.innerHTML=`<div class="synth-t">🍄 Prévision de sortie</div>
    <div>Conditions favorables prévues <b>${lien(PD[a])}${a!==b?" → "+lien(PD[b]):""}</b> (indice jusqu'à ${peakV}).</div>
    <div>Pousse attendue ~${lag} j après → <b>${frDate(f1)}${a!==b?" → "+frDate(f2):""}</b>.</div>
    <div class="synth-s">Meilleurs secteurs : ${secteurs}.</div>
    <button type="button" class="synth-btn" data-goto="${PD[peakK]}">🗺️ Voir les secteurs sur la carte (${frDate(PD[peakK])})</button>
    <div class="synth-n">Prévision météo — fiabilité décroissante au-delà de ~5–7 j. SWI projeté (bilan hydrique). Un secteur = une maille SAFRAN de 8 km, pas un bois précis.</div>`;
  // Dates et secteurs cliquables : placer le curseur sur la date (la carte se
  // recolore, le calque « secteurs favorables » apparaît), puis centrer sur la maille.
  el.querySelectorAll("[data-goto]").forEach(n=>n.addEventListener("click",(ev)=>{
    ev.preventDefault();
    const d=n.getAttribute("data-goto"), mid=n.getAttribute("data-mid");
    if(allerADate) allerADate(d);
    if(mid) allerAuSecteur(mid);
    if(typeof IS_MOBILE!=="undefined" && IS_MOBILE && !mid){ try{ document.getElementById("map").scrollIntoView({behavior:"smooth"}); }catch(e){} }
  }));
}

// Vue par défaut : synthèse prévision + top zones (date-aware) + légende.
function remplirDefaut(){
  majLuneBox();
  fillSynth();
  remplirTop();
  const lg = document.getElementById("legend");
  if(lg){
    const ramp = "linear-gradient(90deg,rgb(183,28,28) 0%,rgb(239,108,0) 25%,"
               + "rgb(249,168,37) 50%,rgb(124,179,66) 70%,rgb(46,125,50) 100%)";
    lg.innerHTML = "<b>Légende</b>"
    + `<div style="margin:4px 0 2px">`
    + `<div style="height:12px;border-radius:6px;background:${ramp};border:1px solid var(--line)"></div>`
    + `<div style="display:flex;justify-content:space-between;font-size:10px;color:#7a7a70;margin-top:2px">`
    + `<span>0 · très faible</span><span>moyen</span><span>excellent · 100</span></div></div>`
    + `<div class="li"><span class="dot" style="background:#9e9e9e"></span>donnée manquante</div>`
    + `<div class="li" style="margin-top:6px">Indice en <b>dégradé continu</b> : chaque nuance est un point d'indice — deux parcelles voisines de teinte différente n'ont pas la même évaluation.</div>`
    + `<div class="li" style="margin-top:6px">Teinte : essences <b>principales</b> pleines, secondaires atténuées, autres pâles. Filtre en haut à droite de la carte.</div>`
    + `<div class="li" style="margin-top:6px">Chaque forêt est découpée en <b>parcelles</b>, évaluées une par une selon leur <b>versant</b> (ubac frais / adret chaud) et leur <b>altitude</b> propre (plus haut = plus frais). Sol sec ou chaud → ubac et parcelles hautes favorisés ; temps froid → l'inverse. Cliquez une parcelle pour son détail.</div>`
    + `<div class="li" style="margin-top:6px">Le <b>rejeu</b> (en bas à droite de la carte) permet de <b>remonter dans le temps</b> sur plusieurs années : curseur, saut jour/mois, choix d'une date, ▶ animation. ⤓ revient au jour courant. Utile pour comparer l'indice à ce que tu as réellement observé en forêt.</div>`;
  }
}
function remplirFoot(){
  const f=document.getElementById("foot");
  if(f) f.innerHTML =
    `Généré le ${D.genere_le} · ${D.nb_mailles} mailles de 8 km.<br>
     Indice indicatif combinant humidité du sol (SWI), pluie sur 15 j et température,
     pondéré par la géologie, le boisement et l'essence hôte, puis <b>modulé par le versant</b>
     (ubac/adret, MNT IGN RGE ALTI 10 m) et par le <b>choc thermique</b> (refroidissement récent,
     déclencheur de pousse) selon la météo du jour. Il ne remplace pas l'observation de
     terrain ni la prudence sur la comestibilité.<br>
     Sources : Météo-France/SAFRAN (data.gouv), BRGM, Open-Meteo, IGN (BD Forêt V2, RGE ALTI).`;
}
// --- Observations / cueillettes (privé, dans le navigateur) -----------------
// Stockées en localStorage (jamais envoyées au dépôt public). Affichées sur la
// carte ; import/export pour sauvegarde et transfert entre appareils.
const OBS_KEY="champipi_obs_v1";
let OBS=[];
function obsLoad(){ try{OBS=JSON.parse(localStorage.getItem(OBS_KEY)||"[]");}catch(e){OBS=[];}
  // Rétro-remplissage : ajoute les données de lune aux cueillettes antérieures.
  let maj=false;
  OBS.forEach(o=>{ if(o.date && o.lune_illum==null){ const ph=phaseLune(o.date);
    o.lune_illum=+ph.illum.toFixed(3); o.lune_montante=ph.montante; o.lune_nom=ph.nom; maj=true; } });
  if(maj) obsSave();
}
function obsSave(){ try{localStorage.setItem(OBS_KEY, JSON.stringify(OBS));}catch(e){alert("Sauvegarde impossible (stockage navigateur).");} }
const EFFORT={balade:"Balade (passage)", recherche:"Recherche", intensive:"Recherche intensive"};
const ESPECE={cepe:"Cèpe", autre:"Autre"};

// Rattache un point (lat/lon) à la maille la plus proche (centroïdes embarqués).
function nearestMaille(lat,lon){
  let best=null,bd=Infinity;
  for(const mid in D.mailles){const m=D.mailles[mid]; if(m.lat==null) continue;
    const dx=m.lat-lat, dy=(m.lon-lon)*Math.cos(lat*Math.PI/180); const d=dx*dx+dy*dy;
    if(d<bd){bd=d;best=mid;}}
  return best;
}
// Index dans HDATES d'une date (exact sinon plus proche).
function hIndex(date){ if(!H||!date) return -1; const i=HDATES.indexOf(date); if(i>=0) return i;
  let best=-1,bd=Infinity; const td=new Date(date+"T00:00:00Z").getTime();
  for(let j=0;j<HDATES.length;j++){const d=Math.abs(new Date(HDATES[j]+"T00:00:00Z").getTime()-td); if(d<bd){bd=d;best=j;}} return best; }

function couleurObs(r){ if(r==null) return "#8e24aa";
  if(r>=8) return "#1b5e20"; if(r>=5) return "#7cb342"; if(r>=3) return "#f9a825";
  if(r>=1) return "#ef6c00"; return "#b71c1c"; }

const obsLayer=L.layerGroup().addTo(map);
function obsRefresh(){
  obsLayer.clearLayers();
  const show=document.getElementById("obs-show");
  if(!show || show.checked){
    OBS.forEach(o=>{
      const vide=o.result==null;   // GPX importé non renseigné : marqueur distinct
      const mk=L.circleMarker([o.lat,o.lon],{radius:vide?8:7,weight:vide?3:2,
        color:"#fff", dashArray:vide?"4 3":null,
        fillColor:vide?"#8e24aa":couleurObs(o.result),fillOpacity:vide?0.92:0.95});
      mk.on("click",(e)=>{L.DomEvent.stop(e); montrerObs(o);});
      mk.bindTooltip(`${vide?"à renseigner":o.result+"/10"} · ${frDate(o.date)}`);
      obsLayer.addLayer(mk);
    });
  }
  const c=document.getElementById("obs-count"); if(c) c.textContent=OBS.length;
}

// Capture d'un point. captureThen (facultatif) détourne le prochain clic — utilisé
// par l'import d'une photo sans GPS — au lieu d'ouvrir une nouvelle cueillette vide.
let captureThen=null;
function armerCapture(){ pendingCapture=true; map.getContainer().style.cursor="crosshair"; }
function desarmerCapture(){ pendingCapture=false; map.getContainer().style.cursor=""; }
function finirCapture(latlng){ desarmerCapture();
  const pos={lat:+latlng.lat.toFixed(5), lon:+latlng.lng.toFixed(5)};
  if(captureThen){ const cb=captureThen; captureThen=null; cb(pos); } else formulaireObs(pos); }
map.on("click",(e)=>{ if(pendingCapture) finirCapture(e.latlng); });
function captureGPS(){
  if(!navigator.geolocation){ alert("Géolocalisation indisponible sur cet appareil."); return; }
  navigator.geolocation.getCurrentPosition(
    p=>finirCapture({lat:p.coords.latitude, lng:p.coords.longitude}),
    ()=>alert("Position GPS indisponible ou refusée."),
    {enableHighAccuracy:true, timeout:10000});
}

function aujourdhui(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

// Formulaire de saisie / édition. opts (facultatif) : {preview, flagDate, after},
// posé par l'import photo — aperçu de la photo, date à saisir, enchaînement de la file.
function formulaireObs(pos, o, opts){
  desarmerCapture();
  o = o || {}; opts = opts || {};
  const lat = o.lat!=null? o.lat : pos.lat, lon = o.lon!=null? o.lon : pos.lon;
  const el=document.getElementById("detail");
  el.innerHTML=`
    <h2 style="margin:0 0 4px">${o.id?"Modifier":"Nouvelle"} cueillette</h2>
    <p class="hint">Position : ${lat.toFixed(5)}, ${lon.toFixed(5)} · maille ${nearestMaille(lat,lon)}</p>
    ${opts.preview?`<img src="${opts.preview}" alt="aperçu photo" style="display:block;max-width:100%;max-height:190px;border-radius:10px;margin:2px 0 6px;object-fit:cover">`:""}
    <div class="obsform">
      <label>Date${opts.flagDate?` <span style="color:#b26a00">— absente de la photo, à saisir</span>`:""}</label>
      <input type="date" id="o-date" max="${aujourdhui()}" value="${o.date||(opts.flagDate?"":aujourdhui())}"${opts.flagDate?` style="border-color:#e0a25e;background:#fff8ef"`:""}>
      <label>Résultat de cueillette (0 = rien · 10 = abondant)</label>
      <div class="rrow"><input type="range" id="o-res" min="0" max="10" step="1" value="${o.result!=null?o.result:0}" style="flex:1">
        <span class="rval" id="o-resv">${o.result!=null?o.result:0}</span></div>
      <label>Espèce</label><select id="o-esp">
        <option value="cepe"${o.espece!=="autre"?" selected":""}>Cèpe</option>
        <option value="autre"${o.espece==="autre"?" selected":""}>Autre</option></select>
      <label>Effort de prospection</label><select id="o-eff">
        <option value="balade"${(o.effort||"recherche")==="balade"?" selected":""}>Balade (passage)</option>
        <option value="recherche"${(o.effort||"recherche")==="recherche"?" selected":""}>Recherche</option>
        <option value="intensive"${o.effort==="intensive"?" selected":""}>Recherche intensive</option></select>
      <label>Note (facultatif)</label><textarea id="o-note" rows="2">${o.note||""}</textarea>
    </div>
    <div class="obsbtns">
      <button class="ok" id="o-save">Enregistrer</button>
      <button id="o-cancel">${opts.after?"Passer":"Annuler"}</button>
    </div>`;
  document.getElementById("o-res").addEventListener("input",e=>{document.getElementById("o-resv").textContent=e.target.value;});
  document.getElementById("o-cancel").addEventListener("click", opts.after || fermerDetail);
  document.getElementById("o-save").addEventListener("click",()=>{
    const dEl=document.getElementById("o-date");
    let dObs=dEl.value;
    if(!dObs){ if(opts.flagDate){ alert("Indiquez la date de la photo."); dEl.focus(); return; } dObs=aujourdhui(); }
    const phObs=phaseLune(dObs);   // lune de la nuit précédant la cueillette
    const obs={ id:o.id||("o"+Date.now()), lat, lon,
      date:dObs,
      result:+document.getElementById("o-res").value,
      espece:document.getElementById("o-esp").value,
      effort:document.getElementById("o-eff").value,
      note:document.getElementById("o-note").value.trim(),
      lune_illum:+phObs.illum.toFixed(3), lune_montante:phObs.montante, lune_nom:phObs.nom,
      saisi_le:new Date().toISOString().slice(0,16).replace("T"," ") };
    const i=OBS.findIndex(x=>x.id===obs.id);
    if(i>=0) OBS[i]=obs; else OBS.push(obs);
    obsSave(); obsRefresh();
    if(opts.after) opts.after(); else montrerObs(obs);   // import photo : passe à la suivante
  });
}

// Détail d'une cueillette + données de la zone (maille) à sa date
function montrerObs(o){
  SELMID=null; SELFACE=null; SELSTA=null; if(chart){chart.destroy(); chart=null;}
  const mid=nearestMaille(o.lat,o.lon), p=D.mailles[mid]||{};
  const k=hIndex(o.date);
  const geo={acide:"sol acide",neutre:"sol neutre",calcaire:"sol calcaire",inconnu:"sol ?"}[p.geologie_classe]||p.geologie_classe||"—";
  let zone;
  if(H && H.mailles[mid] && k>=0){
    const m=H.mailles[mid];
    const pred=m.i[k];
    // Fenêtre de LAG : la pousse reflète le déclencheur ~10-15 j avant. On
    // remonte le meilleur indice sur la fenêtre précédente (lag selon altitude).
    const lag = p.lag_jours || 15;
    let maxPre=null, jbest=k;
    for(let j=Math.max(0,k-lag); j<=k; j++){ const v=m.i[j];
      if(v!=null && (maxPre==null || v>maxPre)){ maxPre=v; jbest=j; } }
    zone=`
     <div class="metrics">
       ${metric("Ta cueillette", (o.result!=null?o.result:"—")+" / 10")}
       ${metric("Indice ce jour-là", (pred!=null?pred:"—")+" · "+niveauLbl(pred))}
       ${metric("Meilleur indice "+lag+" j avant", (maxPre!=null?maxPre:"—")+" · "+niveauLbl(maxPre))}
       ${metric("Déclencheur estimé", jbest!==k?frDate(HDATES[jbest]):"le jour même")}
       ${metric("Humidité (SWI)", m.w&&m.w[k]!=null?m.w[k]:"—")}
       ${metric("Pluie 15 j", m.p&&m.p[k]!=null?m.p[k]+" mm":"—")}
       ${metric("Température", m.t&&m.t[k]!=null?m.t[k]+" °C":"—")}
       ${metric("Altitude · sol", (p.altitude!=null?Math.round(p.altitude)+" m":"—")+" · "+geo)}
     </div>
     <p class="hint">La pousse suit le déclencheur avec ~${lag} j de décalage (altitude). On compare donc ta cueillette au <b>meilleur indice des ${lag} j précédents</b> (${maxPre!=null?maxPre:"—"}), pas au seul indice du jour (${pred!=null?pred:"—"}). C'est cet écart, accumulé, qui recalera les coefficients.</p>`;
  } else {
    zone=`<p class="hint">Pas de données d'historique pour cette date/zone (hors période couverte).</p>`;
  }
  const el=document.getElementById("detail");
  el.innerHTML=`
    <div style="display:flex;align-items:center;gap:8px">
      <button id="o-back" type="button" style="border:1px solid var(--line);background:#faf9f5;border-radius:7px;padding:2px 8px;font-size:12px;cursor:pointer;color:var(--ink)">‹ retour</button>
      <h2 style="margin:0">Cueillette · ${frDate(o.date)}</h2>
    </div>
    <p class="hint" style="margin-top:8px"><span class="dot" style="display:inline-block;background:${couleurObs(o.result)}"></span>
      <b>${o.result!=null?o.result:"—"}/10</b>${o.result==null?" <span style=\"color:#b26a00\">· à renseigner</span>":""} · ${ESPECE[o.espece]||o.espece} · ${EFFORT[o.effort]||o.effort||"—"}${o.note?" · "+o.note:""}</p>
    <p class="hint">Position ${o.lat.toFixed(5)}, ${o.lon.toFixed(5)} · maille ${mid}</p>
    ${luneInfoHTML(o.date)}
    ${zone}
    <div class="obsbtns">
      ${allerADate?`<button id="o-see">Voir la carte ce jour-là</button>`:""}
      <button id="o-edit">Modifier</button>
      <button class="del" id="o-del">Supprimer</button>
    </div>`;
  document.getElementById("o-back").addEventListener("click",fermerDetail);
  document.getElementById("o-edit").addEventListener("click",()=>formulaireObs({lat:o.lat,lon:o.lon},o));
  document.getElementById("o-del").addEventListener("click",()=>{
    if(confirm("Supprimer cette cueillette ?")){ OBS=OBS.filter(x=>x.id!==o.id); obsSave(); obsRefresh(); fermerDetail(); }});
  const see=document.getElementById("o-see"); if(see) see.addEventListener("click",()=>allerADate(o.date));
}

// Import / export
function obsExport(){
  if(!OBS.length){ alert("Aucune cueillette à exporter."); return; }
  const blob=new Blob([JSON.stringify(OBS,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="champipi_observations.json"; document.body.appendChild(a); a.click(); a.remove();
}
function readText(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(new Error("lecture")); r.readAsText(file); }); }
// Parse un GPX : ne garde que les waypoints (<wpt>). Un point GPX n'a pas de
// « résultat » → result=null : le point s'affiche « à renseigner » (contour gris
// tireté) tant qu'il n'est pas édité. Il reste tel quel à travers export/import.
function parseGpx(text){
  const doc=new DOMParser().parseFromString(text,"application/xml");
  if(doc.querySelector("parsererror")) throw new Error("GPX invalide");
  const out=[];
  doc.querySelectorAll("wpt").forEach(w=>{
    const lat=parseFloat(w.getAttribute("lat")), lon=parseFloat(w.getAttribute("lon"));
    if(!isFinite(lat)||!isFinite(lon)) return;
    const t=w.querySelector("time"); const date=(t&&t.textContent)? t.textContent.trim().slice(0,10) : aujourdhui();
    const nm=((w.querySelector("name")||{}).textContent||"").trim();
    const ds=((w.querySelector("desc")||w.querySelector("cmt")||{}).textContent||"").trim();
    const note=["GPX",nm,ds].filter(Boolean).join(" · ").slice(0,300);
    const la=+lat.toFixed(5), lo=+lon.toFixed(5), ph=phaseLune(date);
    out.push({ id:"g_"+la+"_"+lo+"_"+date, lat:la, lon:lo, date, result:null,
      espece:"cepe", effort:"recherche", note,
      lune_illum:+ph.illum.toFixed(3), lune_montante:ph.montante, lune_nom:ph.nom,
      saisi_le:new Date().toISOString().slice(0,16).replace("T"," ") });
  });
  return out;
}
// Import multi-fichiers : .json (tableaux de cueillettes) et/ou .gpx (waypoints).
async function obsImport(files){
  let ajout=[], erreurs=0, vides=0;
  for(const f of Array.from(files)){
    try{
      const txt=await readText(f);
      const gpx=/\.gpx$/i.test(f.name) || /<gpx[\s>]/i.test(txt.slice(0,600));
      const arr = gpx ? parseGpx(txt) : (()=>{ const a=JSON.parse(txt); if(!Array.isArray(a)) throw 0; return a; })();
      arr.forEach(o=>{ if(o.result==null) vides++; });
      ajout=ajout.concat(arr);
    }catch(e){ erreurs++; }
  }
  if(!ajout.length){ alert(erreurs? "Aucun point valide (formats attendus : .json ou .gpx).":"Rien à importer."); return; }
  // Fusion des doublons (même id) : on garde le point renseigné plutôt que le
  // vide, et à statut égal le plus récent. Réimporter un vieil export ne réécrase
  // donc jamais un résultat déjà saisi.
  const mieux=(a,b)=>{ if(!a) return b; if(!b) return a;
    const ra=a.result!=null, rb=b.result!=null; if(ra!==rb) return ra?a:b;
    return (b.saisi_le||"")>=(a.saisi_le||"")?b:a; };
  const byKey={};
  OBS.concat(ajout).forEach(o=>{ const key=o.id||[o.date,o.lat,o.lon].join("|"); byKey[key]=mieux(byKey[key],o); });
  OBS=Object.values(byKey); obsSave(); obsRefresh();
  alert("Importé : "+ajout.length+" point(s)"
    +(vides? " · dont "+vides+" à renseigner":"")
    +(erreurs? " · "+erreurs+" fichier(s) ignoré(s)":"")
    +". Total : "+OBS.length+".");
}

// --- Import de photos (métadonnées EXIF : date + position GPS) --------------
// Chaque photo devient une cueillette. exifr (chargé en CDN) lit JPEG/HEIC/PNG.
// Photo géotaguée + datée → fiche pré-remplie. Sans GPS → on demande de pointer
// l'endroit sur la carte. Sans date → le champ Date est signalé et requis.
function _isoDate(dt){
  if(!dt) return null;
  if(dt instanceof Date && !isNaN(dt))
    return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
  const m=String(dt).match(/(\d{4})[:\-\/](\d{2})[:\-\/](\d{2})/);
  return m? `${m[1]}-${m[2]}-${m[3]}` : null;
}
// Lit date + lat/lon d'une image. Renvoie {date,lat,lon} (champs nuls si absents).
async function lireMetaPhoto(f){
  let date=null, lat=null, lon=null;
  if(window.exifr){
    try{ const g=await exifr.gps(f);
      if(g && isFinite(g.latitude) && isFinite(g.longitude)){
        lat=+(+g.latitude).toFixed(5); lon=+(+g.longitude).toFixed(5); } }catch(e){}
    try{ const o=await exifr.parse(f,["DateTimeOriginal","CreateDate","ModifyDate"]);
      if(o) date=_isoDate(o.DateTimeOriginal||o.CreateDate||o.ModifyDate); }catch(e){}
  }
  return {date, lat, lon};
}
let PHOTO_Q=[];   // file d'attente des photos en cours d'import
async function photoImport(files){
  if(!window.exifr &&
     !confirm("Lecture des métadonnées photo indisponible (CDN hors-ligne ?). "+
              "Importer quand même en saisie manuelle (position + date à renseigner) ?")) return;
  const items=[];
  for(const f of Array.from(files)){
    const meta = window.exifr ? await lireMetaPhoto(f) : {date:null,lat:null,lon:null};
    items.push({name:f.name, date:meta.date, lat:meta.lat, lon:meta.lon,
                thumb:URL.createObjectURL(f)});
  }
  PHOTO_Q = items;
  photoNext();
}
// Traite la photo suivante de la file (une fiche à la fois).
function photoNext(){
  if(!PHOTO_Q.length){ desarmerCapture(); captureThen=null; fermerDetail(); return; }
  const it=PHOTO_Q.shift();
  const o={ date:it.date||null, note:"📷 "+(it.name||"photo") };
  const opts={ preview:it.thumb, flagDate:!it.date, after:photoNext };
  if(it.lat!=null && it.lon!=null){                 // géotaguée → fiche pré-remplie
    map.setView([it.lat,it.lon], Math.max(map.getZoom(),13));
    formulaireObs({lat:it.lat, lon:it.lon}, o, opts);
  } else {                                          // sans GPS → pointer l'endroit
    photoAskLocation(it, o, opts);
  }
}
// Photo sans GPS : aperçu + demande de cliquer l'endroit sur la carte.
function photoAskLocation(it, o, opts){
  const el=document.getElementById("detail");
  el.innerHTML=`
    <h2 style="margin:0 0 6px">📷 Localiser la photo</h2>
    <p class="hint"><b>${it.name||"photo"}</b> ne contient pas de position GPS${it.date?` (prise le ${frDate(it.date)})`:""}.
       Cliquez sur la carte l'endroit où elle a été prise.</p>
    <img src="${it.thumb}" alt="aperçu photo" style="display:block;max-width:100%;max-height:200px;border-radius:10px;margin:6px 0;object-fit:cover">
    <div class="obsbtns"><button id="ph-skip">Passer cette photo</button></div>`;
  const skip=document.getElementById("ph-skip");
  if(skip) skip.addEventListener("click",()=>{ captureThen=null; photoNext(); });
  captureThen=(pos)=>formulaireObs(pos, o, opts);
  armerCapture();
  // Sur mobile la feuille se replie : un rappel explicite évite l'hésitation.
  if(window.matchMedia && window.matchMedia("(max-width:760px)").matches)
    alert("Photo sans position GPS — touchez sur la carte l'endroit où elle a été prise.");
}

// Contrôle « ma position » : centre la carte sur le GPS du téléphone.
// La carte reste nord-en-haut (Leaflet ne pivote jamais).
let _locMark=null, _locAcc=null;
function locateMe(){
  if(!navigator.geolocation){ alert("Géolocalisation indisponible sur cet appareil."); return; }
  const btn=document.getElementById("loc-btn");
  if(btn) btn.disabled=true;
  navigator.geolocation.getCurrentPosition(
    p=>{
      const ll=[p.coords.latitude, p.coords.longitude], acc=p.coords.accuracy||0;
      if(_locMark) map.removeLayer(_locMark);
      if(_locAcc)  map.removeLayer(_locAcc);
      _locAcc=L.circle(ll,{radius:acc,color:"#1976d2",weight:1,fillColor:"#1976d2",fillOpacity:.12,interactive:false}).addTo(map);
      _locMark=L.circleMarker(ll,{radius:7,color:"#fff",weight:2,fillColor:"#1976d2",fillOpacity:1}).addTo(map);
      map.setView(ll, Math.max(map.getZoom(),14));   // nord toujours en haut
      if(btn) btn.disabled=false;
    },
    ()=>{ alert("Position GPS indisponible ou refusée."); if(btn) btn.disabled=false; },
    {enableHighAccuracy:true, timeout:10000, maximumAge:15000});
}
const locCtrl=L.control({position:"topleft"});
locCtrl.onAdd=function(){
  const div=L.DomUtil.create("div","locctrl");
  div.innerHTML=`<button id="loc-btn" type="button" title="Centrer sur ma position" aria-label="Centrer sur ma position">📍</button>`;
  L.DomEvent.disableClickPropagation(div);
  L.DomEvent.disableScrollPropagation(div);
  return div;
};
locCtrl.addTo(map);
document.getElementById("loc-btn").addEventListener("click",locateMe);

remplirDefaut();
remplirFoot();

// ============================================================================
// Calque « Stations météo » : pluviomètres Météo-France (48 + limitrophes) qui
// servent à corriger localement la pluie. Marqueur à la position, fiche avec le
// cumul 15 j et la série quotidienne (barres). OFF par défaut (évite la surcharge).
// Enveloppé try/catch et placé AVANT le bloc mobile : ne peut pas casser le tactile.
// ============================================================================
// Échelle de couleur pour la pluie (mm) — bleus, distincts de l'indice (vert)
// et des cueillettes (violet/rouge).
function couleurPluie(mm){ if(mm==null) return "#9e9e9e";
  if(mm>=50) return "#0d47a1"; if(mm>=30) return "#1976d2";
  if(mm>=15) return "#42a5f5"; if(mm>=5) return "#90caf9"; return "#cfd8dc"; }
// Nombre de cellules pleines (0..4) selon le cumul 15 j — mêmes seuils que la couleur.
function pluieCells(mm){ return mm==null?0 : mm>=50?4 : mm>=30?3 : mm>=15?2 : mm>=5?1 : 0; }
// Marqueur = petite jauge verticale à 4 cellules, remplie du bas selon la pluie.
// `etat` (fraîcheur, levier 1) ajoute une pastille de coin : rien si à jour,
// orange si lacunaire, gris + marqueur atténué si muette (probablement HS).
// Couleur du choc thermique selon le score signé (score_choc ∈ [−1,+1]) :
// bleu = refroidissement (favorable), rouge = réchauffement, gris = stable.
function couleurChoc(score){ const m=Math.min(1,Math.abs(score||0));
  if(m<0.05) return "#cfd8dc";
  if(score>0) return m<0.5?"#64b5f6":(m<0.8?"#1976d2":"#0d47a1");
  return m<0.5?"#ef9a9a":(m<0.8?"#ef6c00":"#b2182b"); }
// Mini-thermomètre du choc thermique, à droite de la jauge. Rien si pas de T°.
function thermoHTML(choc){
  if(!choc) return "";                       // pluviomètre (pas de température)
  const s=choc.score||0, m=Math.min(1,Math.abs(s)), col=couleurChoc(s);
  const h=Math.round(12+m*88);               // niveau de mercure : 12 → 100 %
  const sens = m<0.05 ? "T° stable"
    : (s>0 ? `refroidissement (score ${m.toFixed(2)})` : `réchauffement (score ${m.toFixed(2)})`);
  return `<div class="thermo" title="Choc thermique : ${sens}">`
    +`<div class="tube"><div class="tfill" style="height:${h}%;background:${col}"></div></div>`
    +`<div class="bulb" style="background:${col}"></div></div>`;
}
function jaugeHTML(mm, etat, choc){ const n=pluieCells(mm), col=couleurPluie(mm); let c="";
  for(let i=0;i<4;i++){ c+=`<i${i<n?` style="background:${col}"`:""}></i>`; }  // .stmk est en column-reverse : i=0 en bas
  const dot = etat==="lacunaire" ? `<span class="stdot lac" title="données lacunaires"></span>`
            : etat==="muet"      ? `<span class="stdot muet" title="station muette (probablement hors service)"></span>` : "";
  // Badge « appel à pousse » : choc thermique observé + sol assez humide.
  const appel = !!(choc && choc.appel);
  const badge = appel ? `<span class="stchoc" title="choc thermique + sol humide : appel à pousse">❄</span>` : "";
  const cls = "stmk" + (etat==="muet"?" muet":"") + (appel?" choc":"");
  const jauge = `<div class="${cls}" title="${mm!=null?mm+" mm / 15 j":"—"}">${dot}${badge}${c}</div>`;
  return `<div class="stmk-row">${jauge}${thermoHTML(choc)}</div>`; }

// Traduction de l'état de fraîcheur en libellé + couleur + explication.
function etatStation(s){ const e=s.etat||"ok";
  if(e==="muet") return {txt:"Muette", col:"#616161",
    detail:`aucune donnée depuis ${s.retard_j!=null?s.retard_j+" j":"longtemps"} — poste probablement hors service ou fermé, écarté de la correction.`};
  if(e==="lacunaire") return {txt:"Lacunaire", col:"#d98200",
    detail:`données partielles${s.retard_j?", en retard de "+s.retard_j+" j sur le réseau":""} — prise en compte avec prudence.`};
  return {txt:"À jour", col:"#2e7d32", detail:"données à jour avec le réseau."}; }

// Bandeau « verdict » du choc thermique d'une station (miroir de choc_station).
function chocStationHTML(c){
  if(!c) return "";
  const bar=(col,titre,txt)=>`<p class="hint" style="border-left:3px solid ${col};padding-left:8px;margin:8px 0 2px"><b style="color:${col}">${titre}</b> — ${txt}</p>`;
  const R=c.R, aR=R!=null?Math.abs(R).toFixed(1):"—";
  if(c.appel) return bar("#1565c0","❄ Choc thermique + sol humide",
     `refroidissement de ${aR} °C aboutissant dans une plage viable, sur sol assez humide localement. Les deux co-facteurs d'une pousse sont réunis (à combiner avec l'indice de la maille).`);
  if(c.choc_thermique && !c.humide) return bar("#d98200","Choc thermique, mais sol sec",
     `refroidissement de ${aR} °C, mais la pluie 15 j locale est sous le seuil : un coup de froid seul ne déclenche pas de pousse.`);
  if(c.gel) return bar("#5c6bc0","Coup de froid vers le gel",
     `T° mini récente ${c.tmin_recent!=null?c.tmin_recent.toFixed(1)+" °C":""} sous le seuil de gel : garde-fou actif — ce n'est pas un déclencheur (le gel abîme les jeunes cèpes).`);
  if(R!=null && R>0) return bar("#8a8a80","Léger refroidissement",
     `${aR} °C sur ${CH.recent} j récents vs ${CH.ref} j avant — trop faible pour un appel marqué.`);
  if(R!=null && R<0) return bar("#8a8a80","Réchauffement",
     `${aR} °C — plutôt défavorable à la pousse.`);
  return bar("#8a8a80","Température stable","pas de choc thermique notable ces derniers jours.");
}

// Graphe de température 20 j : bande TN→TX + point TM par jour, plage optimale
// (vert) et 0 °C (gel) en repères. `serie` = [ [date, tn, tx, tm], ... ].
function tempChartHTML(serie){
  const nn=v=>v!=null;
  const tn=serie.map(r=>r[1]).filter(nn), tx=serie.map(r=>r[2]).filter(nn),
        tm=serie.map(r=>r[3]).filter(nn);
  const base=tn.concat(tx).concat(tm);
  if(!base.length) return "";
  const lo=Math.min(Math.min(...base)-1, 0), hi=Math.max(Math.max(...base)+1, CH.toh+1);
  const P=v=>((v-lo)/(hi-lo)*100);
  let refs=`<div class="tband" style="bottom:${P(CH.tob)}%;height:${Math.max(0,P(CH.toh)-P(CH.tob))}%"></div>`
          +`<div class="tref" style="bottom:${P(CH.toh)}%"><span>${CH.toh}°</span></div>`;
  if(0>=lo&&0<=hi) refs+=`<div class="tref gel" style="bottom:${P(0)}%"><span>0°</span></div>`;
  const cols=serie.map(r=>{
    const tn2=r[1], tx2=r[2], tm2=r[3];
    const lowv=(nn(tn2)&&nn(tx2))?Math.min(tn2,tx2):(nn(tn2)?tn2:(nn(tx2)?tx2:tm2));
    const hiv =(nn(tn2)&&nn(tx2))?Math.max(tn2,tx2):(nn(tx2)?tx2:(nn(tn2)?tn2:tm2));
    let inner="";
    if(nn(lowv)&&nn(hiv)){
      const b=P(lowv), h=Math.max(2,P(hiv)-P(lowv));
      const tip=`${frDate(r[0])}${nn(tn2)?` · min ${tn2.toFixed(1)}°`:""}${nn(tx2)?` · max ${tx2.toFixed(1)}°`:""}${nn(tm2)?` · moy ${tm2.toFixed(1)}°`:""}`;
      inner=`<div class="trange" style="bottom:${b}%;height:${h}%" title="${tip}"></div>`;
      if(nn(tm2)) inner+=`<div class="tmid" style="bottom:${P(tm2)}%" title="${tip}"></div>`;
    }
    return `<div class="tcol">${inner}</div>`;
  }).join("");
  const days=serie.map(r=>`<div class="td">${r[0].slice(8)}</div>`).join("");
  return `<div class="tbars">${refs}${cols}</div><div class="tdays">${days}</div>`;
}

// Détail d'une station dans le PANNEAU LATÉRAL (comme une maille/cueillette).
function montrerStation(s){
  SELMID=null; SELFACE=null; SELSTA=s.num||null; if(chart){ chart.destroy(); chart=null; }
  const dateSta = s.date || D.stations_date;   // date des observations affichées
  const serie=s.serie||[];
  const E=etatStation(s);
  const vals=serie.map(x=>x[1]).filter(v=>v!=null);
  const mx=Math.max(1,...vals);
  const jours=vals.filter(v=>v>0).length;
  const maxj=vals.length?Math.max(...vals):null;
  const bars=serie.map(x=>{ const v=x[1];
    const h=(v==null)?2:Math.max(2,Math.round(3+48*v/mx));
    const t=(v==null?"—":v+" mm")+" · "+frDate(x[0]);
    // valeur en mm au-dessus de la barre : bleu si pluie, gris pâle si 0/absent
    const on=v!=null&&v>0;
    const mmlab=v==null?"·":(Number.isInteger(v)?v:v.toFixed(1));
    return `<div class="sbar2" title="${t}"><span class="mm ${on?'on':'off'}">${mmlab}</span>`
      +`<i style="height:${h}px;background:${couleurPluie(v)}"></i><span class="d">${x[0].slice(8)}</span></div>`;
  }).join("");
  // Type de poste : station météo (pluie + température, réseau principal) vs
  // pluviomètre (pluie seule, réseau complémentaire).
  const c=s.choc||null;
  const tserie=s.temp_serie||[];
  const introType = s.a_temp
    ? "Station météo du réseau principal (pluie + température) : sert à corriger localement la pluie et à détecter le choc thermique."
    : "Pluviomètre du réseau complémentaire (pluie seule) : sert à corriger localement la pluie de l'indice.";
  const tempSection = s.a_temp ? `
    <div style="font-size:12px;font-weight:650;margin:14px 0 2px">Température — ${tserie.length} derniers jours${dateSta?" (au "+frDate(dateSta)+")":""}</div>
    ${chocStationHTML(c)}
    <div class="metrics">
      ${metric("T° moyenne récente", c&&c.tmean_recent!=null?c.tmean_recent+" °C":"—")}
      ${metric("T° mini récente", c&&c.tmin_recent!=null?c.tmin_recent+" °C":"—")}
      ${metric("Refroidissement", c&&c.R!=null?(c.R>0?c.R+" °C ↓":Math.abs(c.R)+" °C ↑"):"—")}
    </div>
    ${tempChartHTML(tserie)}
    <p class="hint">Bande = mini→maxi du jour, point blanc = moyenne. Bande verte = plage optimale (${CH.tob}–${CH.toh} °C), trait bleu = 0 °C (gel). Le « choc » compare la T° moyenne des ${CH.recent} j récents aux ${CH.ref} j précédents ; « ↓ » = refroidissement (favorable).</p>`
    : `<p class="hint" style="margin-top:12px">Pas de température ici : poste pluviométrique. La température ne provient que du réseau principal.</p>`;
  const el=document.getElementById("detail");
  el.innerHTML=`
    <div style="display:flex;align-items:center;gap:8px">
      <button id="d-back" type="button" style="border:1px solid var(--line);background:#faf9f5;border-radius:7px;padding:2px 8px;font-size:12px;cursor:pointer;color:var(--ink)">‹ retour</button>
      <h2 style="margin:0">${s.a_temp?"🌡️":"🌧️"} ${s.nom||s.num}</h2>
    </div>
    <p class="hint" style="margin-top:8px">Station Météo-France${s.num?" n°"+s.num:""}${s.alti!=null?" · "+Math.round(s.alti)+" m":""}. ${introType}</p>
    <div class="metrics">
      ${metric("État station", `<span style="color:${E.col};font-weight:700">${E.txt}</span>`)}
      ${metric("Dernière donnée", s.dernier?frDate(s.dernier):"—")}
      ${metric("Pluie cumulée 15 j", s.cumul_15j!=null?s.cumul_15j+" mm":"—")}
      ${metric("Jours de pluie", jours+" / "+serie.length)}
      ${metric("Max journalier", maxj!=null?maxj+" mm":"—")}
      ${metric("Altitude", s.alti!=null?Math.round(s.alti)+" m":"—")}
    </div>
    <p class="hint" style="margin-top:6px">État : <b style="color:${E.col}">${E.txt}</b> — ${E.detail}</p>
    <div style="font-size:12px;font-weight:650;margin:12px 0 2px">Pluie quotidienne — ${serie.length} derniers jours${dateSta?" (au "+frDate(dateSta)+")":""}</div>
    <div class="stbars">${bars}</div>
    <p class="hint">Barres = mm par jour (chiffre = quantième du mois). Les stations proches et d'altitude comparable pèsent le plus dans la correction (interpolation relief).</p>
    ${tempSection}`;
  document.getElementById("d-back").addEventListener("click",fermerDetail);
}

// ============================================================================
// Historique long des stations (stations_hist.json, chargé À LA DEMANDE).
// Sans lui, le calque ne saurait montrer qu'une PHOTO du jour : en remontant le
// curseur d'un an, jauges, thermomètres et badges ❄ resteraient figés sur
// avant-hier. Avec lui, on RECALCULE côté page, à la date affichée, exactement
// ce que le robot calcule côté serveur pour aujourd'hui (cumul 15 j, série 20 j,
// choc thermique, fraîcheur du poste) — mêmes formules, mêmes seuils.
// ============================================================================
const SH_REF = D.stations_hist || null;
let SH = null, SH_STATE = "idle";     // idle | load | ok | ko
const shPret = ()=> SH_STATE==="ok" && !!SH;
// "12,,0,3" (dixièmes de mm ou °C, vide = jour non renseigné) -> Float32Array
// (NaN = manquant, testé par v===v). null si la série est absente.
function shDecoder(str, n){
  if(!str) return null;
  const a=new Float32Array(n); a.fill(NaN);
  const t=str.split(",");
  const m=Math.min(n, t.length);
  for(let i=0;i<m;i++){ const v=t[i]; if(v!=="") a[i]=(+v)/10; }
  return a;
}
function shPreparer(raw){
  const n=raw.n||0, st={};
  for(const num in raw.st){
    const e=raw.st[num];
    st[num]={num:num, nom:e.n, lat:e.y, lon:e.x, alti:e.a,
             rr:shDecoder(e.rr,n), tn:shDecoder(e.tn,n),
             tx:shDecoder(e.tx,n), tm:shDecoder(e.tm,n)};
  }
  return {debut:raw.debut, fin:raw.fin, n:n,
          t0:Date.parse(raw.debut+"T00:00:00Z"), st:st};
}
async function chargerStationsHist(){
  if(SH_STATE==="ok") return true;
  if(SH_STATE==="load" || !SH_REF || !SH_REF.url) return false;
  SH_STATE="load"; if(majStationsHook){ try{ majStationsHook(); }catch(e){} }
  try{
    const r=await fetch(SH_REF.url);
    if(!r.ok) throw new Error("http "+r.status);
    SH=shPreparer(await r.json()); SH_STATE="ok";
  }catch(e){ SH=null; SH_STATE="ko"; }
  if(majStationsHook){ try{ majStationsHook(); }catch(e){} }
  if(SELSTA) rafraichirVolet();
  return SH_STATE==="ok";
}
// Index du jour `dateISO` dans les séries (ou -1 hors plage).
function shIndex(dateISO){
  if(!SH || !dateISO) return -1;
  const k=Math.round((Date.parse(dateISO+"T00:00:00Z")-SH.t0)/86400000);
  return (k>=0 && k<SH.n) ? k : -1;
}
const shArrondi = (v)=> v==null ? null : Math.round(v*10)/10;
// Cumul 15 j à l'index k (réplique de fetch_stations.cumul_15j : >= 10 jours
// renseignés, extrapolé à la fenêtre pleine sinon null).
function shCumul15(a, k){
  if(!a) return null;
  let s=0, n=0;
  for(let j=Math.max(0,k-14); j<=k; j++){ const v=a[j]; if(v===v){ s+=v; n++; } }
  return n<10 ? null : s*15/n;
}
// Série quotidienne [ [date, valeur|null], ... ] finissant à k (réplique de serie_pluie).
function shSeriePluie(a, k, jours){
  const out=[];
  for(let j=k-jours+1; j<=k; j++){
    const v=(j>=0 && a && a[j]===a[j]) ? shArrondi(a[j]) : null;
    out.push([shDate(j), v]);
  }
  return out;
}
function shSerieTemp(s, k, jours){
  const out=[];
  for(let j=k-jours+1; j<=k; j++){
    const g=(arr)=> (j>=0 && arr && arr[j]===arr[j]) ? shArrondi(arr[j]) : null;
    out.push([shDate(j), g(s.tn), g(s.tx), g(s.tm)]);
  }
  return out;
}
function shDate(k){
  if(!SH || k<0) return "";
  return new Date(SH.t0+k*86400000).toISOString().slice(0,10);
}
// Refroidissement R à l'index k, réplique EXACTE de compute_index.refroidissement
// tel qu'appelé par stations.choc_station : on prend la fenêtre de CH.stj jours,
// on COMPACTE (les jours manquants sont retirés, pas comptés comme des trous),
// puis on compare les CH.recent dernières valeurs aux CH.ref précédentes.
function shRefroidissement(tm, k){
  if(!tm) return null;
  const vals=[];
  for(let j=Math.max(0,k-CH.stj+1); j<=k; j++){ const v=tm[j]; if(v===v) vals.push(v); }
  if(vals.length < CH.recent+2) return null;
  const rec=vals.slice(-CH.recent);
  const ref=vals.slice(Math.max(0,vals.length-CH.recent-CH.ref), vals.length-CH.recent);
  if(rec.length<2 || ref.length<3) return null;
  const moy=(a)=>a.reduce((x,y)=>x+y,0)/a.length;
  return moy(ref)-moy(rec);
}
// Choc thermique observé à l'index k (réplique de stations.choc_station).
function shChoc(s, k, cumul15){
  if(!s.tm) return null;
  let vu=false;
  for(let j=Math.max(0,k-CH.stj+1); j<=k; j++){ if(s.tm[j]===s.tm[j]){ vu=true; break; } }
  if(!vu) return null;                       // pas de température sur la fenêtre
  const R=shRefroidissement(s.tm, k), sc=scoreChocJS(R);
  let som=0, nb=0, tmin=null;
  for(let j=Math.max(0,k-CH.recent+1); j<=k; j++){
    const v=s.tm?s.tm[j]:NaN;  if(v===v){ som+=v; nb++; }
    const w=s.tn?s.tn[j]:NaN;  if(w===w && (tmin===null || w<tmin)) tmin=w;
  }
  const tmean = nb? som/nb : null;
  const viable = scoreTempJS(tmean)>0;
  const gel = tmin!==null && tmin<=CH.gel;
  const humide = cumul15!=null && cumul15>=CH.p15min;
  const choc_thermique = (sc>=CH.smin) && viable && !gel;
  return {R:(R==null?null:Math.round(R*10)/10), score:Math.round(sc*100)/100,
          tmean_recent:shArrondi(tmean), tmin_recent:shArrondi(tmin),
          viable:viable, gel:gel, humide:humide,
          choc_thermique:choc_thermique, appel:choc_thermique&&humide};
}
// Fraîcheur du poste À CETTE DATE (réplique de etat_fraicheur, le « front du
// réseau » étant ici la date affichée). jours=0 -> poste inactif ce jour-là :
// il n'existait pas encore, ou il a fermé — on ne l'affiche pas du tout.
function shEtat(s, k){
  let n=0, dernier=-1, actif=false;
  for(let j=Math.max(0,k-CH.serj+1); j<=k; j++) if(s.rr && s.rr[j]===s.rr[j]) n++;
  for(let j=k; j>=0; j--) if(s.rr && s.rr[j]===s.rr[j]){ dernier=j; break; }
  // Poste ACTIF ? Même règle que le serveur, qui collecte une fenêtre de CH.actj
  // jours : un poste sans une seule pluie sur cette fenêtre n'existe pas encore
  // (ou a fermé) et n'est pas affiché ; entre les deux il est « muet ».
  actif = dernier>=0 && (k-dernier) < CH.actj;
  if(!actif) return {etat:"muet", retard_j:null, jours:0, dernier:null, actif:false};
  const retard=k-dernier, couv=n/CH.serj;
  const etat = retard>CH.muetj ? "muet" : ((retard>CH.okj || couv<CH.couv) ? "lacunaire" : "ok");
  return {etat:etat, retard_j:retard, jours:n, dernier:shDate(dernier), actif:true};
}
// Vue d'une station à l'index k, à la FORME EXACTE du payload serveur : la fiche
// et le marqueur ne font aucune différence entre « aujourd'hui » et « rejeu ».
function shVue(s, k){
  const et=shEtat(s,k);
  if(!et.actif) return null;                 // poste inactif à cette date
  const c15=shCumul15(s.rr,k);
  // « station météo » ou « pluviomètre » À CETTE DATE : miroir de
  // fetch_stations.a_temperature, jugé sur la même fenêtre de collecte.
  let aT=false;
  if(s.tm) for(let j=Math.max(0,k-CH.actj+1); j<=k; j++) if(s.tm[j]===s.tm[j]){ aT=true; break; }
  const choc=aT? shChoc(s,k,c15) : null;
  return {num:s.num, nom:s.nom, lat:s.lat, lon:s.lon, alti:s.alti,
          cumul_15j: c15==null?null:Math.round(c15*10)/10,
          serie: shSeriePluie(s.rr, k, CH.serj),
          etat:et.etat, retard_j:et.retard_j, jours_ok:et.jours, dernier:et.dernier,
          a_temp:aT, temp_serie: aT? shSerieTemp(s,k,CH.serj) : [],
          choc:choc, date:shDate(k)};
}
// État courant du calque selon la date affichée :
//   live   : photo serveur du jour (identique à avant) ;
//   hist   : recalcul à la date du rejeu ;
//   retard : date postérieure aux dernières observations publiées (le paquet
//            climato a 1-3 j de retard) -> on montre le dernier jour connu ;
//   futur  : prévision — il n'y a pas d'observation dans le futur ;
//   load/ko/idle : historique stations en cours / indisponible / pas encore demandé.
function vuesCourantes(){
  const snap = D.stations || [];
  if(HCUR<0 || !H) return {liste:snap, date:D.stations_date, mode:"live"};
  const d=HDATES[HCUR];
  // Une station MESURE : au-delà d'aujourd'hui il n'y a rien à montrer. On se
  // fie à la date réelle, pas à estFutur() : la timeline bascule en « prévision »
  // dès le lendemain de SAFRAN, alors que les postes ont bien relevé ces jours-là.
  if(d>aujourdhui()) return {liste:[], date:d, mode:"futur"};
  if(!SH_REF) return {liste:snap, date:D.stations_date, mode:"live"};
  if(!shPret()) return {liste:[], date:d, mode:(SH_STATE==="load"?"load":(SH_STATE==="ko"?"ko":"idle"))};
  let k=shIndex(d), mode="hist";
  if(k<0){
    if(d<SH.debut) return {liste:[], date:d, mode:"hors"}; // avant l'archive
    k=SH.n-1; mode="retard";                     // 1-3 j de délai de publication
  }
  const out=[];
  for(const num in SH.st){ const v=shVue(SH.st[num], k); if(v) out.push(v); }
  return {liste:out, date:shDate(k), mode:mode};
}
// Vue de la station ouverte dans le volet, à la date courante (null si le poste
// n'a rien ce jour-là).
function vueStationCourante(num){
  const c=vuesCourantes();
  for(let i=0;i<c.liste.length;i++) if(c.liste[i].num===num) return c.liste[i];
  return null;
}

// ---- Construction du calque + contrôle (isolé, ne doit pas casser le mobile).
try{
  const STA = D.stations || [];
  if(STA.length){
    const statLayer=L.layerGroup();   // OFF au départ (ajouté au clic "voir")
    const MK={};                      // num -> marqueur (réutilisé d'une date à l'autre)
    let statOn=false;
    const htmlStation=(v)=>jaugeHTML(v.cumul_15j, v.etat||"ok", v.choc);
    const iconStation=(v,html)=>L.divIcon({className:"stmk-wrap", html:html,
      // Icône plus large si thermomètre présent (jauge ~25 + thermo ~10) ; l'ancre
      // reste sur la jauge (le point station), le thermomètre déborde à droite.
      iconSize:[v.choc?35:25,46], iconAnchor:[12,23]});
    function tipStation(v){
      const et=v.etat||"ok";
      const etTxt=et==="muet"?" · ⚠ muette (HS probable)":(et==="lacunaire"?" · données lacunaires":"");
      const chocTxt=(v.choc&&v.choc.appel)?" · ❄ choc thermique + sol humide":"";
      const chocLvl=(v.choc&&v.choc.score!=null)?` · choc ${v.choc.score>0?"↓":v.choc.score<0?"↑":"="}${Math.abs(v.choc.score).toFixed(2)}`:"";
      return `${v.nom||v.num} · ${v.cumul_15j!=null?v.cumul_15j+" mm/15j":"—"}${etTxt}${chocTxt||chocLvl}`;
    }
    // Redessine le calque à la date courante : les marqueurs sont RÉUTILISÉS
    // (setIcon) plutôt que recréés, pour que l'animation du rejeu reste fluide.
    function dessinerStations(){
      const cur=vuesCourantes();
      const vus={};
      cur.liste.forEach(v=>{
        vus[v.num]=1;
        let mk=MK[v.num];
        const html=htmlStation(v), tip=tipStation(v);
        if(!mk){
          mk=MK[v.num]=L.marker([v.lat,v.lon],{icon:iconStation(v,html)});
          mk.bindTooltip(tip);
          mk.on("click",()=>montrerStation(mk.__v));   // détail dans le panneau latéral
          mk.__html=html; mk.__tip=tip;
        }else{
          // rendu incrémental : on ne touche au DOM que si le marqueur CHANGE
          // (la lecture du rejeu enchaîne les dates, inutile de tout refaire).
          if(mk.__html!==html){ mk.setIcon(iconStation(v,html)); mk.__html=html; }
          if(mk.__tip!==tip){ try{ mk.setTooltipContent(tip); }catch(e){} mk.__tip=tip; }
        }
        mk.__v=v;
        if(!statLayer.hasLayer(mk)) statLayer.addLayer(mk);
      });
      for(const num in MK){ if(!vus[num] && statLayer.hasLayer(MK[num])) statLayer.removeLayer(MK[num]); }
      majNoteStations(cur);
      return cur;
    }
    // Bandeau explicatif du contrôle : compte des badges ❄ et état du calque À LA
    // DATE AFFICHÉE (et non « aujourd'hui » comme avant, ce qui était trompeur).
    function majNoteStations(cur){
      const el=document.getElementById("stat-note"); if(!el) return;
      const L2=cur.liste;
      const nLac=L2.filter(v=>v.etat==="lacunaire").length;
      const nMuet=L2.filter(v=>v.etat==="muet").length;
      const nChoc=L2.filter(v=>v.choc&&v.choc.appel).length;
      const quand = cur.mode==="live" ? (cur.date?"au "+frDate(cur.date):"aujourd'hui")
                  : (cur.date? "au "+frDate(cur.date) : "");
      let bandeau="";
      if(cur.mode==="futur")      bandeau=`<b>Prévision</b> : pas d'observation de station dans le futur — le calque reprend dès qu'on revient à une date passée.`;
      else if(cur.mode==="load")  bandeau=`Chargement de l'historique des stations…`;
      else if(cur.mode==="idle")  bandeau=`<a href="#" id="stat-load">Charger l'historique des stations</a> pour suivre le curseur (${SH_REF&&SH_REF.postes?SH_REF.postes+" postes, ":""}~7 Mo).`;
      else if(cur.mode==="ko")    bandeau=`Historique des stations indisponible — le calque reste sur la photo du jour.`;
      else if(cur.mode==="hors")  bandeau=`Pas d'archive station avant le ${SH?frDate(SH.debut):"début"} — rien à montrer à cette date.`;
      else if(cur.mode==="retard")bandeau=`Dernières observations publiées : <b>${frDate(cur.date)}</b> (le paquet climato a 1 à 3 jours de retard).`;
      const compte = (cur.mode==="futur"||cur.mode==="load"||cur.mode==="idle"||cur.mode==="ko"||cur.mode==="hors")
        ? "" : `<br><span class="lgd choc">❄</span>choc thermique + sol humide (appel à pousse)${nChoc?` — <b>${nChoc}</b> station${nChoc>1?"s":""} ${quand}`:" — aucune "+quand}<br>
        <span class="lgd lac"></span>lacunaire · <span class="lgd muet"></span>muette (HS probable)${(nLac||nMuet)?` — ${nLac} lacunaire${nLac>1?"s":""}, ${nMuet} muette${nMuet>1?"s":""}`:" — toutes à jour"}`;
      el.innerHTML=`Pluviomètres + stations, source de la correction locale. Clic = détail.<br>
        🌡 thermomètre = niveau de choc thermique (<span style="color:#0d47a1;font-weight:700">bleu</span> refroidissement, <span style="color:#b2182b;font-weight:700">rouge</span> réchauffement ; stations principales seulement).${bandeau?"<br>"+bandeau:""}${compte}`;
      const a=document.getElementById("stat-load");
      if(a) a.addEventListener("click",e=>{ e.preventDefault(); chargerStationsHist(); });
      const p=document.getElementById("stat-pill");
      if(p) p.textContent = L2.length || STA.length;
    }
    // Point d'entrée appelé par appliquer() à chaque changement de date.
    majStationsHook=function(){
      if(!statOn) return;
      const cur=dessinerStations();
      // date passée + historique pas encore là : on le récupère (le calque est
      // ouvert ET l'utilisateur a bougé le curseur : l'intention est explicite).
      if(cur.mode==="idle") chargerStationsHist();
    };
    const statCtrl=L.control({position:"topright"});
    statCtrl.onAdd=function(){
      const div=L.DomUtil.create("div","statctrl");
      div.innerHTML=`<label style="display:flex;align-items:center;gap:6px;cursor:pointer">
        <input type="checkbox" id="stat-show"> 🌧️ Stations météo <span class="pill" id="stat-pill">${STA.length}</span></label>
        <div class="stat-note" id="stat-note"></div>`;
      L.DomEvent.disableClickPropagation(div);
      L.DomEvent.disableScrollPropagation(div);
      return div;
    };
    statCtrl.addTo(map);
    majNoteStations({liste:STA, date:D.stations_date, mode:"live"});
    const sc=document.getElementById("stat-show");
    if(sc) sc.addEventListener("change",e=>{
      statOn=e.target.checked;
      if(statOn){ const cur=dessinerStations(); statLayer.addTo(map);
                  if(cur.mode==="idle") chargerStationsHist(); }
      else map.removeLayer(statLayer);
    });
  }
}catch(_){}

// ============================================================================
// Ergonomie mobile : feuille glissante + contrôles repliés en icônes.
// Tout est gated par IS_MOBILE ; le bureau n'est pas affecté.
// ============================================================================
const IS_MOBILE = window.matchMedia("(max-width:760px)").matches;
if(IS_MOBILE){
  const sheet=document.querySelector("aside");
  const handle=document.getElementById("sheet-handle");
  let sheetState="collapsed";                 // collapsed | half | full
  const vh=()=>window.innerHeight;
  const anchorT=(s)=> s==="full"?0 : s==="half"?0.46*vh() : 0.88*vh()-104;
  function setSheet(s){
    sheetState=s; sheet.classList.remove("half","full");
    if(s!=="collapsed") sheet.classList.add(s);
    sheet.style.transform="";                 // rend la main au transform CSS
  }
  const expandSheet=()=>{ if(sheetState==="collapsed") setSheet("half"); };
  const collapseSheet=()=>setSheet("collapsed");

  // Glisser la poignée : suivi tactile puis aimantation sur l'ancre la plus proche.
  if(handle){
    let dragging=false, startY=0, startT=0, lastY=0, moved=0;
    const yOf=(e)=> e.touches? e.touches[0].clientY : e.clientY;
    function down(e){ dragging=true; startY=lastY=yOf(e); startT=anchorT(sheetState);
      moved=0; sheet.classList.add("dragging"); }
    function move(e){ if(!dragging) return; lastY=yOf(e); moved=Math.max(moved,Math.abs(lastY-startY));
      let t=Math.max(0,Math.min(0.88*vh()-40,startT+(lastY-startY)));
      sheet.style.transform="translateY("+t+"px)"; if(e.cancelable) e.preventDefault(); }
    function up(){ if(!dragging) return; dragging=false; sheet.classList.remove("dragging");
      if(moved<6){                            // tap : cycle réduite → moitié → pleine
        setSheet(sheetState==="collapsed"?"half":sheetState==="half"?"full":"collapsed"); return;
      }
      const t=startT+(lastY-startY);
      const anchors=[["full",0],["half",0.46*vh()],["collapsed",0.88*vh()-104]];
      let best=anchors[0]; anchors.forEach(a=>{ if(Math.abs(a[1]-t)<Math.abs(best[1]-t)) best=a; });
      setSheet(best[0]);
    }
    handle.addEventListener("touchstart",down,{passive:true});
    handle.addEventListener("touchmove",move,{passive:false});
    handle.addEventListener("touchend",up);
    handle.addEventListener("mousedown",down);
    window.addEventListener("mousemove",move);
    window.addEventListener("mouseup",up);
  }

  // Ouvrir la feuille quand on affiche un détail ; la réduire quand on cible la carte.
  const _ouvrir=ouvrirDetail;   ouvrirDetail   =function(){ _ouvrir.apply(this,arguments);   expandSheet(); };
  const _obs=montrerObs;        montrerObs     =function(){ _obs.apply(this,arguments);       expandSheet(); };
  const _stn=montrerStation;    montrerStation =function(){ _stn.apply(this,arguments);       expandSheet(); };
  const _form=formulaireObs;    formulaireObs  =function(){ _form.apply(this,arguments);      expandSheet(); };
  const _arm=armerCapture;      armerCapture   =function(){ _arm.apply(this,arguments);       collapseSheet(); };

  // Replie un contrôle Leaflet en bouton-icône (ouverture au tap).
  function makeCollapsible(el, icon){
    if(!el) return;
    const body=document.createElement("div"); body.className="mob-body";
    while(el.firstChild) body.appendChild(el.firstChild);   // conserve les écouteurs
    const toggle=document.createElement("button");
    toggle.type="button"; toggle.className="mob-toggle"; toggle.textContent=icon;
    el.classList.add("mob-collapse"); el.appendChild(toggle); el.appendChild(body);
    toggle.addEventListener("click",(ev)=>{ ev.stopPropagation();
      const open=el.classList.toggle("open");
      if(open) document.querySelectorAll(".mob-collapse.open").forEach(o=>{ if(o!==el) o.classList.remove("open"); });
    });
  }
  window.__mkCollapse=makeCollapsible;
  makeCollapsible(document.querySelector(".filtre"),  "🌲");
  makeCollapsible(document.querySelector(".obsctrl"), "🧺");
  makeCollapsible(document.querySelector(".rejeu"),   "🕒");
  makeCollapsible(document.querySelector(".statctrl"),"🌧️");
}

// BUREAU : largeur du panneau de droite ajustable (glisser la poignee gauche).
// Elargir le panneau elargit ET agrandit le graphique. Sans effet sur mobile.
// Place APRES le bloc mobile : ne peut donc pas empecher l'ergonomie tactile.

try{
  if(!IS_MOBILE){
    const mainEl=document.querySelector("main");
    const grip=document.getElementById("aside-resizer");
    const LS="champipi_asidew";
    const clampW=(w)=>Math.max(300,Math.min(w,Math.round(window.innerWidth*0.72)));
    function applyW(w){
      w=clampW(w);
      mainEl.style.setProperty("--aside-w", w+"px");
      mainEl.style.setProperty("--chart-h", Math.round(Math.min(340,Math.max(180,w*0.55)))+"px");
      if(chart) chart.resize();
      if(typeof map!=="undefined" && map && map.invalidateSize) map.invalidateSize(false);
    }
    try{ const s=localStorage.getItem(LS); if(s) applyW(parseInt(s,10)); }catch(_){}
    if(grip){
      let drag=false;
      const wOf=(e)=> window.innerWidth-(e.touches?e.touches[0].clientX:e.clientX);
      const readW=()=> parseInt(getComputedStyle(mainEl).getPropertyValue("--aside-w"),10)||340;
      function down(e){ drag=true; grip.classList.add("active");
        document.body.classList.add("aside-resizing"); if(e.cancelable)e.preventDefault(); }
      function mv(e){ if(!drag) return; applyW(wOf(e)); if(e.cancelable)e.preventDefault(); }
      function up(){ if(!drag) return; drag=false; grip.classList.remove("active");
        document.body.classList.remove("aside-resizing");
        try{ localStorage.setItem(LS,String(readW())); }catch(_){}
        if(chart) chart.resize();
        if(typeof map!=="undefined" && map && map.invalidateSize) map.invalidateSize(false); }
      grip.addEventListener("mousedown",down);
      window.addEventListener("mousemove",mv);
      window.addEventListener("mouseup",up);
      grip.addEventListener("dblclick",()=>{ applyW(340); try{ localStorage.removeItem(LS); }catch(_){} });
    }
    window.addEventListener("resize",()=>{ applyW(parseInt(getComputedStyle(mainEl).getPropertyValue("--aside-w"),10)||340); });
  }
}catch(e){ /* redimensionnement non-critique : ne doit jamais casser la page */ }

// ============================================================================
// MODE TERRAIN (PWA) : service worker + bandeau hors-ligne + « Préparer ma sortie ».
// En forêt le réseau est faible ou absent : le service worker (sw.js) sert la
// page, les librairies, les données et les tuiles déjà vues depuis le cache ;
// le bouton 🎒 pré-télécharge la zone visible AVANT de partir. Tout ce bloc est
// non-critique : enveloppé try/catch et placé en TOUTE FIN de script (après le
// bloc mobile), il ne peut pas casser la page.
// ============================================================================
try{
  const SW_OK = ("serviceWorker" in navigator) &&
    (location.protocol==="https:" || ["localhost","127.0.0.1"].includes(location.hostname));
  if(SW_OK) navigator.serviceWorker.register("./sw.js").catch(()=>{});

  // --- Bandeau hors-ligne : rappelle qu'on regarde une copie locale ---------
  const offband=document.createElement("div"); offband.id="offband";
  document.body.appendChild(offband);
  function majOffband(){
    const off = !navigator.onLine;
    offband.classList.toggle("on", off);
    if(off) offband.textContent = "📵 Hors-ligne — données du "
      + (frDate(D.date_donnees)||"dernier téléchargement")
      + " · carte limitée aux zones préparées";
  }
  window.addEventListener("online", majOffband);
  window.addEventListener("offline", majOffband);
  majOffband();

  // --- Vérification de mise à jour au lancement ----------------------------
  // Pourquoi : sur Android la PWA reste des jours en mémoire sans jamais être
  // « relancée », et quand le réseau rame le SW sert la page de la VEILLE
  // (réseau-d'abord avec délai 6 s, puis cache). On pouvait donc regarder des
  // données périmées sans le savoir. Principe : version.json (public, ~200 o,
  // jamais mis en cache) dit quelle génération est en ligne ; on la compare à
  // celle embarquée dans CETTE page (RAW.genere_le). Si elle diffère, le SW
  // télécharge la nouvelle page + les nouvelles versions des données déjà en
  // cache (message MAJ), puis on recharge : la page fraîche est servie du cache.
  const majband=document.createElement("div"); majband.id="majband";
  majband.innerHTML='<span class="majspin"></span><span id="majtxt"></span>'
    +'<button id="majbtn" hidden></button><span class="majbar"><i id="majfill"></i></span>';
  document.body.appendChild(majband);
  const majtxt=majband.querySelector("#majtxt"), majbtn=majband.querySelector("#majbtn"),
        majfill=majband.querySelector("#majfill");
  let majTimer=null, majGarde=null, majEnCours=false, majDerniere=0, interaction=false;
  ["pointerdown","keydown","wheel"].forEach(ev=>window.addEventListener(ev,()=>{interaction=true;},{passive:true}));
  // Affiche le bandeau. ms>0 = disparaît tout seul ; btn={label,fn} = bouton d'action.
  function majShow(cls, txt, ms, btn){
    clearTimeout(majTimer);
    majband.className="on "+cls; majtxt.textContent=txt; majfill.style.width="0";
    if(btn){ majbtn.hidden=false; majbtn.textContent=btn.label; majbtn.onclick=btn.fn; }
    else majbtn.hidden=true;
    if(ms) majTimer=setTimeout(()=>{ majband.className=""; }, ms);
  }
  const dateDonnees=(v)=>frDate((v&&v.date_donnees)||D.date_donnees)||"?";
  async function verifierMaj(){
    if(majEnCours || !navigator.onLine) return;
    majEnCours=true; majDerniere=Date.now();
    majShow("check","Vérification des données…");
    let v=null;
    try{
      const ctl=("AbortController" in window)?new AbortController():null;
      const t=setTimeout(()=>{ if(ctl) ctl.abort(); }, 8000);
      const r=await fetch("version.json?t="+Date.now(), {cache:"no-store", signal:ctl?ctl.signal:undefined});
      clearTimeout(t);
      if(r.ok) v=await r.json();
    }catch(_){}
    if(!v || !v.genere_le){
      majEnCours=false;
      majShow("warn","⚠ Vérification impossible (réseau ?) — données du "+dateDonnees(), 7000);
      return;
    }
    if(v.genere_le===RAW.genere_le){
      majEnCours=false;
      try{ localStorage.removeItem("champipi_maj_tentee"); }catch(_){}
      if(v.fraicheur && v.fraicheur!=="ok")
        majShow("warn","⚠ Dernière génération, mais des sources sont en retard — données du "+dateDonnees(v), 7000);
      else majShow("ok","✅ À jour — données du "+dateDonnees(v), 4000);
      return;
    }
    // Une génération plus récente est en ligne.
    // Anti-boucle : si on vient DÉJÀ de télécharger cette génération et que la
    // page servie est toujours l'ancienne (CDN GitHub Pages pas encore à jour,
    // délai jusqu'à ~10 min), on ne recommence pas en boucle.
    let tentee=null; try{ tentee=localStorage.getItem("champipi_maj_tentee"); }catch(_){}
    if(tentee===v.genere_le){
      majEnCours=false;
      majShow("warn","⚠ Nouvelle version en ligne, pas encore servie par le réseau — données du "+dateDonnees(), 0,
        {label:"Réessayer", fn:()=>{ try{ localStorage.removeItem("champipi_maj_tentee"); }catch(_){} verifierMaj(); }});
      return;
    }
    try{ localStorage.setItem("champipi_maj_tentee", v.genere_le); }catch(_){}
    if(!SW_OK){
      majEnCours=false;
      majShow("dl","⬇ Nouvelles données du "+dateDonnees(v)+" disponibles", 0,
        {label:"Recharger", fn:()=>location.reload()});
      return;
    }
    majShow("dl","⬇ Nouvelles données ("+dateDonnees(v)+") — téléchargement…");
    try{
      const reg=await navigator.serviceWorker.ready;
      if(!reg.active) throw new Error("sw");
      reg.active.postMessage({type:"MAJ", id:"maj", fichiers:v.fichiers||[]});
      // Garde-fou : réseau qui s'effondre en cours de route.
      majGarde=setTimeout(()=>{
        if(!majEnCours) return; majEnCours=false;
        majShow("warn","⚠ Téléchargement trop long — tu restes sur les données du "+dateDonnees(), 0,
          {label:"Réessayer", fn:verifierMaj});
      }, 90000);
    }catch(_){
      majEnCours=false;
      majShow("warn","⚠ Mise à jour impossible — données du "+dateDonnees(), 0,
        {label:"Recharger", fn:()=>location.reload()});
    }
  }
  function finMaj(m){
    clearTimeout(majGarde); majEnCours=false;
    if(!m.page_ok){
      majShow("warn","⚠ Téléchargement échoué — données du "+dateDonnees(), 0,
        {label:"Réessayer", fn:verifierMaj});
      return;
    }
    // Page fraîche en cache : on recharge tout de suite si l'utilisateur n'a
    // encore rien touché (il attend l'app), sinon on le laisse choisir.
    if(!interaction){ majShow("ok","✅ Nouvelles données prêtes — actualisation…"); setTimeout(()=>location.reload(), 600); }
    else majShow("ok","✅ Nouvelles données prêtes", 0, {label:"Afficher", fn:()=>location.reload()});
  }
  if(SW_OK) navigator.serviceWorker.addEventListener("message",(ev)=>{
    const m=ev.data||{}; if(m.id!=="maj") return;
    if(m.type==="PRECACHE_PROGRESS"){
      majfill.style.width=Math.round(100*m.fait/Math.max(1,m.total))+"%";
      majtxt.textContent="⬇ Téléchargement… "+m.fait+" / "+m.total;
    }else if(m.type==="PRECACHE_FIN") finMaj(m);
  });
  // Au lancement (une fois le SW enregistré, sinon le message MAJ n'a personne
  // à qui parler), puis à chaque retour au premier plan après > 10 min (PWA
  // Android gardée en mémoire) et au retour du réseau (> 2 min après le dernier).
  setTimeout(verifierMaj, SW_OK?1500:0);
  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="visible" && Date.now()-majDerniere>10*60000) verifierMaj();
  });
  window.addEventListener("online",()=>{ if(Date.now()-majDerniere>2*60000) verifierMaj(); });

  // --- « Préparer ma sortie » ----------------------------------------------
  // Énumération des tuiles de la vue courante (Web-Mercator standard), du zoom
  // actuel vers les zooms « terrain », plafonnée : on n'aspire pas un serveur
  // de tuiles public. D'où le conseil : zoomer sur son coin avant de préparer.
  const TUILE_CAP=450, TUILE_KO=22, PREP_LS="champipi_prep";
  function tuileXY(ll,z){ const n=Math.pow(2,z);
    return { x:Math.floor((ll.lng+180)/360*n),
             y:Math.floor((1-Math.log(Math.tan(ll.lat*Math.PI/180)+1/Math.cos(ll.lat*Math.PI/180))/Math.PI)/2*n) }; }
  // Même choix de sous-domaine que Leaflet ((x+y) mod 3) : l'URL pré-chargée est
  // EXACTEMENT celle que la carte demandera (le SW neutralise de toute façon a/b/c).
  function urlTuile(x,y,z){
    if(typeof fondSat!=="undefined" && map.hasLayer(fondSat))
      return "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/"+z+"/"+y+"/"+x;
    const s="abc"[Math.abs(x+y)%3];
    const h=(typeof fondOSM!=="undefined" && map.hasLayer(fondOSM))?"tile.openstreetmap.org":"tile.opentopomap.org";
    return "https://"+s+"."+h+"/"+z+"/"+x+"/"+y+".png";
  }
  function planTuiles(){
    const b=map.getBounds(), z0=Math.max(8,Math.round(map.getZoom()));
    const zMax=Math.min(map.hasLayer(fondSat)?18:17,16);
    const urls=[], zs=[];
    for(let z=z0; z<=zMax && urls.length<TUILE_CAP; z++){
      const a=tuileXY(b.getNorthWest(),z), c=tuileXY(b.getSouthEast(),z);
      const n=(c.x-a.x+1)*(c.y-a.y+1);
      if(z>z0 && urls.length+n>TUILE_CAP) break;   // niveau suivant entier, ou rien
      let plein=false;
      for(let x=a.x; x<=c.x && !plein; x++) for(let y=a.y; y<=c.y; y++){
        urls.push(urlTuile(x,y,z));
        if(urls.length>=TUILE_CAP){ plein=true; break; }
      }
      zs.push(z);
    }
    return {urls, zs};
  }
  function listeData(avecHist){
    const vis=DEPTS.filter(d=>deptVisible(d)), out=[];
    vis.forEach(d=>{ if(d.geom) out.push(d.geom); });
    if(avecHist) vis.forEach(d=>{ if(d.hist) out.push(d.hist); });
    return out;
  }

  // Contrôle 🎒 (topleft, sous le bouton GPS) : bouton -> panneau repliable.
  const prepCtrl=L.control({position:"topleft"});
  let prepDiv=null;
  prepCtrl.onAdd=function(){
    const root=L.DomUtil.create("div","prepctrl");
    root.innerHTML=`<button id="prep-btn" type="button" title="Préparer ma sortie (hors-ligne)" aria-label="Préparer ma sortie">🎒</button>
      <div class="prep" id="prep-pane" style="display:none">
        <div class="prep-h">🎒 <b>Préparer ma sortie</b><button id="prep-x" type="button">fermer</button></div>
        <div>Met en cache la <b>zone visible</b> pour consulter la carte sans réseau, en forêt. Zoome d'abord sur ton coin.</div>
        <div class="est" id="prep-est"></div>
        <label><input type="checkbox" id="prep-hist"> Inclure l'historique (rejeu, ~3&nbsp;Mo/dépt)</label>
        <button class="go" id="prep-go" type="button">Télécharger la zone visible</button>
        <div class="bar" id="prep-barw"><i id="prep-bar"></i></div>
        <div class="etat" id="prep-etat"></div>
        <div class="note">Astuce : fais-le en wifi/4G avant de partir. Tes cueillettes saisies sur le terrain restent enregistrées sur l'appareil, réseau ou pas.</div>
      </div>`;
    L.DomEvent.disableClickPropagation(root);
    L.DomEvent.disableScrollPropagation(root);
    prepDiv=root;
    return root;
  };
  prepCtrl.addTo(map);

  const $p=id=>document.getElementById(id);
  function majEstimation(){
    const est=$p("prep-est"); if(!est || $p("prep-pane").style.display==="none") return;
    const plan=planTuiles();
    const nData=listeData($p("prep-hist").checked).length;
    const mo=(plan.urls.length*TUILE_KO/1024 + nData*2.5).toFixed(1);
    est.textContent="Vue actuelle : "+plan.urls.length+" tuiles (zooms "
      +plan.zs[0]+"→"+plan.zs[plan.zs.length-1]+") + "+nData+" fichier(s) de données ≈ "+mo+" Mo.";
  }
  function etatInitial(){
    try{ const p=JSON.parse(localStorage.getItem(PREP_LS)||"null");
      if(p && p.quand) $p("prep-etat").textContent="Dernière préparation : "+p.quand+" ("+p.n+" éléments).";
    }catch(_){}
  }
  $p("prep-btn").addEventListener("click",()=>{
    const pane=$p("prep-pane");
    const ouvert=pane.style.display!=="none";
    pane.style.display=ouvert?"none":"block";
    if(!ouvert){ majEstimation(); etatInitial();
      if(!SW_OK) { $p("prep-go").disabled=true; $p("prep-etat").textContent="Indisponible ici (nécessite le site https)."; } }
  });
  $p("prep-x").addEventListener("click",()=>{ $p("prep-pane").style.display="none"; });
  $p("prep-hist").addEventListener("change",majEstimation);
  map.on("moveend",majEstimation);

  async function lancerPrep(){
    const go=$p("prep-go"), etat=$p("prep-etat"), barw=$p("prep-barw"), bar=$p("prep-bar");
    go.disabled=true; etat.textContent="Préparation…"; barw.style.display="block"; bar.style.width="0";
    try{
      // Demande au navigateur de NE PAS purger ce cache sous pression disque.
      try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(_){}
      const reg=await navigator.serviceWorker.ready;
      if(!reg.active) throw new Error("sw");
      const plan=planTuiles();
      reg.active.postMessage({type:"PRECACHE", id:"prep", page:true,
        data:listeData($p("prep-hist").checked), tuiles:plan.urls});
    }catch(_){
      etat.textContent="Échec : service worker indisponible. Recharge la page puis réessaie.";
      go.disabled=false; barw.style.display="none";
    }
  }
  $p("prep-go").addEventListener("click",lancerPrep);

  if(SW_OK) navigator.serviceWorker.addEventListener("message",(ev)=>{
    const m=ev.data||{}, etat=$p("prep-etat"), bar=$p("prep-bar");
    if(m.id && m.id!=="prep") return;      // réponses de la mise à jour (id "maj") : pas pour ce panneau
    if(m.type==="PRECACHE_PROGRESS"){
      if(bar) bar.style.width=Math.round(100*m.fait/Math.max(1,m.total))+"%";
      if(etat) etat.textContent="Téléchargement… "+m.fait+" / "+m.total;
    }else if(m.type==="PRECACHE_FIN"){
      const quand=new Date().toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
      try{ localStorage.setItem(PREP_LS,JSON.stringify({quand,n:m.ok})); }catch(_){}
      if(etat) etat.textContent = m.echecs
        ? "Zone préparée ("+m.ok+"/"+m.total+" — "+m.echecs+" échec(s), réessaie avec du réseau)."
        : "✅ Zone prête pour le hors-ligne ("+m.ok+" éléments).";
      const go=$p("prep-go"); if(go) go.disabled=false;
    }
  });
}catch(e){ /* le mode terrain ne doit JAMAIS empêcher la carte de s'afficher */ }

// ============================================================================
// FRAÎCHEUR DES DONNÉES : prévenir quand la carte ne reflète plus la météo.
// Deux regards complémentaires :
//   1. côté robot (dept.fraicheur) : chaque SOURCE est-elle à jour au moment de
//      la génération (SIM, pluviomètres, Open-Meteo, historique, prévision) ;
//   2. côté page : l'ÂGE de la donnée affichée par rapport à l'horloge du
//      téléphone — indispensable pour une copie servie du cache (PWA) ou un
//      robot qui n'a pas tourné depuis plusieurs jours (action GitHub en panne).
// Non-critique : try/catch, en toute fin de script.
// ============================================================================
try{
  const FR_RETARD=3, FR_PERIME=6;          // âge (jours) de la donnée SIM affichée
  const box=document.getElementById("fraich-box"), dd=document.getElementById("dept-date");
  const jours=(iso)=>{ if(!iso) return null;
    const a=new Date(iso+"T12:00:00"), b=new Date(aujourdhui()+"T12:00:00");
    return Math.round((b-a)/86400000); };
  function evaluerFraicheur(){
    const msgs=[]; let niv="ok";
    const monte=(n)=>{ const o={ok:0,retard:1,perime:2}; if(o[n]>o[niv]) niv=n; };
    // 1. verdict du robot, tous départements (messages dédoublonnés)
    for(const code in DEPTDATA){
      const f=(DEPTDATA[code]||{}).fraicheur; if(!f) continue;
      if(f.etat==="perime"||f.etat==="absent") monte("perime"); else if(f.etat==="retard") monte("retard");
      (f.avertissements||[]).forEach(m=>{ if(!msgs.includes(m)) msgs.push(m); });
    }
    // 2. âge de la donnée affichée (horloge locale)
    const age=jours(D.date_donnees);
    if(age===null){ monte("perime"); msgs.unshift("Aucune date de données : la carte est à prendre avec réserve."); }
    else if(age>FR_PERIME){ monte("perime"); msgs.unshift("La carte date du "+frDate(D.date_donnees)+" ("+age+" j) : elle ne reflète plus la météo actuelle — la mise à jour automatique n'a probablement pas tourné."); }
    else if(age>FR_RETARD){ monte("retard"); msgs.unshift("La carte date du "+frDate(D.date_donnees)+" ("+age+" j de retard)."); }
    return {niv, msgs};
  }
  function afficherFraicheur(){
    const {niv,msgs}=evaluerFraicheur();
    if(dd){ dd.classList.toggle("stale", niv!=="ok"); dd.classList.toggle("bad", niv==="perime");
      dd.title = niv==="ok" ? "" : msgs.join("\n"); }
    if(!box) return;
    if(niv==="ok" || !msgs.length){ box.className="fraich"; box.innerHTML=""; return; }
    // l'utilisateur peut replier l'encadré pour cette génération (pas pour toujours)
    let cache=null; try{ cache=sessionStorage.getItem("champipi_fraich_ferme"); }catch(_){}
    if(cache===RAW.genere_le){ box.className="fraich"; return; }
    box.className="fraich on"+(niv==="perime"?" bad":"");
    box.innerHTML="<b>"+(niv==="perime"?"⛔ Données périmées":"⚠ Données en retard")+"</b><ul>"
      +msgs.map(m=>"<li>"+m.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</li>").join("")+"</ul>"
      +"<button class='fx' title='Masquer'>✕</button>";
    box.querySelector(".fx").onclick=()=>{ box.className="fraich";
      try{ sessionStorage.setItem("champipi_fraich_ferme", RAW.genere_le); }catch(_){} };
  }
  afficherFraicheur();
  // l'âge change à minuit ou après une longue veille de la PWA : on réévalue
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") afficherFraicheur(); });
}catch(e){ /* jamais bloquant */ }
</script>
</body>
</html>
