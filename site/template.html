<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Champipi — Cèpes en Lozère</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<!-- Lecture des métadonnées photo (EXIF/GPS) : JPEG + HEIC (iPhone) + PNG. Si ce
     CDN ne répond pas, l'import photo bascule en saisie manuelle (marquer + dater). -->
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<style>
  :root{
    --n0:#9e9e9e; --n1:#b71c1c; --n2:#ef6c00; --n3:#f9a825; --n4:#7cb342; --n5:#2e7d32;
    --bg:#f5f4f0; --panel:#ffffff; --ink:#2b2b28; --muted:#6b6b63; --line:#e2e0da;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
  #app{display:flex;flex-direction:column;height:100%}
  header{padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:14px}
  header h1{font-size:18px;margin:0;font-weight:650}
  header h1 span{opacity:.55;font-weight:400}
  .dept{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:13px;color:var(--muted)}
  .badge{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:20px;background:#f0efe9;font-weight:600;color:var(--ink)}
  .dot{width:12px;height:12px;border-radius:50%}
  main{flex:1;display:flex;min-height:0;position:relative}
  #map{flex:1;min-width:0}
  aside{position:relative;width:var(--aside-w,340px);max-width:72vw;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:16px}
  aside h2{font-size:15px;margin:0 0 4px}
  .hint{color:var(--muted);font-size:13px;line-height:1.5}
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
  .metric{background:#faf9f5;border:1px solid var(--line);border-radius:10px;padding:9px 11px}
  .metric .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .metric .v{font-size:19px;font-weight:650;margin-top:2px}
  .chartwrap{margin-top:10px;height:var(--chart-h,180px)}
  /* Poignee de largeur du panneau (bureau) — logique dans le bloc JS de fin */
  .aside-resizer{position:absolute;top:0;bottom:0;right:var(--aside-w,340px);width:10px;margin-right:-5px;
    cursor:ew-resize;z-index:800;display:flex;align-items:center;justify-content:center;background:transparent;transition:background .12s}
  .aside-resizer::before{content:"";width:3px;height:36px;border-radius:3px;background:var(--line);transition:background .12s}
  .aside-resizer:hover,.aside-resizer.active{background:rgba(46,125,50,.07)}
  .aside-resizer:hover::before,.aside-resizer.active::before{background:#2e7d32}
  body.aside-resizing{cursor:ew-resize;user-select:none}
  .top{margin-top:8px;font-size:13px}
  .top .row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
  .legend{font-size:12px;color:var(--muted);line-height:1.9;margin-top:14px}
  .legend .li{display:flex;align-items:center;gap:8px}
  .foot{margin-top:16px;font-size:11px;color:var(--muted);line-height:1.6;border-top:1px solid var(--line);padding-top:10px}
  .synth{background:#eef5ee;border:1px solid #cfe3cf;border-radius:10px;padding:10px 12px;margin:6px 0 12px;font-size:13px;line-height:1.5}
  .synth:empty{display:none}
  .synth-t{font-weight:700;margin-bottom:4px}
  .synth-s{margin-top:4px;color:var(--muted)}
  .synth-n{margin-top:6px;font-size:11px;color:var(--muted);font-style:italic}
  .synth b{color:#1b5e20}
  .pill{font-size:11px;padding:2px 8px;border-radius:20px;background:#f0efe9;color:var(--muted)}
  /* Filtre essences (contrôle superposé à la carte) */
  .filtre{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:10px;
    padding:8px 10px;font-size:12px;box-shadow:0 1px 6px rgba(0,0,0,.12);max-width:200px}
  .filtre-h{display:flex;align-items:center;justify-content:space-between;font-weight:650;margin-bottom:4px}
  .filtre-h button{border:none;background:none;color:var(--muted);font-size:11px;cursor:pointer;padding:0}
  .filtre .grp-t{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:6px 0 2px}
  .filtre label{display:flex;align-items:center;gap:6px;padding:2px 0;cursor:pointer;line-height:1.2}
  .filtre input{margin:0;cursor:pointer}
  .filtre .sw{width:12px;height:12px;border-radius:3px;background:#2e7d32;flex:none;border:1px solid rgba(0,0,0,.15)}
  /* Curseur temporel (rejeu de l'historique) */
  .rejeu{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:10px;
    padding:8px 12px;font-size:12px;box-shadow:0 1px 6px rgba(0,0,0,.12);min-width:320px}
  .rejeu-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .rejeu-h b{font-weight:650}
  .rejeu-d{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
  .rejeu-row{display:flex;align-items:center;gap:6px}
  .rejeu-row2{display:flex;align-items:center;gap:6px;margin-top:6px}
  .rejeu input[type=range]{flex:1;cursor:pointer;accent-color:#2e7d32;min-width:80px}
  .rj-tag{font-size:10px;color:var(--muted);width:42px;flex:none;text-transform:uppercase;letter-spacing:.03em}
  .rejeu input[type=date]{flex:1;font-size:12px;padding:2px 5px;border:1px solid var(--line);
    border-radius:6px;color:var(--ink);background:#fff;min-width:0}
  .rejeu button{border:1px solid var(--line);background:#faf9f5;border-radius:7px;
    padding:3px 7px;font-size:12px;cursor:pointer;color:var(--ink);line-height:1}
  .rejeu button:hover{background:#f0efe9}
  .rejeu .note{margin-top:5px;font-size:10.5px;color:var(--muted);line-height:1.4}
  /* Contrôle Cueillettes (observations) */
  .obsctrl{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:10px;
    padding:8px 10px;font-size:12px;box-shadow:0 1px 6px rgba(0,0,0,.12);min-width:180px}
  .obs-h{display:flex;align-items:center;gap:6px;font-weight:650;margin-bottom:6px}
  .obs-h span{margin-left:auto;background:#f0efe9;border-radius:20px;padding:1px 8px;font-weight:600}
  .obs-row{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap}
  .obsctrl button,.obs-imp{border:1px solid var(--line);background:#faf9f5;border-radius:7px;
    padding:3px 8px;font-size:12px;cursor:pointer;color:var(--ink);line-height:1}
  .obsctrl button:hover,.obs-imp:hover{background:#f0efe9}
  .obs-row label{display:flex;align-items:center;gap:4px;cursor:pointer}
  .obsform label{display:block;font-size:12px;margin:8px 0 2px;color:var(--muted)}
  .obsform input,.obsform select,.obsform textarea{width:100%;font-size:13px;padding:5px 7px;
    border:1px solid var(--line);border-radius:7px;color:var(--ink);background:#fff;box-sizing:border-box}
  .obsform .rrow{display:flex;align-items:center;gap:10px}
  .obsform .rval{font-size:20px;font-weight:700;min-width:44px;text-align:center}
  .obsbtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .obsbtns button{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px;font-size:13px;cursor:pointer}
  .obsbtns .ok{background:#2e7d32;color:#fff;border-color:#2e7d32;font-weight:650}
  .obsbtns .del{background:#fff;color:#b71c1c;border-color:#e0b4b4}
  /* Poignée de la feuille glissante (masquée sur bureau) */
  .sheet-handle{display:none}
  /* Enveloppe des contrôles repliables : transparente sur bureau */
  .mob-body{display:contents}
  .mob-toggle{display:none}

  /* Bouton « ma position » (géolocalisation) */
  .locctrl button{width:34px;height:34px;font-size:18px;line-height:1;border:none;
    background:#fff;color:#1976d2;cursor:pointer;border-radius:7px;
    box-shadow:0 1px 4px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center}
  .locctrl button:hover{background:#f2f1ec}
  .locctrl button:disabled{opacity:.5;cursor:default}
  /* Calque « stations météo » (pluviomètres source de la correction) */
  .statctrl{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:10px;
    padding:7px 9px;font-size:12px;box-shadow:0 1px 6px rgba(0,0,0,.12);max-width:210px}
  .statctrl .pill{background:#f0efe9;border-radius:20px;padding:1px 7px;font-weight:600}
  .statctrl input{margin:0;cursor:pointer}
  .stat-note{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.3}
  /* Marqueur station = petite jauge verticale à 4 cellules, remplie selon la pluie */
  .stmk-wrap{background:none;border:none}
  .stmk{position:relative;display:flex;flex-direction:column-reverse;gap:2px;width:17px;padding:2px;cursor:pointer;
    background:#fff;border:2px solid rgba(20,40,60,.7);border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.5)}
  .stmk i{display:block;height:8px;border-radius:2px;background:#dbe1e6;box-shadow:inset 0 0 0 1px rgba(0,0,0,.10)}
  .stmk:hover{border-color:#0d47a1;box-shadow:0 2px 8px rgba(13,71,161,.6)}
  /* Pastille de fraîcheur (levier 1) : rien si à jour, orange si lacunaire,
     gris + marqueur atténué si muette (probablement hors service). */
  .stmk .stdot{position:absolute;top:-5px;right:-5px;width:9px;height:9px;border-radius:50%;
    border:1.5px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.5);z-index:2}
  .stmk .stdot.lac{background:#f9a825}
  .stmk .stdot.muet{background:#9e9e9e}
  .stmk.muet{opacity:.55;filter:grayscale(.45)}
  /* Badge « choc thermique + sol humide » (appel à pousse) : flocon en coin
     haut-gauche + anneau bleu autour du marqueur, pour le repérer d'un coup d'œil. */
  .stmk.choc{border-color:#1565c0;box-shadow:0 0 0 2px rgba(21,101,192,.35),0 2px 8px rgba(21,101,192,.55)}
  .stmk .stchoc{position:absolute;top:-7px;left:-7px;width:14px;height:14px;border-radius:50%;
    background:#1565c0;color:#fff;font-size:9px;line-height:14px;text-align:center;
    border:1.5px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.5);z-index:3}
  .statctrl .lgd{display:inline-block;width:9px;height:9px;border-radius:50%;
    border:1px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25);vertical-align:-1px;margin-right:2px}
  .statctrl .lgd.lac{background:#f9a825} .statctrl .lgd.muet{background:#9e9e9e}
  .statctrl .lgd.choc{background:#1565c0;color:#fff;font-size:8px;line-height:9px;text-align:center;border-radius:50%}
  /* Graphe de température (bande TN–TX + point TM) dans le panneau station */
  .tbars{position:relative;display:flex;align-items:stretch;gap:3px;height:120px;
    padding:4px 0 2px;margin-top:2px}
  .tbars .tcol{flex:1;position:relative;min-width:0}
  .tbars .trange{position:absolute;left:50%;transform:translateX(-50%);width:5px;
    border-radius:3px;background:linear-gradient(#e53935,#1e88e5)}
  .tbars .tmid{position:absolute;left:50%;transform:translate(-50%,50%);width:9px;height:9px;
    border-radius:50%;background:#fff;border:2px solid #37474f;z-index:2}
  .tbars .tref{position:absolute;left:0;right:0;border-top:1px dashed #b0bec5;font-size:8px;
    color:var(--muted);pointer-events:none}
  .tbars .tref.gel{border-top:1px solid #1565c0}
  .tbars .tband{position:absolute;left:0;right:0;background:rgba(46,125,50,.10);pointer-events:none}
  .tbars .tref span{position:absolute;right:0;top:-9px;background:var(--card,#fff);padding:0 2px}
  .tdays{display:flex;gap:3px;margin-top:1px}
  .tdays .td{flex:1;font-size:8px;color:var(--muted);text-align:center;min-width:0}
  /* Barres de pluie (fenêtre d'affichage) dans le panneau latéral (clic station) */
  .stbars{display:flex;align-items:flex-end;gap:3px;height:98px;padding:6px 0 2px}
  .stbars .sbar2{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .stbars .sbar2 i{display:block;width:100%;max-width:16px;border-radius:2px 2px 0 0;background:#cfd8dc}
  .stbars .sbar2 .mm{font-size:8px;line-height:1;margin-bottom:2px;min-height:9px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .stbars .sbar2 .mm.on{color:#0d47a1;font-weight:650}
  .stbars .sbar2 .mm.off{color:#c7ccd1}
  .stbars .sbar2 .d{font-size:8px;color:var(--muted);margin-top:3px}
  /* ====================== MOBILE ====================== */
  @media(max-width:760px){
    header{padding:9px 14px;gap:8px}
    header h1{font-size:16px}
    .dept{font-size:12px;gap:6px}

    /* La carte occupe tout l'espace ; la feuille se superpose. */
    main{display:block;position:relative}
    #map{position:absolute;inset:0;height:100%}
    .aside-resizer{display:none}          /* pas de redimensionnement de largeur sur mobile */
    .chartwrap{height:180px}              /* la feuille glissante gere sa propre hauteur */

    /* --- Feuille glissante (bottom sheet) --- */
    aside{
      position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;max-width:none;
      height:88vh;border-left:none;border-top:none;border-radius:16px 16px 0 0;
      box-shadow:0 -4px 24px rgba(0,0,0,.18);padding:0 16px 24px;
      transform:translateY(calc(88vh - 104px));  /* réduite : ~104px visibles */
      transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:1200;
      overflow:hidden;
    }
    aside.dragging{transition:none}
    aside.half{transform:translateY(46vh)}
    aside.full{transform:translateY(0)}
    /* Contenu défilable seulement quand la feuille est ouverte. */
    #detail,#foot{overflow-y:auto}
    aside.full #detail{max-height:calc(88vh - 64px);overflow-y:auto}
    aside.half #detail{max-height:38vh;overflow-y:auto}

    .sheet-handle{
      display:block;position:sticky;top:0;background:var(--panel);
      padding:10px 0 8px;cursor:grab;z-index:2;touch-action:none;
    }
    .sheet-handle::before{
      content:"";display:block;width:44px;height:5px;border-radius:3px;
      background:#cfcdc4;margin:0 auto;
    }

    /* Cibles tactiles plus grandes dans le panneau */
    .metrics{gap:10px}
    .metric{padding:11px 12px}
    .metric .v{font-size:20px}
    .top .row{padding:9px 0}
    .obsbtns button,.obsform input,.obsform select,.obsform textarea{
      padding:11px;font-size:15px}
    #d-back,#o-back{padding:8px 12px!important;font-size:14px!important}

    /* --- Contrôles repliés en boutons-icônes --- */
    .leaflet-top,.leaflet-bottom{z-index:1100}
    /* Remonter les contrôles du bas au-dessus de la feuille réduite */
    .leaflet-bottom{bottom:112px}
    .leaflet-control-layers{margin-bottom:6px!important}
    /* Bouton position plus grand au doigt */
    .locctrl button{width:42px;height:42px;font-size:22px;border-radius:50%}

    .mob-collapse{
      padding:0!important;min-width:0!important;width:auto!important;
      border-radius:27px!important;box-shadow:0 2px 8px rgba(0,0,0,.22)!important;
    }
    .mob-collapse .mob-body{display:none}
    .mob-toggle{
      display:flex;align-items:center;justify-content:center;
      width:46px;height:46px;font-size:22px;line-height:1;
      border:none;background:transparent;cursor:pointer;padding:0;border-radius:27px;
    }
    .mob-collapse.open{
      padding:10px 12px!important;border-radius:14px!important;
      max-width:78vw!important;width:auto!important;
    }
    .mob-collapse.open .mob-body{display:block;max-height:52vh;overflow:auto}
    .mob-collapse.open .mob-toggle{
      width:100%;height:auto;justify-content:flex-end;padding:0 0 6px;font-size:18px;
    }
    .mob-collapse.open .mob-toggle::after{content:"✕";margin-left:6px;color:var(--muted);font-size:15px}
    .rejeu.mob-collapse.open{min-width:0;width:78vw!important}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🍄 Champipi <span>· cèpes en Lozère</span></h1>
    <div class="dept">
      <span id="dept-date"></span>
      <span class="badge"><span class="dot" id="dept-dot"></span><span id="dept-val"></span></span>
    </div>
  </header>
  <main>
    <div id="map"></div>
    <div class="aside-resizer" id="aside-resizer" title="Glisser pour elargir le panneau (double-clic : largeur par defaut)"></div>
    <aside>
      <div class="sheet-handle" id="sheet-handle" title="Glisser pour ouvrir/fermer"></div>
      <div id="detail">
        <h2>Indice du jour</h2>
        <p class="hint">Cliquez une maille sur la carte pour voir son indice cèpe, ses composantes et l'évolution sur 15 jours.</p>
        <div class="metrics">
          <div class="metric"><div class="k">Moyenne 48</div><div class="v" id="m-moy">—</div></div>
          <div class="metric"><div class="k">Meilleure maille</div><div class="v" id="m-best">—</div></div>
        </div>
        <div id="lune-box"></div>
        <div class="synth" id="prev-synth"></div>
        <div class="top" id="top-zones"></div>
        <div class="legend" id="legend"></div>
      </div>
      <div class="foot" id="foot"></div>
    </aside>
  </main>
</div>
<script>
const CHAMPIPI = /*__CHAMPIPI_DATA__*/null;

const NIVEAUX = [
  {max:15, label:"très faible", col:"var(--n1)"},
  {max:35, label:"faible",      col:"var(--n2)"},
  {max:55, label:"moyen",       col:"var(--n3)"},
  {max:75, label:"bon",         col:"var(--n4)"},
  {max:Infinity, label:"excellent", col:"var(--n5)"},
];
function couleur(indice){
  if(indice===null||indice===undefined||Number.isNaN(indice)) return "#9e9e9e";
  return (NIVEAUX.find(n=>indice<n.max)||NIVEAUX[NIVEAUX.length-1]).col
    .replace("var(--n1)","#b71c1c").replace("var(--n2)","#ef6c00")
    .replace("var(--n3)","#f9a825").replace("var(--n4)","#7cb342").replace("var(--n5)","#2e7d32");
}

// ============================================================================
// BOOTSTRAP MULTI-DÉPARTEMENT (b)
// La page n'embarque plus que le SIGNAL DU JOUR (léger, chiffré). La géométrie
// (geom_XX.json, statique, public) et l'historique long (hist_XX.json) sont des
// fichiers externes chargés à la demande. `D` est reconstruit ici à la forme
// qu'attend le reste du code, en fusionnant les départements chargés.
const RAW      = CHAMPIPI || {};
const PARAMS   = RAW.params || {};
const DEPTS    = RAW.departements || [];        // registre : {code,nom,bbox,geom,hist}
const DEPTDATA = RAW.dept || {};                // signal du jour par département
const LOADED_GEOM = {};                          // code -> true quand geom chargée
let   HIST_STATE  = "absent";                    // absent | chargement | pret

const D = {
  genere_le:       RAW.genere_le,
  lag_indicatif:   PARAMS.lag_indicatif,
  versant_k:       PARAMS.versant_k,
  choc:            PARAMS.choc,
  essence_groupes: PARAMS.essence_groupes || [],
  mailles:{}, top:[], stations:[], stations_date:null,
  prevision:null, historique:null,
  geojson:{type:"FeatureCollection", features:[]},
  date_donnees:null, moyenne_departement:null, niveau_departement:null, nb_mailles:0,
};

// Fusionne le signal du jour (inline) de tous les départements présents. Les id
// de maille SAFRAN sont uniques au niveau national -> fusion de dicts sûre. La
// moyenne et le top sont recalculés sur l'ensemble chargé.
function mergeDeptInline(){
  const mailles={}; let top=[], stations=[], nb=0, dd=null, sdate=null;
  let prevDates=null; const prevMailles={};
  for(const code in DEPTDATA){
    const dp=DEPTDATA[code]||{};
    Object.assign(mailles, dp.mailles||{});
    (dp.top||[]).forEach(t=>top.push(t));
    (dp.stations||[]).forEach(s=>{ if(!stations.some(x=>x.num===s.num)) stations.push(s); });
    if(dp.stations_date) sdate=dp.stations_date;
    nb += dp.nb_mailles||0;
    if(dp.date_donnees && (!dd || dp.date_donnees>dd)) dd=dp.date_donnees;
    if(dp.prevision && dp.prevision.dates){
      prevDates=dp.prevision.dates; Object.assign(prevMailles, dp.prevision.mailles||{});
    }
  }
  D.mailles=mailles; D.stations=stations; D.stations_date=sdate;
  D.nb_mailles=nb; D.date_donnees=dd;
  let s=0,n=0; for(const mid in mailles){const v=mailles[mid].indice; if(v!=null){s+=v;n++;}}

// --- Rejeu temporel (historique long) --------------------------------------
// Force de la modulation versant, embarquée par le robot (miroir de VERSANT_K).
const VERSANT_K = (D.versant_k!=null? D.versant_k : 0.40);
// Paramètres du choc thermique (miroir de config.py), pour l'affichage du détail.
const CH = D.choc || {k:0.20,k_chaud:0.10,min:2,opt:6,recent:4,ref:7};
if(CH.gel==null) CH.gel=1.0;   // seuil gel (garde-fou choc station), miroir GEL_SEUIL_C
// Refroidissement R (°C) à l'index k d'une série de températures : moyenne de la
// fenêtre de référence (avant) moins la fenêtre récente. Réplique de compute_index.
function refroidissementJS(ts, k){
  if(!ts) return null;
  const moy=(a,b)=>{let s=0,n=0;for(let j=Math.max(0,a);j<=b;j++){const v=ts[j];if(v!=null){s+=v;n++;}}return n?s/n:null;};
  const rec=moy(k-CH.recent+1,k), ref=moy(k-CH.recent-CH.ref+1,k-CH.recent);
  if(rec==null||ref==null) return null;
  return ref-rec;
}
function scoreChocJS(R){ if(R==null) return 0; const x=Math.abs(R);
  const s = x<=CH.min?0 : x>=CH.opt?1 : (x-CH.min)/(CH.opt-CH.min);
  return R>0? s : -s; }
// Viabilité thermique (cloche, réplique de score_temperature) : 0 hors plage.
function scoreTempJS(t){
  if(t==null) return 0;
  if(t<=CH.tmin || t>=CH.tmax) return 0;
  if(t<CH.tob) return (t-CH.tmin)/(CH.tob-CH.tmin);
  if(t<=CH.toh) return 1;
  return (CH.tmax-t)/(CH.tmax-CH.toh);
}
// Effet net du choc sur l'indice (%). Le refroidissement (positif) est gaté par
// la viabilité thermique : un plongeon vers le gel ne déclenche rien.
function effetChoc(R, temp){
  let s=scoreChocJS(R);
  if(s>0) s*=scoreTempJS(temp);
  return Math.round((s>=0?CH.k:CH.k_chaud)*s*100);
}
function chocHTML(R, temp){
  if(R==null) return "";
  const eff=effetChoc(R, temp);
  if(Math.abs(R)<CH.min || eff===0){
    const cause = (R>0 && scoreTempJS(temp)===0) ? "température hors plage viable"
                 : "trop faible pour peser";
    return `<p class="hint" style="border-left:3px solid #8a8a80;padding-left:8px">Choc thermique : ${R>0?"refroidissement":"réchauffement"} de ${Math.abs(R).toFixed(1)} °C — ${cause}.</p>`;
  }
  const fav=eff>0, col=fav?"#1565c0":"#b2182b";
  return `<p class="hint" style="border-left:3px solid ${col};padding-left:8px">
     Choc thermique : <b>${R>0?"refroidissement":"réchauffement"} de ${Math.abs(R).toFixed(1)} °C</b>
     (moyenne ${CH.recent} j récents vs ${CH.ref} j avant) → indice <b>${eff>0?"+":""}${eff}%</b>
     (${fav?"favorable, déclencheur de pousse":"défavorable"}).</p>`;
}
// --- Phase de lune : léger bonus en lune MONTANTE, maximal à la pleine lune ----
// Facteur culturel/traditionnel, appliqué comme couche globale par-dessus la
// météo (il ne change PAS le classement des mailles, seulement le niveau absolu).
// Basé sur la nuit précédant le jour affiché. Mets POIDS_LUNE=0 pour désactiver.
const POIDS_LUNE = 0.03;          // bonus max (+3 %) atteint à la pleine lune.
const SYNODIQUE  = 29.53058867;   // durée moyenne d'une lunaison (jours).
// Âge de la lune (jours depuis la dernière nouvelle lune) pour 'YYYY-MM-DD' 00h UTC.
function ageLune(dateStr){
  const [Y,M,D2]=dateStr.split("-").map(Number);
  const jd = Date.UTC(Y, M-1, D2)/86400000 + 2440587.5;   // jour julien
  let age = (jd - 2451550.1) % SYNODIQUE;                  // réf. nouvelle lune 2000-01-06
  if(age<0) age += SYNODIQUE;
  return age;
}
// Phase de la NUIT PRÉCÉDANT dateStr : {illum 0..1, montante, nom, emoji}.
function phaseLune(dateStr){
  const [Y,M,D2]=dateStr.split("-").map(Number);
  const veille = new Date(Date.UTC(Y, M-1, D2-1)).toISOString().slice(0,10);
  const p = ageLune(veille)/SYNODIQUE;                     // 0=nouvelle, .5=pleine
  const illum = (1-Math.cos(2*Math.PI*p))/2;
  const noms = [["🌑","Nouvelle lune"],["🌒","Premier croissant"],["🌓","Premier quartier"],
    ["🌔","Gibbeuse croissante"],["🌕","Pleine lune"],["🌖","Gibbeuse décroissante"],
    ["🌗","Dernier quartier"],["🌘","Dernier croissant"]];
  const [emoji,nom] = noms[Math.round(p*8)%8];
  return {illum, montante:(p<0.5), nom, emoji};
}
// Facteur multiplicatif (>=1) de l'indice : bonus seulement en lune montante.
function facteurLune(dateStr){
  if(!POIDS_LUNE || !dateStr) return 1;
  const ph = phaseLune(dateStr);
  return 1 + (ph.montante ? POIDS_LUNE*ph.illum : 0);
}
// Applique le bonus lune à un indice (arrondi, clampé 0..100). null -> null.
function avecLune(indice, dateStr){
  if(indice==null) return indice;
  return Math.round(Math.min(100, indice*facteurLune(dateStr)));
}
// Date actuellement affichée (vue live = données du jour ; sinon date du rejeu).

// Encadré informatif HTML de la phase de lune pour une date donnée.
function luneInfoHTML(dateStr){
  const ph = phaseLune(dateStr);
  const pct = Math.round(ph.illum*100);
  const bonus = Math.round((facteurLune(dateStr)-1)*1000)/10;   // % à une décimale
  const tend = ph.montante ? "montante" : "descendante";
  const effet = bonus>0 ? `bonus pousse <b>+${bonus} %</b>`
    : (ph.montante ? "bonus négligeable (proche nouvelle lune)" : "pas de bonus (lune descendante)");
  return `<div style="display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#faf9f5;border-radius:10px;padding:8px 10px;margin:8px 0">
     <span style="font-size:26px;line-height:1">${ph.emoji}</span>

}

// Indice d'une FACE de forêt = indice de la maille modulé par l'exposition et
// le stress du jour (réplique de indice_module() côté Python).
function moduleFace(base, expo, stress){
  if(base===null||base===undefined) return null;
  if(expo===null||expo===undefined) return base;
  let v = base * (1 + VERSANT_K*expo*(stress||0));
  return Math.round(Math.max(0, Math.min(100, v)));
}
// Historique long : chargé À LA DEMANDE (hist_XX.json). Tant qu'il est absent,
// H=null et toute l'UI retombe sur la vue "live" (chemin de repli déjà géré).

const estFutur = (k)=> k>=FUTURESTART;

// Assemble H depuis les hist par département téléchargés (+ prévision inline)
// et calcule la timeline. Appelé une fois l'historique récupéré.
function finaliserHistorique(histParDept){
  let dates=null; const M={};
  for(const code in histParDept){
    const h=histParDept[code]; if(!h||!h.dates) continue;
    if(!dates) dates=h.dates.slice();
    Object.assign(M, h.mailles||{});
  }
  if(!dates){ return; }
  H={dates:dates, mailles:M};
  FUTURESTART=H.dates.length;
  if(D.prevision && D.prevision.dates && D.prevision.dates.length){
    const P=D.prevision;
    H.dates=H.dates.concat(P.dates);
    for(const mid in H.mailles){
      const pm=P.mailles[mid];
      ["i","s","w","p","t"].forEach(c=>{
        H.mailles[mid][c]=(H.mailles[mid][c]||[]).concat(pm?pm[c]:P.dates.map(()=>null));
      });
    }
  }
  HDATES=H.dates;
  TODAY_IDX=FUTURESTART;
  if(HDATES.length){
    const t=new Date(), s=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
    let bi=0,bd=Infinity; const ts=new Date(s+"T00:00:00Z").getTime();
    for(let j=0;j<HDATES.length;j++){const dd=Math.abs(new Date(HDATES[j]+"T00:00:00Z").getTime()-ts); if(dd<bd){bd=dd;bi=j;}}
    TODAY_IDX=bi;
  }
}

// Moyenne département à l'index k de l'historique.
function moyenneJour(k){
  if(!H) return null;
  let s=0,n=0; const M=H.mailles;
  for(const mid in M){const v=M[mid].i[k]; if(v!=null){s+=v; n++;}}
  return n? Math.round(s/n) : null;

// Indice affiché pour une feature : vue live (valeurs serveur) ou rejeu (index
// historique, face modulée par le versant à partir de la série SAFRAN).
function indiceAt(f){
  const mid=f.properties.maille_id;
  if(HCUR<0 || !H || !H.mailles[mid]){
    const m0=D.mailles[mid]; if(!m0) return null;
    return moduleFace(m0.indice, f.properties.expo, m0.stress);
  }
  const m=H.mailles[mid];
  return moduleFace(m.i[HCUR], f.properties.expo, m.s[HCUR]);
}

// Rendu des forêts (versant), construit depuis la géométrie EXTERNE (geom_XX.json)
// une fois chargée. Idempotent : reconstruit proprement quand un nouveau
// département entre dans la vue (fusion régionale).
const parGroupe={}, layersByGroup={};
let filtreCtrl=null, _fitFait=false;
function construireCouches(){
  // préserver l'état des cases (choix utilisateur) au travers d'un rebuild
  const etat={}; document.querySelectorAll('.filtre input[data-g]').forEach(cb=>etat[cb.getAttribute("data-g")]=cb.checked);
  Object.values(layersByGroup).forEach(l=>{try{map.removeLayer(l);}catch(e){}});
  for(const k in parGroupe) delete parGroupe[k];
  for(const k in layersByGroup) delete layersByGroup[k];
  (D.geojson.features||[]).forEach(f=>{
    const g=(f.properties&&f.properties.groupe)||"__all__";
    (parGroupe[g]=parGroupe[g]||[]).push(f);
  });
  Object.keys(parGroupe).forEach(g=>{
    const lyr=L.geoJSON({type:"FeatureCollection",features:parGroupe[g]},{
      pane:"foret", style:styleFor,
      onEachFeature:(f,l)=>{
        l.on("click",(e)=>{
          if(pendingCapture){ L.DomEvent.stop(e); finirCapture(e.latlng); return; }
          if(D.mailles[f.properties.maille_id]) ouvrirDetail(f.properties.maille_id, f.properties);});
        l.on("mouseover",()=>l.setStyle({weight:2.2,fillOpacity:0.9}));
        l.on("mouseout",()=>lyr.resetStyle(l));
      }});
    layersByGroup[g]=lyr;
  });

    Object.keys(layersByGroup).forEach(g=>{
      const meta=GRP[g]; const etage=meta?meta.etage:"__all__";
      if(etage!==et) return;
      const on = (g in etat) ? etat[g] : (!meta || meta.defaut);
      if(on) layersByGroup[g].addTo(map);

    const bnds=L.latLngBounds([]);
    Object.values(layersByGroup).forEach(l=>{try{bnds.extend(l.getBounds());}catch(e){}});
    try{ if(bnds.isValid()){ map.fitBounds(bnds,{padding:[10,10]}); _fitFait=true; } }catch(e){}
  }

}

  if(b) b.addEventListener("click",()=>{ b.disabled=true; b.textContent="Chargement…"; chargerHistorique(); });
  if(typeof IS_MOBILE!=="undefined" && IS_MOBILE && window.__mkCollapse)
    window.__mkCollapse(document.querySelector(".rejeu"),"🕒");
}
async function chargerHistorique(){
  if(HIST_STATE==="pret") return true;
  if(HIST_STATE==="chargement") return false;
  HIST_STATE="chargement";
  const parDept={};
  await Promise.all(DEPTS.filter(d=>d.hist).map(async d=>{
    try{ const r=await fetch(d.hist); if(r.ok) parDept[d.code]=await r.json(); }catch(e){}
  }));
  finaliserHistorique(parDept);
  if(H){
    HIST_STATE="pret";
    if(rejeuPlaceholder){ try{map.removeControl(rejeuPlaceholder);}catch(e){} rejeuPlaceholder=null; }
    activerRejeu();
  } else {
    HIST_STATE="absent";
    const b=document.getElementById("rj-load"); if(b){ b.disabled=false; b.textContent="Réessayer"; }
  }
  return !!H;
}
function activerRejeu(){
  if(!(H && HDATES.length>1)) return;
  // index de la date la plus proche d'une chaîne "YYYY-MM-DD".
  const idxProche=(s)=>{ if(s<=HDATES[0]) return 0; if(s>=HDATES[HDATES.length-1]) return HDATES.length-1;
    let lo=0,hi=HDATES.length-1; while(lo<hi){const m=(lo+hi)>>1; if(HDATES[m]<s) lo=m+1; else hi=m;}
    return (lo>0 && (s-HDATES[lo-1] < HDATES[lo]-s))? lo-1 : lo; };
  const rc=L.control({position:"bottomright"});
  rc.onAdd=function(){
    const div=L.DomUtil.create("div","rejeu");
    div.innerHTML =
      `<div class="rejeu-h">🕒 <b>Rejeu</b><span class="rejeu-d" id="rj-date">aujourd'hui</span></div>
       <div class="rejeu-row">
         <button id="rj-mp" type="button" title="− 1 mois">«</button>
         <button id="rj-dp" type="button" title="− 1 jour">‹</button>
         <button id="rj-play" type="button" title="Lecture / pause">▶</button>
         <button id="rj-dn" type="button" title="+ 1 jour">›</button>
         <button id="rj-mn" type="button" title="+ 1 mois">»</button>
         <button id="rj-now" type="button" title="Revenir à aujourd'hui">⤓</button>
       </div>
       <div class="rejeu-row"><span class="rj-tag">passé</span>
         <input type="range" id="rj-past" min="0" max="${TODAY_IDX}" value="${TODAY_IDX}" step="1"></div>
       <div class="rejeu-row"><span class="rj-tag" style="color:${COL_FUTUR}">à venir</span>
         <input type="range" id="rj-fut" min="${TODAY_IDX}" max="${HDATES.length-1}" value="${TODAY_IDX}" step="1"></div>
       <div class="rejeu-row2">
         <input type="date" id="rj-input" min="${HDATES[0]}" max="${HDATES[HDATES.length-1]}" value="${HDATES[TODAY_IDX]}">
       </div>
       <div class="note"><b style="color:${COL_AUJ}">vert</b> = aujourd'hui · <b style="color:${COL_PASSE}">magenta</b> = passé · <b style="color:${COL_FUTUR}">bleu</b> = prévision. Piste « à venir » = 15 prochains jours (échelle large).</div>`;
    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.disableScrollPropagation(div);
    return div;
  };
  rc.addTo(map);
  const rgPast=document.getElementById("rj-past"), rgFut=document.getElementById("rj-fut"),
        lblD=document.getElementById("rj-date"), dateIn=document.getElementById("rj-input"),
        btnPlay=document.getElementById("rj-play");
  let timer=null;
  function stopPlay(){ if(timer){clearInterval(timer); timer=null;} btnPlay.textContent="▶"; }
  function setIdx(k){
    k=Math.max(0,Math.min(HDATES.length-1,k)); HCUR=k;
    rgPast.value=Math.min(k,TODAY_IDX); rgFut.value=Math.max(k,TODAY_IDX);
    rgPast.style.accentColor = (k<TODAY_IDX?COL_PASSE:COL_AUJ);
    rgFut.style.accentColor  = (k>TODAY_IDX?COL_FUTUR:COL_AUJ);
    dateIn.value=HDATES[k];
    const suff = k<TODAY_IDX?" · passé" : (k>TODAY_IDX?" · prévision":" · aujourd'hui");
    lblD.textContent=frDate(HDATES[k])+suff; lblD.style.color=colPos(k);
    appliquer();
  }
  function setLive(){ stopPlay(); HCUR=-1;
    rgPast.value=TODAY_IDX; rgFut.value=TODAY_IDX;
    rgPast.style.accentColor=COL_AUJ; rgFut.style.accentColor=COL_AUJ;
    dateIn.value=HDATES[TODAY_IDX];
    lblD.textContent="aujourd'hui"; lblD.style.color=COL_AUJ; appliquer(); }
  const base=()=> HCUR<0? TODAY_IDX : HCUR;
  const shift=(n)=>{ const d=new Date(HDATES[base()]+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+n);
    setIdx(idxProche(d.toISOString().slice(0,10))); };
  allerADate = (ds)=>{ if(ds) setIdx(idxProche(ds)); };   // utilisé par les cueillettes
  rgPast.addEventListener("input",()=>{stopPlay(); setIdx(+rgPast.value);});
  rgFut.addEventListener("input",()=>{stopPlay(); setIdx(+rgFut.value);});
  dateIn.addEventListener("change",()=>{stopPlay(); if(dateIn.value) setIdx(idxProche(dateIn.value));});
  document.getElementById("rj-dp").addEventListener("click",()=>{stopPlay(); shift(-1);});
  document.getElementById("rj-dn").addEventListener("click",()=>{stopPlay(); shift(1);});
  document.getElementById("rj-mp").addEventListener("click",()=>{stopPlay(); shift(-30);});
  document.getElementById("rj-mn").addEventListener("click",()=>{stopPlay(); shift(30);});
  document.getElementById("rj-now").addEventListener("click",setLive);
  btnPlay.addEventListener("click",()=>{
    if(timer){stopPlay(); return;}
    btnPlay.textContent="⏸";
    let i=base(); if(i>=HDATES.length-1) i=0;   // au bout : relance du début
    setIdx(i);
    timer=setInterval(()=>{ i++; if(i>HDATES.length-1){stopPlay(); return;} setIdx(i); }, 110);
  });
  // Défaut : vue du jour.
  setLive();
  if(typeof IS_MOBILE!=="undefined" && IS_MOBILE && window.__mkCollapse)
    window.__mkCollapse(document.querySelector(".rejeu"),"🕒");
}

function metric(k,v,id){return `<div class="metric"><div class="k">${k}</div><div class="v"${id?` id="${id}"`:""}>${v}</div></div>`;}
function composition(rep){
  if(!rep) return "";
  const ent=Object.entries(rep).filter(([k,v])=>v>0);
  if(!ent.length) return "";
  const tot=ent.reduce((s,[,v])=>s+v,0)||1;
  ent.sort((a,b)=>b[1]-a[1]);
  const txt=ent.map(([k,v])=>`${ESSLBL[k]||k} ${Math.round(v/tot*100)}%`).join(" · ");
  return `<p class="hint">Composition boisée : ${txt}.</p>`;
}
// Valeurs dynamiques d'une maille : live (valeurs serveur) ou date d'historique.
function dynAt(mid){
  const p=D.mailles[mid];
  if(HCUR<0 || !H || !H.mailles[mid])
    return {indice:p.indice, swi:p.swi, pluie:p.pluie_15j, temp:p.temp,
            stress:p.stress, date:D.date_donnees, live:true};
  const m=H.mailles[mid], k=HCUR;
  return {indice:m.i[k], swi:(m.w?m.w[k]:null), pluie:(m.p?m.p[k]:null),
          temp:(m.t?m.t[k]:null), stress:m.s[k], date:HDATES[k], live:false};
}

// Ligne "versant" (face cliquée), recalculée pour la date courante.
function versantHTML(face, base, faceInd){
  if(!face || !face.versant) return "";
  const lbl = VERSANT_LBL[face.versant] || face.versant;
  let effet = "";
  if(base!=null && faceInd!=null && base>0){
    const d = Math.round((faceInd/base - 1)*100);
    effet = d===0 ? " — sans effet ce jour-là"
      : ` — indice <b>${faceInd}</b> contre ${base} de base : <b>${d>0?"+":""}${d}%</b> (${d>0?"favorisé":"pénalisé"})`;
  }
  const col = face.expo>0.05 ? "#1565c0" : (face.expo<-0.05 ? "#b2182b" : "#8a8a80");
  return `<p class="hint" style="border-left:3px solid ${col};padding-left:8px">
      Face : <b>${lbl}</b> · exposition ${face.expo>0?"+":""}${face.expo}${effet}.</p>`;
}

// Graphe : indice cèpe sur tout l'historique (+ pluie 15 j en contexte) et un
// repère rouge sur la date sélectionnée. Repli sur la série 15 j si pas d'historique.
function construireGraph(mid){
  const ctx=document.getElementById("chart");
  if(chart){ chart.destroy(); chart=null; }
  if(H && H.mailles[mid]){
    const m=H.mailles[mid];
    const kc=HCUR<0?TODAY_IDX:HCUR, xhi=Math.min(HDATES.length-1,kc), xlo=Math.max(0,xhi-20);
    const pluginToday={id:"today",afterDatasetsDraw(c){
      const xs=c.scales.x, ys=c.scales.y;
      if(TODAY_IDX==null || TODAY_IDX<xs.min || TODAY_IDX>xs.max) return;
      const x=xs.getPixelForValue(TODAY_IDX), g=c.ctx;
      g.save(); g.beginPath(); g.moveTo(x,ys.top); g.lineTo(x,ys.bottom);
      g.lineWidth=1.5; g.setLineDash([4,3]); g.strokeStyle="#e65100"; g.stroke();
      g.setLineDash([]); g.fillStyle="#e65100"; g.font="9px sans-serif"; g.textAlign="center";
      g.fillText("auj.", x, ys.top+8); g.restore();
    }};
    chart=new Chart(ctx,{
      data:{ labels:HDATES.map(d=>d.slice(8,10)+"/"+d.slice(5,7)),
        datasets:[
          {type:"line",label:"Indice",data:m.i,yAxisID:"y",borderColor:"#2e7d32",
           backgroundColor:"rgba(46,125,50,.12)",fill:true,tension:.2,pointRadius:0,borderWidth:1.2},
          {type:"line",label:"Pluie 15j (mm)",data:m.p,yAxisID:"y2",borderColor:"#1e88e5",
           borderWidth:0.8,pointRadius:0,tension:.2},
          {type:"scatter",label:"date",data:HDATES.map(()=>null),yAxisID:"y",
           borderColor:"#b71c1c",backgroundColor:"#b71c1c",pointRadius:4},
        ]},
      options:{responsive:true,maintainAspectRatio:false,animation:false,
        interaction:{intersect:false,mode:"index"},
        plugins:{legend:{labels:{boxWidth:12,font:{size:10},filter:it=>it.text!=="date"}}},
        scales:{ y:{min:0,max:100,title:{display:true,text:"indice",font:{size:9}},ticks:{font:{size:9}}},
          y2:{position:"right",grid:{drawOnChartArea:false},ticks:{font:{size:9}}},
          x:{min:xlo,max:xhi,ticks:{font:{size:9},maxRotation:0,autoSkip:true,maxTicksLimit:8}} }},
      plugins:[pluginToday]
    });
  } else {
    const serie=(D.mailles[mid].serie)||[];
    chart=new Chart(ctx,{data:{labels:serie.map(s=>s.date.slice(5)),
      datasets:[{type:"line",label:"Indice",data:serie.map(s=>s.indice),borderColor:"#2e7d32",
        backgroundColor:"rgba(46,125,50,.12)",fill:true,tension:.3,pointRadius:2}]},
      options:{responsive:true,maintainAspectRatio:false,
        scales:{y:{min:0,max:100,ticks:{font:{size:9}}},x:{ticks:{font:{size:9},maxTicksLimit:6}}}}});
  }
}

function addDays(ds,n){ const d=new Date(ds+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
// Synthèse de prévision : prochaine fenêtre favorable + pousse attendue (+lag) +
// secteurs. Basée sur la PRÉVISION inline (D.prevision) : disponible sans avoir
// à charger le lourd historique.
function fillSynth(){
  const el=document.getElementById("prev-synth"); if(!el) return;
  const P=D.prevision;
  if(!P || !P.dates || !P.dates.length){ el.innerHTML=""; return; }
  const PD=P.dates, PM=P.mailles||{};
  const SEUIL=55;
  const bestAt=(k)=>{let bv=-1;for(const mid in PM){const a=PM[mid].i;const v=a?a[k]:null;if(v!=null&&v>bv)bv=v;}return bv;};
  let peakK=-1,peakV=-1;
  for(let k=0;k<PD.length;k++){const bv=bestAt(k); if(bv>peakV){peakV=bv; peakK=k;}}
  if(peakV<SEUIL){
    el.innerHTML=`<div class="synth-t">🍄 Prévision de sortie</div>
      <div>Pas de fenêtre nettement favorable prévue d'ici le ${frDate(PD[PD.length-1])} (meilleur indice attendu ${peakV<0?"—":peakV}).</div>
      <div class="synth-n">Prévision météo — fiabilité décroissante au-delà de ~5–7 j.</div>`;
    return;
  }
  let a=peakK,b=peakK;
  while(a-1>=0 && bestAt(a-1)>=SEUIL) a--;
  while(b+1<PD.length && bestAt(b+1)>=SEUIL) b++;
  const arr=[];
  for(const mid in PM){ const ai=PM[mid].i; const v=ai?ai[peakK]:null; if(v==null) continue;
    const p=D.mailles[mid]||{}; arr.push({mid,indice:v,altitude:p.altitude,geologie:p.geologie_classe}); }
  arr.sort((x,y)=>y.indice-x.indice); const top=arr.slice(0,3);
  const lag=(top[0]&&D.mailles[top[0].mid]&&D.mailles[top[0].mid].lag_jours)||12;
  const f1=addDays(PD[a],lag), f2=addDays(PD[b],lag);
  const secteurs=top.map(z=>Math.round(z.altitude||0)+" m "+(z.geologie||"")).join(" · ");
  el.innerHTML=`<div class="synth-t">🍄 Prévision de sortie</div>
    <div>Conditions favorables prévues <b>${frDate(PD[a])}${a!==b?" → "+frDate(PD[b]):""}</b> (indice jusqu'à ${peakV}).</div>
    <div>Pousse attendue ~${lag} j après → <b>${frDate(f1)}${a!==b?" → "+frDate(f2):""}</b>.</div>
    <div class="synth-s">Meilleurs secteurs : ${secteurs}.</div>
    <div class="synth-n">Prévision météo — fiabilité décroissante au-delà de ~5–7 j. SWI projeté (bilan hydrique).</div>`;
}

     (ubac/adret, MNT IGN RGE ALTI 10 m) et par le <b>choc thermique</b> (refroidissement récent,
     déclencheur de pousse) selon la météo du jour. Il ne remplace pas l'observation de
     terrain ni la prudence sur la comestibilité.<br>
     Sources : Météo-France/SAFRAN (data.gouv), BRGM, Open-Meteo, IGN (BD Forêt V2, RGE ALTI).`;
}
// --- Observations / cueillettes (privé, dans le navigateur) -----------------
// Stockées en localStorage (jamais envoyées au dépôt public). Affichées sur la
// carte ; import/export pour sauvegarde et transfert entre appareils.
const OBS_KEY="champipi_obs_v1";
let OBS=[];
function obsLoad(){ try{OBS=JSON.parse(localStorage.getItem(OBS_KEY)||"[]");}catch(e){OBS=[];}
  // Rétro-remplissage : ajoute les données de lune aux cueillettes antérieures.
  let maj=false;
  OBS.forEach(o=>{ if(o.date && o.lune_illum==null){ const ph=phaseLune(o.date);
    o.lune_illum=+ph.illum.toFixed(3); o.lune_montante=ph.montante; o.lune_nom=ph.nom; maj=true; } });
  if(maj) obsSave();
}
function obsSave(){ try{localStorage.setItem(OBS_KEY, JSON.stringify(OBS));}catch(e){alert("Sauvegarde impossible (stockage navigateur).");} }
const EFFORT={balade:"Balade (passage)", recherche:"Recherche", intensive:"Recherche intensive"};
const ESPECE={cepe:"Cèpe", autre:"Autre"};

// Rattache un point (lat/lon) à la maille la plus proche (centroïdes embarqués).
function nearestMaille(lat,lon){
  let best=null,bd=Infinity;
  for(const mid in D.mailles){const m=D.mailles[mid]; if(m.lat==null) continue;
    const dx=m.lat-lat, dy=(m.lon-lon)*Math.cos(lat*Math.PI/180); const d=dx*dx+dy*dy;
    if(d<bd){bd=d;best=mid;}}
  return best;
}
// Index dans HDATES d'une date (exact sinon plus proche).
function hIndex(date){ if(!H||!date) return -1; const i=HDATES.indexOf(date); if(i>=0) return i;
  let best=-1,bd=Infinity; const td=new Date(date+"T00:00:00Z").getTime();
  for(let j=0;j<HDATES.length;j++){const d=Math.abs(new Date(HDATES[j]+"T00:00:00Z").getTime()-td); if(d<bd){bd=d;best=j;}} return best; }

function couleurObs(r){ if(r==null) return "#8e24aa";
  if(r>=8) return "#1b5e20"; if(r>=5) return "#7cb342"; if(r>=3) return "#f9a825";
  if(r>=1) return "#ef6c00"; return "#b71c1c"; }

const obsLayer=L.layerGroup().addTo(map);
function obsRefresh(){
  obsLayer.clearLayers();
  const show=document.getElementById("obs-show");
  if(!show || show.checked){
    OBS.forEach(o=>{
      const vide=o.result==null;   // GPX importé non renseigné : marqueur distinct
      const mk=L.circleMarker([o.lat,o.lon],{radius:vide?8:7,weight:vide?3:2,
        color:"#fff", dashArray:vide?"4 3":null,
        fillColor:vide?"#8e24aa":couleurObs(o.result),fillOpacity:vide?0.92:0.95});
      mk.on("click",(e)=>{L.DomEvent.stop(e); montrerObs(o);});
      mk.bindTooltip(`${vide?"à renseigner":o.result+"/10"} · ${frDate(o.date)}`);
      obsLayer.addLayer(mk);
    });
  }
  const c=document.getElementById("obs-count"); if(c) c.textContent=OBS.length;
}

// Capture d'un point. captureThen (facultatif) détourne le prochain clic — utilisé
// par l'import d'une photo sans GPS — au lieu d'ouvrir une nouvelle cueillette vide.
let captureThen=null;
function armerCapture(){ pendingCapture=true; map.getContainer().style.cursor="crosshair"; }
function desarmerCapture(){ pendingCapture=false; map.getContainer().style.cursor=""; }
function finirCapture(latlng){ desarmerCapture();
  const pos={lat:+latlng.lat.toFixed(5), lon:+latlng.lng.toFixed(5)};
  if(captureThen){ const cb=captureThen; captureThen=null; cb(pos); } else formulaireObs(pos); }
map.on("click",(e)=>{ if(pendingCapture) finirCapture(e.latlng); });
function captureGPS(){
  if(!navigator.geolocation){ alert("Géolocalisation indisponible sur cet appareil."); return; }
  navigator.geolocation.getCurrentPosition(
    p=>finirCapture({lat:p.coords.latitude, lng:p.coords.longitude}),
    ()=>alert("Position GPS indisponible ou refusée."),
    {enableHighAccuracy:true, timeout:10000});
}

function aujourdhui(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

// Formulaire de saisie / édition. opts (facultatif) : {preview, flagDate, after},
// posé par l'import photo — aperçu de la photo, date à saisir, enchaînement de la file.
function formulaireObs(pos, o, opts){
  desarmerCapture();
  o = o || {}; opts = opts || {};
  const lat = o.lat!=null? o.lat : pos.lat, lon = o.lon!=null? o.lon : pos.lon;
  const el=document.getElementById("detail");
  el.innerHTML=`
    <h2 style="margin:0 0 4px">${o.id?"Modifier":"Nouvelle"} cueillette</h2>
    <p class="hint">Position : ${lat.toFixed(5)}, ${lon.toFixed(5)} · maille ${nearestMaille(lat,lon)}</p>
    ${opts.preview?`<img src="${opts.preview}" alt="aperçu photo" style="display:block;max-width:100%;max-height:190px;border-radius:10px;margin:2px 0 6px;object-fit:cover">`:""}
    <div class="obsform">
      <label>Date${opts.flagDate?` <span style="color:#b26a00">— absente de la photo, à saisir</span>`:""}</label>
      <input type="date" id="o-date" max="${aujourdhui()}" value="${o.date||(opts.flagDate?"":aujourdhui())}"${opts.flagDate?` style="border-color:#e0a25e;background:#fff8ef"`:""}>
      <label>Résultat de cueillette (0 = rien · 10 = abondant)</label>
      <div class="rrow"><input type="range" id="o-res" min="0" max="10" step="1" value="${o.result!=null?o.result:0}" style="flex:1">
        <span class="rval" id="o-resv">${o.result!=null?o.result:0}</span></div>
      <label>Espèce</label><select id="o-esp">
        <option value="cepe"${o.espece!=="autre"?" selected":""}>Cèpe</option>
        <option value="autre"${o.espece==="autre"?" selected":""}>Autre</option></select>
      <label>Effort de prospection</label><select id="o-eff">
        <option value="balade"${(o.effort||"recherche")==="balade"?" selected":""}>Balade (passage)</option>
        <option value="recherche"${(o.effort||"recherche")==="recherche"?" selected":""}>Recherche</option>
        <option value="intensive"${o.effort==="intensive"?" selected":""}>Recherche intensive</option></select>
      <label>Note (facultatif)</label><textarea id="o-note" rows="2">${o.note||""}</textarea>
    </div>
    <div class="obsbtns">
      <button class="ok" id="o-save">Enregistrer</button>
      <button id="o-cancel">${opts.after?"Passer":"Annuler"}</button>
    </div>`;
  document.getElementById("o-res").addEventListener("input",e=>{document.getElementById("o-resv").textContent=e.target.value;});
  document.getElementById("o-cancel").addEventListener("click", opts.after || fermerDetail);
  document.getElementById("o-save").addEventListener("click",()=>{
    const dEl=document.getElementById("o-date");
    let dObs=dEl.value;
    if(!dObs){ if(opts.flagDate){ alert("Indiquez la date de la photo."); dEl.focus(); return; } dObs=aujourdhui(); }
    const phObs=phaseLune(dObs);   // lune de la nuit précédant la cueillette
    const obs={ id:o.id||("o"+Date.now()), lat, lon,
      date:dObs,
      result:+document.getElementById("o-res").value,
      espece:document.getElementById("o-esp").value,
      effort:document.getElementById("o-eff").value,
      note:document.getElementById("o-note").value.trim(),
      lune_illum:+phObs.illum.toFixed(3), lune_montante:phObs.montante, lune_nom:phObs.nom,
      saisi_le:new Date().toISOString().slice(0,16).replace("T"," ") };
    const i=OBS.findIndex(x=>x.id===obs.id);
    if(i>=0) OBS[i]=obs; else OBS.push(obs);
    obsSave(); obsRefresh();
    if(opts.after) opts.after(); else montrerObs(obs);   // import photo : passe à la suivante
  });
}

// Détail d'une cueillette + données de la zone (maille) à sa date
function montrerObs(o){
  SELMID=null; SELFACE=null; if(chart){chart.destroy(); chart=null;}
  const mid=nearestMaille(o.lat,o.lon), p=D.mailles[mid]||{};
  const k=hIndex(o.date);
  const geo={acide:"sol acide",neutre:"sol neutre",calcaire:"sol calcaire",inconnu:"sol ?"}[p.geologie_classe]||p.geologie_classe||"—";
  let zone;
  if(H && H.mailles[mid] && k>=0){
    const m=H.mailles[mid];
    const pred=m.i[k];
    // Fenêtre de LAG : la pousse reflète le déclencheur ~10-15 j avant. On
    // remonte le meilleur indice sur la fenêtre précédente (lag selon altitude).
    const lag = p.lag_jours || 15;
    let maxPre=null, jbest=k;
    for(let j=Math.max(0,k-lag); j<=k; j++){ const v=m.i[j];
      if(v!=null && (maxPre==null || v>maxPre)){ maxPre=v; jbest=j; } }
    zone=`
     <div class="metrics">
       ${metric("Ta cueillette", (o.result!=null?o.result:"—")+" / 10")}
       ${metric("Indice ce jour-là", (pred!=null?pred:"—")+" · "+niveauLbl(pred))}
       ${metric("Meilleur indice "+lag+" j avant", (maxPre!=null?maxPre:"—")+" · "+niveauLbl(maxPre))}
       ${metric("Déclencheur estimé", jbest!==k?frDate(HDATES[jbest]):"le jour même")}
       ${metric("Humidité (SWI)", m.w&&m.w[k]!=null?m.w[k]:"—")}
       ${metric("Pluie 15 j", m.p&&m.p[k]!=null?m.p[k]+" mm":"—")}
       ${metric("Température", m.t&&m.t[k]!=null?m.t[k]+" °C":"—")}
       ${metric("Altitude · sol", (p.altitude!=null?Math.round(p.altitude)+" m":"—")+" · "+geo)}
     </div>
     <p class="hint">La pousse suit le déclencheur avec ~${lag} j de décalage (altitude). On compare donc ta cueillette au <b>meilleur indice des ${lag} j précédents</b> (${maxPre!=null?maxPre:"—"}), pas au seul indice du jour (${pred!=null?pred:"—"}). C'est cet écart, accumulé, qui recalera les coefficients.</p>`;
  } else {
    zone=`<p class="hint">Pas de données d'historique pour cette date/zone (hors période couverte).</p>`;
  }
  const el=document.getElementById("detail");
  el.innerHTML=`
    <div style="display:flex;align-items:center;gap:8px">
      <button id="o-back" type="button" style="border:1px solid var(--line);background:#faf9f5;border-radius:7px;padding:2px 8px;font-size:12px;cursor:pointer;color:var(--ink)">‹ retour</button>
      <h2 style="margin:0">Cueillette · ${frDate(o.date)}</h2>
    </div>
    <p class="hint" style="margin-top:8px"><span class="dot" style="display:inline-block;background:${couleurObs(o.result)}"></span>
      <b>${o.result!=null?o.result:"—"}/10</b>${o.result==null?" <span style=\"color:#b26a00\">· à renseigner</span>":""} · ${ESPECE[o.espece]||o.espece} · ${EFFORT[o.effort]||o.effort||"—"}${o.note?" · "+o.note:""}</p>
    <p class="hint">Position ${o.lat.toFixed(5)}, ${o.lon.toFixed(5)} · maille ${mid}</p>
    ${luneInfoHTML(o.date)}
    ${zone}
    <div class="obsbtns">
      ${allerADate?`<button id="o-see">Voir la carte ce jour-là</button>`:""}
      <button id="o-edit">Modifier</button>
      <button class="del" id="o-del">Supprimer</button>
    </div>`;
  document.getElementById("o-back").addEventListener("click",fermerDetail);
  document.getElementById("o-edit").addEventListener("click",()=>formulaireObs({lat:o.lat,lon:o.lon},o));
  document.getElementById("o-del").addEventListener("click",()=>{
    if(confirm("Supprimer cette cueillette ?")){ OBS=OBS.filter(x=>x.id!==o.id); obsSave(); obsRefresh(); fermerDetail(); }});
  const see=document.getElementById("o-see"); if(see) see.addEventListener("click",()=>allerADate(o.date));
}

// Import / export
function obsExport(){
  if(!OBS.length){ alert("Aucune cueillette à exporter."); return; }
  const blob=new Blob([JSON.stringify(OBS,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="champipi_observations.json"; document.body.appendChild(a); a.click(); a.remove();
}
function readText(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(new Error("lecture")); r.readAsText(file); }); }
// Parse un GPX : ne garde que les waypoints (<wpt>). Un point GPX n'a pas de
// « résultat » → result=null : le point s'affiche « à renseigner » (contour gris
// tireté) tant qu'il n'est pas édité. Il reste tel quel à travers export/import.
function parseGpx(text){
  const doc=new DOMParser().parseFromString(text,"application/xml");
  if(doc.querySelector("parsererror")) throw new Error("GPX invalide");
  const out=[];
  doc.querySelectorAll("wpt").forEach(w=>{
    const lat=parseFloat(w.getAttribute("lat")), lon=parseFloat(w.getAttribute("lon"));
    if(!isFinite(lat)||!isFinite(lon)) return;
    const t=w.querySelector("time"); const date=(t&&t.textContent)? t.textContent.trim().slice(0,10) : aujourdhui();
    const nm=((w.querySelector("name")||{}).textContent||"").trim();
    const ds=((w.querySelector("desc")||w.querySelector("cmt")||{}).textContent||"").trim();
    const note=["GPX",nm,ds].filter(Boolean).join(" · ").slice(0,300);
    const la=+lat.toFixed(5), lo=+lon.toFixed(5), ph=phaseLune(date);
    out.push({ id:"g_"+la+"_"+lo+"_"+date, lat:la, lon:lo, date, result:null,
      espece:"cepe", effort:"recherche", note,
      lune_illum:+ph.illum.toFixed(3), lune_montante:ph.montante, lune_nom:ph.nom,
      saisi_le:new Date().toISOString().slice(0,16).replace("T"," ") });
  });
  return out;
}
// Import multi-fichiers : .json (tableaux de cueillettes) et/ou .gpx (waypoints).
async function obsImport(files){
  let ajout=[], erreurs=0, vides=0;
  for(const f of Array.from(files)){
    try{
      const txt=await readText(f);
      const gpx=/\.gpx$/i.test(f.name) || /<gpx[\s>]/i.test(txt.slice(0,600));
      const arr = gpx ? parseGpx(txt) : (()=>{ const a=JSON.parse(txt); if(!Array.isArray(a)) throw 0; return a; })();
      arr.forEach(o=>{ if(o.result==null) vides++; });
      ajout=ajout.concat(arr);
    }catch(e){ erreurs++; }
  }
  if(!ajout.length){ alert(erreurs? "Aucun point valide (formats attendus : .json ou .gpx).":"Rien à importer."); return; }
  // Fusion des doublons (même id) : on garde le point renseigné plutôt que le
  // vide, et à statut égal le plus récent. Réimporter un vieil export ne réécrase
  // donc jamais un résultat déjà saisi.
  const mieux=(a,b)=>{ if(!a) return b; if(!b) return a;
    const ra=a.result!=null, rb=b.result!=null; if(ra!==rb) return ra?a:b;
    return (b.saisi_le||"")>=(a.saisi_le||"")?b:a; };
  const byKey={};
  OBS.concat(ajout).forEach(o=>{ const key=o.id||[o.date,o.lat,o.lon].join("|"); byKey[key]=mieux(byKey[key],o); });
  OBS=Object.values(byKey); obsSave(); obsRefresh();
  alert("Importé : "+ajout.length+" point(s)"
    +(vides? " · dont "+vides+" à renseigner":"")
    +(erreurs? " · "+erreurs+" fichier(s) ignoré(s)":"")
    +". Total : "+OBS.length+".");
}

// --- Import de photos (métadonnées EXIF : date + position GPS) --------------
// Chaque photo devient une cueillette. exifr (chargé en CDN) lit JPEG/HEIC/PNG.
// Photo géotaguée + datée → fiche pré-remplie. Sans GPS → on demande de pointer
// l'endroit sur la carte. Sans date → le champ Date est signalé et requis.
function _isoDate(dt){
  if(!dt) return null;
  if(dt instanceof Date && !isNaN(dt))
    return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
  const m=String(dt).match(/(\d{4})[:\-\/](\d{2})[:\-\/](\d{2})/);
  return m? `${m[1]}-${m[2]}-${m[3]}` : null;
}
// Lit date + lat/lon d'une image. Renvoie {date,lat,lon} (champs nuls si absents).
async function lireMetaPhoto(f){
  let date=null, lat=null, lon=null;
  if(window.exifr){
    try{ const g=await exifr.gps(f);
      if(g && isFinite(g.latitude) && isFinite(g.longitude)){
        lat=+(+g.latitude).toFixed(5); lon=+(+g.longitude).toFixed(5); } }catch(e){}
    try{ const o=await exifr.parse(f,["DateTimeOriginal","CreateDate","ModifyDate"]);
      if(o) date=_isoDate(o.DateTimeOriginal||o.CreateDate||o.ModifyDate); }catch(e){}
  }
  return {date, lat, lon};
}
let PHOTO_Q=[];   // file d'attente des photos en cours d'import
async function photoImport(files){
  if(!window.exifr &&
     !confirm("Lecture des métadonnées photo indisponible (CDN hors-ligne ?). "+
              "Importer quand même en saisie manuelle (position + date à renseigner) ?")) return;
  const items=[];
  for(const f of Array.from(files)){
    const meta = window.exifr ? await lireMetaPhoto(f) : {date:null,lat:null,lon:null};
    items.push({name:f.name, date:meta.date, lat:meta.lat, lon:meta.lon,
                thumb:URL.createObjectURL(f)});
  }
  PHOTO_Q = items;
  photoNext();
}
// Traite la photo suivante de la file (une fiche à la fois).
function photoNext(){
  if(!PHOTO_Q.length){ desarmerCapture(); captureThen=null; fermerDetail(); return; }
  const it=PHOTO_Q.shift();
  const o={ date:it.date||null, note:"📷 "+(it.name||"photo") };
  const opts={ preview:it.thumb, flagDate:!it.date, after:photoNext };
  if(it.lat!=null && it.lon!=null){                 // géotaguée → fiche pré-remplie
    map.setView([it.lat,it.lon], Math.max(map.getZoom(),13));
    formulaireObs({lat:it.lat, lon:it.lon}, o, opts);
  } else {                                          // sans GPS → pointer l'endroit
    photoAskLocation(it, o, opts);
  }
}
// Photo sans GPS : aperçu + demande de cliquer l'endroit sur la carte.
function photoAskLocation(it, o, opts){
  const el=document.getElementById("detail");
  el.innerHTML=`
    <h2 style="margin:0 0 6px">📷 Localiser la photo</h2>
    <p class="hint"><b>${it.name||"photo"}</b> ne contient pas de position GPS${it.date?` (prise le ${frDate(it.date)})`:""}.
       Cliquez sur la carte l'endroit où elle a été prise.</p>
    <img src="${it.thumb}" alt="aperçu photo" style="display:block;max-width:100%;max-height:200px;border-radius:10px;margin:6px 0;object-fit:cover">
    <div class="obsbtns"><button id="ph-skip">Passer cette photo</button></div>`;
  const skip=document.getElementById("ph-skip");
  if(skip) skip.addEventListener("click",()=>{ captureThen=null; photoNext(); });
  captureThen=(pos)=>formulaireObs(pos, o, opts);
  armerCapture();
  // Sur mobile la feuille se replie : un rappel explicite évite l'hésitation.
  if(window.matchMedia && window.matchMedia("(max-width:760px)").matches)
    alert("Photo sans position GPS — touchez sur la carte l'endroit où elle a été prise.");
}

// Contrôle « ma position » : centre la carte sur le GPS du téléphone.
// La carte reste nord-en-haut (Leaflet ne pivote jamais).
let _locMark=null, _locAcc=null;
function locateMe(){
  if(!navigator.geolocation){ alert("Géolocalisation indisponible sur cet appareil."); return; }
  const btn=document.getElementById("loc-btn");
  if(btn) btn.disabled=true;
  navigator.geolocation.getCurrentPosition(
    p=>{
      const ll=[p.coords.latitude, p.coords.longitude], acc=p.coords.accuracy||0;
      if(_locMark) map.removeLayer(_locMark);
      if(_locAcc)  map.removeLayer(_locAcc);
      _locAcc=L.circle(ll,{radius:acc,color:"#1976d2",weight:1,fillColor:"#1976d2",fillOpacity:.12,interactive:false}).addTo(map);
      _locMark=L.circleMarker(ll,{radius:7,color:"#fff",weight:2,fillColor:"#1976d2",fillOpacity:1}).addTo(map);
      map.setView(ll, Math.max(map.getZoom(),14));   // nord toujours en haut
      if(btn) btn.disabled=false;
    },
    ()=>{ alert("Position GPS indisponible ou refusée."); if(btn) btn.disabled=false; },
    {enableHighAccuracy:true, timeout:10000, maximumAge:15000});
}

  L.DomEvent.disableScrollPropagation(div);
  return div;
};

// ============================================================================
// Calque « Stations météo » : pluviomètres Météo-France (48 + limitrophes) qui
// servent à corriger localement la pluie. Marqueur à la position, fiche avec le
// cumul 15 j et la série quotidienne (barres). OFF par défaut (évite la surcharge).
// Enveloppé try/catch et placé AVANT le bloc mobile : ne peut pas casser le tactile.
// ============================================================================
// Échelle de couleur pour la pluie (mm) — bleus, distincts de l'indice (vert)
// et des cueillettes (violet/rouge).
function couleurPluie(mm){ if(mm==null) return "#9e9e9e";
  if(mm>=50) return "#0d47a1"; if(mm>=30) return "#1976d2";
  if(mm>=15) return "#42a5f5"; if(mm>=5) return "#90caf9"; return "#cfd8dc"; }
// Nombre de cellules pleines (0..4) selon le cumul 15 j — mêmes seuils que la couleur.
function pluieCells(mm){ return mm==null?0 : mm>=50?4 : mm>=30?3 : mm>=15?2 : mm>=5?1 : 0; }
// Marqueur = petite jauge verticale à 4 cellules, remplie du bas selon la pluie.
// `etat` (fraîcheur, levier 1) ajoute une pastille de coin : rien si à jour,
// orange si lacunaire, gris + marqueur atténué si muette (probablement HS).
function jaugeHTML(mm, etat, choc){ const n=pluieCells(mm), col=couleurPluie(mm); let c="";
  for(let i=0;i<4;i++){ c+=`<i${i<n?` style="background:${col}"`:""}></i>`; }  // .stmk est en column-reverse : i=0 en bas
  const dot = etat==="lacunaire" ? `<span class="stdot lac" title="données lacunaires"></span>`
            : etat==="muet"      ? `<span class="stdot muet" title="station muette (probablement hors service)"></span>` : "";
  // Badge « appel à pousse » : choc thermique observé + sol assez humide.
  const appel = !!(choc && choc.appel);
  const badge = appel ? `<span class="stchoc" title="choc thermique + sol humide : appel à pousse">❄</span>` : "";
  const cls = "stmk" + (etat==="muet"?" muet":"") + (appel?" choc":"");
  return `<div class="${cls}" title="${mm!=null?mm+" mm / 15 j":"—"}">${dot}${badge}${c}</div>`; }

// Traduction de l'état de fraîcheur en libellé + couleur + explication.
function etatStation(s){ const e=s.etat||"ok";
  if(e==="muet") return {txt:"Muette", col:"#616161",
    detail:`aucune donnée depuis ${s.retard_j!=null?s.retard_j+" j":"longtemps"} — poste probablement hors service ou fermé, écarté de la correction.`};
  if(e==="lacunaire") return {txt:"Lacunaire", col:"#d98200",
    detail:`données partielles${s.retard_j?", en retard de "+s.retard_j+" j sur le réseau":""} — prise en compte avec prudence.`};
  return {txt:"À jour", col:"#2e7d32", detail:"données à jour avec le réseau."}; }

// Bandeau « verdict » du choc thermique d'une station (miroir de choc_station).
function chocStationHTML(c){
  if(!c) return "";
  const bar=(col,titre,txt)=>`<p class="hint" style="border-left:3px solid ${col};padding-left:8px;margin:8px 0 2px"><b style="color:${col}">${titre}</b> — ${txt}</p>`;
  const R=c.R, aR=R!=null?Math.abs(R).toFixed(1):"—";
  if(c.appel) return bar("#1565c0","❄ Choc thermique + sol humide",
     `refroidissement de ${aR} °C aboutissant dans une plage viable, sur sol assez humide localement. Les deux co-facteurs d'une pousse sont réunis (à combiner avec l'indice de la maille).`);
  if(c.choc_thermique && !c.humide) return bar("#d98200","Choc thermique, mais sol sec",
     `refroidissement de ${aR} °C, mais la pluie 15 j locale est sous le seuil : un coup de froid seul ne déclenche pas de pousse.`);
  if(c.gel) return bar("#5c6bc0","Coup de froid vers le gel",
     `T° mini récente ${c.tmin_recent!=null?c.tmin_recent.toFixed(1)+" °C":""} sous le seuil de gel : garde-fou actif — ce n'est pas un déclencheur (le gel abîme les jeunes cèpes).`);
  if(R!=null && R>0) return bar("#8a8a80","Léger refroidissement",
     `${aR} °C sur ${CH.recent} j récents vs ${CH.ref} j avant — trop faible pour un appel marqué.`);
  if(R!=null && R<0) return bar("#8a8a80","Réchauffement",
     `${aR} °C — plutôt défavorable à la pousse.`);
  return bar("#8a8a80","Température stable","pas de choc thermique notable ces derniers jours.");
}

// Graphe de température 20 j : bande TN→TX + point TM par jour, plage optimale
// (vert) et 0 °C (gel) en repères. `serie` = [ [date, tn, tx, tm], ... ].
function tempChartHTML(serie){
  const nn=v=>v!=null;
  const tn=serie.map(r=>r[1]).filter(nn), tx=serie.map(r=>r[2]).filter(nn),
        tm=serie.map(r=>r[3]).filter(nn);
  const base=tn.concat(tx).concat(tm);
  if(!base.length) return "";
  const lo=Math.min(Math.min(...base)-1, 0), hi=Math.max(Math.max(...base)+1, CH.toh+1);
  const P=v=>((v-lo)/(hi-lo)*100);
  let refs=`<div class="tband" style="bottom:${P(CH.tob)}%;height:${Math.max(0,P(CH.toh)-P(CH.tob))}%"></div>`
          +`<div class="tref" style="bottom:${P(CH.toh)}%"><span>${CH.toh}°</span></div>`;
  if(0>=lo&&0<=hi) refs+=`<div class="tref gel" style="bottom:${P(0)}%"><span>0°</span></div>`;
  const cols=serie.map(r=>{
    const tn2=r[1], tx2=r[2], tm2=r[3];
    const lowv=(nn(tn2)&&nn(tx2))?Math.min(tn2,tx2):(nn(tn2)?tn2:(nn(tx2)?tx2:tm2));
    const hiv =(nn(tn2)&&nn(tx2))?Math.max(tn2,tx2):(nn(tx2)?tx2:(nn(tn2)?tn2:tm2));
    let inner="";
    if(nn(lowv)&&nn(hiv)){
      const b=P(lowv), h=Math.max(2,P(hiv)-P(lowv));
      const tip=`${frDate(r[0])}${nn(tn2)?` · min ${tn2.toFixed(1)}°`:""}${nn(tx2)?` · max ${tx2.toFixed(1)}°`:""}${nn(tm2)?` · moy ${tm2.toFixed(1)}°`:""}`;
      inner=`<div class="trange" style="bottom:${b}%;height:${h}%" title="${tip}"></div>`;
      if(nn(tm2)) inner+=`<div class="tmid" style="bottom:${P(tm2)}%" title="${tip}"></div>`;
    }
    return `<div class="tcol">${inner}</div>`;
  }).join("");
  const days=serie.map(r=>`<div class="td">${r[0].slice(8)}</div>`).join("");
  return `<div class="tbars">${refs}${cols}</div><div class="tdays">${days}</div>`;
}

// Détail d'une station dans le PANNEAU LATÉRAL (comme une maille/cueillette).
function montrerStation(s){
  SELMID=null; SELFACE=null; if(chart){ chart.destroy(); chart=null; }
  const serie=s.serie||[];
  const E=etatStation(s);
  const vals=serie.map(x=>x[1]).filter(v=>v!=null);
  const mx=Math.max(1,...vals);
  const jours=vals.filter(v=>v>0).length;
  const maxj=vals.length?Math.max(...vals):null;
  const bars=serie.map(x=>{ const v=x[1];
    const h=(v==null)?2:Math.max(2,Math.round(3+48*v/mx));
    const t=(v==null?"—":v+" mm")+" · "+frDate(x[0]);
    // valeur en mm au-dessus de la barre : bleu si pluie, gris pâle si 0/absent
    const on=v!=null&&v>0;
    const mmlab=v==null?"·":(Number.isInteger(v)?v:v.toFixed(1));
    return `<div class="sbar2" title="${t}"><span class="mm ${on?'on':'off'}">${mmlab}</span>`
      +`<i style="height:${h}px;background:${couleurPluie(v)}"></i><span class="d">${x[0].slice(8)}</span></div>`;
  }).join("");
  // Type de poste : station météo (pluie + température, réseau principal) vs
  // pluviomètre (pluie seule, réseau complémentaire).
  const c=s.choc||null;
  const tserie=s.temp_serie||[];
  const introType = s.a_temp
    ? "Station météo du réseau principal (pluie + température) : sert à corriger localement la pluie et à détecter le choc thermique."
    : "Pluviomètre du réseau complémentaire (pluie seule) : sert à corriger localement la pluie de l'indice.";
  const tempSection = s.a_temp ? `
    <div style="font-size:12px;font-weight:650;margin:14px 0 2px">Température — ${tserie.length} derniers jours${D.stations_date?" (au "+frDate(D.stations_date)+")":""}</div>
    ${chocStationHTML(c)}
    <div class="metrics">
      ${metric("T° moyenne récente", c&&c.tmean_recent!=null?c.tmean_recent+" °C":"—")}
      ${metric("T° mini récente", c&&c.tmin_recent!=null?c.tmin_recent+" °C":"—")}
      ${metric("Refroidissement", c&&c.R!=null?(c.R>0?c.R+" °C ↓":Math.abs(c.R)+" °C ↑"):"—")}
    </div>
    ${tempChartHTML(tserie)}
    <p class="hint">Bande = mini→maxi du jour, point blanc = moyenne. Bande verte = plage optimale (${CH.tob}–${CH.toh} °C), trait bleu = 0 °C (gel). Le « choc » compare la T° moyenne des ${CH.recent} j récents aux ${CH.ref} j précédents ; « ↓ » = refroidissement (favorable).</p>`
    : `<p class="hint" style="margin-top:12px">Pas de température ici : poste pluviométrique. La température ne provient que du réseau principal.</p>`;
  const el=document.getElementById("detail");
  el.innerHTML=`
    <div style="display:flex;align-items:center;gap:8px">
      <button id="d-back" type="button" style="border:1px solid var(--line);background:#faf9f5;border-radius:7px;padding:2px 8px;font-size:12px;cursor:pointer;color:var(--ink)">‹ retour</button>
      <h2 style="margin:0">${s.a_temp?"🌡️":"🌧️"} ${s.nom||s.num}</h2>
    </div>
    <p class="hint" style="margin-top:8px">Station Météo-France${s.num?" n°"+s.num:""}${s.alti!=null?" · "+Math.round(s.alti)+" m":""}. ${introType}</p>
    <div class="metrics">
      ${metric("État station", `<span style="color:${E.col};font-weight:700">${E.txt}</span>`)}
      ${metric("Dernière donnée", s.dernier?frDate(s.dernier):"—")}
      ${metric("Pluie cumulée 15 j", s.cumul_15j!=null?s.cumul_15j+" mm":"—")}
      ${metric("Jours de pluie", jours+" / "+serie.length)}
      ${metric("Max journalier", maxj!=null?maxj+" mm":"—")}
      ${metric("Altitude", s.alti!=null?Math.round(s.alti)+" m":"—")}
    </div>
    <p class="hint" style="margin-top:6px">État : <b style="color:${E.col}">${E.txt}</b> — ${E.detail}</p>
    <div style="font-size:12px;font-weight:650;margin:12px 0 2px">Pluie quotidienne — ${serie.length} derniers jours${D.stations_date?" (au "+frDate(D.stations_date)+")":""}</div>
    <div class="stbars">${bars}</div>
    <p class="hint">Barres = mm par jour (chiffre = quantième du mois). Les stations proches et d'altitude comparable pèsent le plus dans la correction (interpolation relief).</p>
    ${tempSection}`;
  document.getElementById("d-back").addEventListener("click",fermerDetail);
}

// ---- Construction du calque + contrôle (isolé, ne doit pas casser le mobile).
try{
  const STA = D.stations || [];
  if(STA.length){
    const statLayer=L.layerGroup();   // OFF au départ (ajouté au clic "voir")
    STA.forEach(s=>{
      const et=s.etat||"ok";
      const etTxt=et==="muet"?" · ⚠ muette (HS probable)":(et==="lacunaire"?" · données lacunaires":"");
      const chocTxt=(s.choc&&s.choc.appel)?" · ❄ choc thermique + sol humide":"";
      const mk=L.marker([s.lat,s.lon],{icon:L.divIcon({className:"stmk-wrap",
        html:jaugeHTML(s.cumul_15j, et, s.choc), iconSize:[25,46], iconAnchor:[12,23]})});
      mk.bindTooltip(`${s.nom||s.num} · ${s.cumul_15j!=null?s.cumul_15j+" mm/15j":"—"}${etTxt}${chocTxt}`);
      mk.on("click",()=>montrerStation(s));   // détail dans le panneau latéral
      statLayer.addLayer(mk);
    });
    const nLac=STA.filter(s=>s.etat==="lacunaire").length;
    const nMuet=STA.filter(s=>s.etat==="muet").length;
    const nChoc=STA.filter(s=>s.choc&&s.choc.appel).length;
    const statCtrl=L.control({position:"topright"});
    statCtrl.onAdd=function(){
      const div=L.DomUtil.create("div","statctrl");
      div.innerHTML=`<label style="display:flex;align-items:center;gap:6px;cursor:pointer">
        <input type="checkbox" id="stat-show"> 🌧️ Stations météo <span class="pill">${STA.length}</span></label>
        <div class="stat-note">Pluviomètres + stations, source de la correction locale. Clic = détail.<br>
        <span class="lgd choc">❄</span>choc thermique + sol humide (appel à pousse)${nChoc?` — <b>${nChoc}</b> station${nChoc>1?"s":""}`:" — aucune aujourd'hui"}<br>
        <span class="lgd lac"></span>lacunaire · <span class="lgd muet"></span>muette (HS probable)${(nLac||nMuet)?` — ${nLac} lacunaire${nLac>1?"s":""}, ${nMuet} muette${nMuet>1?"s":""}`:" — toutes à jour"}</div>`;
      L.DomEvent.disableClickPropagation(div);
      L.DomEvent.disableScrollPropagation(div);
      return div;
    };
    statCtrl.addTo(map);
    const sc=document.getElementById("stat-show");
    if(sc) sc.addEventListener("change",e=>{
      if(e.target.checked) statLayer.addTo(map); else map.removeLayer(statLayer);
    });
  }
}catch(_){}

// ============================================================================
// Ergonomie mobile : feuille glissante + contrôles repliés en icônes.
// Tout est gated par IS_MOBILE ; le bureau n'est pas affecté.
// ============================================================================
const IS_MOBILE = window.matchMedia("(max-width:760px)").matches;
if(IS_MOBILE){
  const sheet=document.querySelector("aside");
  const handle=document.getElementById("sheet-handle");
  let sheetState="collapsed";                 // collapsed | half | full
  const vh=()=>window.innerHeight;
  const anchorT=(s)=> s==="full"?0 : s==="half"?0.46*vh() : 0.88*vh()-104;
  function setSheet(s){
    sheetState=s; sheet.classList.remove("half","full");
    if(s!=="collapsed") sheet.classList.add(s);
    sheet.style.transform="";                 // rend la main au transform CSS
  }
  const expandSheet=()=>{ if(sheetState==="collapsed") setSheet("half"); };
  const collapseSheet=()=>setSheet("collapsed");

  // Glisser la poignée : suivi tactile puis aimantation sur l'ancre la plus proche.
  if(handle){
    let dragging=false, startY=0, startT=0, lastY=0, moved=0;
    const yOf=(e)=> e.touches? e.touches[0].clientY : e.clientY;
    function down(e){ dragging=true; startY=lastY=yOf(e); startT=anchorT(sheetState);
      moved=0; sheet.classList.add("dragging"); }
    function move(e){ if(!dragging) return; lastY=yOf(e); moved=Math.max(moved,Math.abs(lastY-startY));
      let t=Math.max(0,Math.min(0.88*vh()-40,startT+(lastY-startY)));
      sheet.style.transform="translateY("+t+"px)"; if(e.cancelable) e.preventDefault(); }
    function up(){ if(!dragging) return; dragging=false; sheet.classList.remove("dragging");
      if(moved<6){                            // tap : cycle réduite → moitié → pleine
        setSheet(sheetState==="collapsed"?"half":sheetState==="half"?"full":"collapsed"); return;
      }
      const t=startT+(lastY-startY);
      const anchors=[["full",0],["half",0.46*vh()],["collapsed",0.88*vh()-104]];
      let best=anchors[0]; anchors.forEach(a=>{ if(Math.abs(a[1]-t)<Math.abs(best[1]-t)) best=a; });
      setSheet(best[0]);
    }
    handle.addEventListener("touchstart",down,{passive:true});
    handle.addEventListener("touchmove",move,{passive:false});
    handle.addEventListener("touchend",up);
    handle.addEventListener("mousedown",down);
    window.addEventListener("mousemove",move);
    window.addEventListener("mouseup",up);
  }

  // Ouvrir la feuille quand on affiche un détail ; la réduire quand on cible la carte.
  const _ouvrir=ouvrirDetail;   ouvrirDetail   =function(){ _ouvrir.apply(this,arguments);   expandSheet(); };
  const _obs=montrerObs;        montrerObs     =function(){ _obs.apply(this,arguments);       expandSheet(); };
  const _stn=montrerStation;    montrerStation =function(){ _stn.apply(this,arguments);       expandSheet(); };
  const _form=formulaireObs;    formulaireObs  =function(){ _form.apply(this,arguments);      expandSheet(); };
  const _arm=armerCapture;      armerCapture   =function(){ _arm.apply(this,arguments);       collapseSheet(); };

  // Replie un contrôle Leaflet en bouton-icône (ouverture au tap).
  function makeCollapsible(el, icon){
    if(!el) return;
    const body=document.createElement("div"); body.className="mob-body";
    while(el.firstChild) body.appendChild(el.firstChild);   // conserve les écouteurs
    const toggle=document.createElement("button");
    toggle.type="button"; toggle.className="mob-toggle"; toggle.textContent=icon;
    el.classList.add("mob-collapse"); el.appendChild(toggle); el.appendChild(body);
    toggle.addEventListener("click",(ev)=>{ ev.stopPropagation();
      const open=el.classList.toggle("open");
      if(open) document.querySelectorAll(".mob-collapse.open").forEach(o=>{ if(o!==el) o.classList.remove("open"); });
    });
  }
  window.__mkCollapse=makeCollapsible;
  makeCollapsible(document.querySelector(".filtre"),  "🌲");
  makeCollapsible(document.querySelector(".obsctrl"), "🧺");
  makeCollapsible(document.querySelector(".rejeu"),   "🕒");
  makeCollapsible(document.querySelector(".statctrl"),"🌧️");
}

// ============================================================================
// BUREAU : largeur du panneau de droite ajustable (glisser la poignee gauche).
// Elargir le panneau elargit ET agrandit le graphique. Sans effet sur mobile.
// Place APRES le bloc mobile : ne peut donc pas empecher l'ergonomie tactile.
// ============================================================================
try{
  if(!IS_MOBILE){
    const mainEl=document.querySelector("main");
    const grip=document.getElementById("aside-resizer");
    const LS="champipi_asidew";
    const clampW=(w)=>Math.max(300,Math.min(w,Math.round(window.innerWidth*0.72)));
    function applyW(w){
      w=clampW(w);
      mainEl.style.setProperty("--aside-w", w+"px");
      mainEl.style.setProperty("--chart-h", Math.round(Math.min(340,Math.max(180,w*0.55)))+"px");
      if(chart) chart.resize();
      if(typeof map!=="undefined" && map && map.invalidateSize) map.invalidateSize(false);
    }
    try{ const s=localStorage.getItem(LS); if(s) applyW(parseInt(s,10)); }catch(_){}
    if(grip){
      let drag=false;
      const wOf=(e)=> window.innerWidth-(e.touches?e.touches[0].clientX:e.clientX);
      const readW=()=> parseInt(getComputedStyle(mainEl).getPropertyValue("--aside-w"),10)||340;
      function down(e){ drag=true; grip.classList.add("active");
        document.body.classList.add("aside-resizing"); if(e.cancelable)e.preventDefault(); }
      function mv(e){ if(!drag) return; applyW(wOf(e)); if(e.cancelable)e.preventDefault(); }
      function up(){ if(!drag) return; drag=false; grip.classList.remove("active");
        document.body.classList.remove("aside-resizing");
        try{ localStorage.setItem(LS,String(readW())); }catch(_){}
        if(chart) chart.resize();
        if(typeof map!=="undefined" && map && map.invalidateSize) map.invalidateSize(false); }
      grip.addEventListener("mousedown",down);
      window.addEventListener("mousemove",mv);
      window.addEventListener("mouseup",up);
      grip.addEventListener("dblclick",()=>{ applyW(340); try{ localStorage.removeItem(LS); }catch(_){} });
    }
    window.addEventListener("resize",()=>{ applyW(parseInt(getComputedStyle(mainEl).getPropertyValue("--aside-w"),10)||340); });
  }
}catch(e){ /* redimensionnement non-critique : ne doit jamais casser la page */ }
