<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Champipi — Cèpes en Lozère</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --n0:#9e9e9e; --n1:#b71c1c; --n2:#ef6c00; --n3:#f9a825; --n4:#7cb342; --n5:#2e7d32;
    --bg:#f5f4f0; --panel:#ffffff; --ink:#2b2b28; --muted:#6b6b63; --line:#e2e0da;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
  #app{display:flex;flex-direction:column;height:100%}
  header{padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:14px}
  header h1{font-size:18px;margin:0;font-weight:650}
  header h1 span{opacity:.55;font-weight:400}
  .dept{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:13px;color:var(--muted)}
  .badge{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:20px;background:#f0efe9;font-weight:600;color:var(--ink)}
  .dot{width:12px;height:12px;border-radius:50%}
  main{flex:1;display:flex;min-height:0}
  #map{flex:1;min-width:0}
  aside{width:340px;max-width:42vw;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:16px}
  aside h2{font-size:15px;margin:0 0 4px}
  .hint{color:var(--muted);font-size:13px;line-height:1.5}
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
  .metric{background:#faf9f5;border:1px solid var(--line);border-radius:10px;padding:9px 11px}
  .metric .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .metric .v{font-size:19px;font-weight:650;margin-top:2px}
  .chartwrap{margin-top:10px;height:180px}
  .top{margin-top:8px;font-size:13px}
  .top .row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
  .legend{font-size:12px;color:var(--muted);line-height:1.9;margin-top:14px}
  .legend .li{display:flex;align-items:center;gap:8px}
  .foot{margin-top:16px;font-size:11px;color:var(--muted);line-height:1.6;border-top:1px solid var(--line);padding-top:10px}
  .pill{font-size:11px;padding:2px 8px;border-radius:20px;background:#f0efe9;color:var(--muted)}
  /* Filtre essences (contrôle superposé à la carte) */
  .filtre{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:10px;
    padding:8px 10px;font-size:12px;box-shadow:0 1px 6px rgba(0,0,0,.12);max-width:200px}
  .filtre-h{display:flex;align-items:center;justify-content:space-between;font-weight:650;margin-bottom:4px}
  .filtre-h button{border:none;background:none;color:var(--muted);font-size:11px;cursor:pointer;padding:0}
  .filtre .grp-t{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:6px 0 2px}
  .filtre label{display:flex;align-items:center;gap:6px;padding:2px 0;cursor:pointer;line-height:1.2}
  .filtre input{margin:0;cursor:pointer}
  .filtre .sw{width:12px;height:12px;border-radius:3px;background:#2e7d32;flex:none;border:1px solid rgba(0,0,0,.15)}
  /* Curseur temporel (rejeu de l'historique) */
  .rejeu{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:10px;
    padding:8px 12px;font-size:12px;box-shadow:0 1px 6px rgba(0,0,0,.12);min-width:320px}
  .rejeu-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .rejeu-h b{font-weight:650}
  .rejeu-d{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
  .rejeu-row{display:flex;align-items:center;gap:6px}
  .rejeu-row2{display:flex;align-items:center;gap:6px;margin-top:6px}
  .rejeu input[type=range]{flex:1;cursor:pointer;accent-color:#2e7d32;min-width:80px}
  .rejeu input[type=date]{flex:1;font-size:12px;padding:2px 5px;border:1px solid var(--line);
    border-radius:6px;color:var(--ink);background:#fff;min-width:0}
  .rejeu button{border:1px solid var(--line);background:#faf9f5;border-radius:7px;
    padding:3px 7px;font-size:12px;cursor:pointer;color:var(--ink);line-height:1}
  .rejeu button:hover{background:#f0efe9}
  .rejeu .note{margin-top:5px;font-size:10.5px;color:var(--muted);line-height:1.4}
  @media(max-width:760px){main{flex-direction:column}aside{width:100%;max-width:none;border-left:none;border-top:1px solid var(--line);max-height:46%}
    .filtre{max-width:150px;font-size:11px}
    .rejeu{min-width:0;width:calc(100vw - 24px);font-size:11px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🍄 Champipi <span>· cèpes en Lozère</span></h1>
    <div class="dept">
      <span id="dept-date"></span>
      <span class="badge"><span class="dot" id="dept-dot"></span><span id="dept-val"></span></span>
    </div>
  </header>
  <main>
    <div id="map"></div>
    <aside>
      <div id="detail">
        <h2>Indice du jour</h2>
        <p class="hint">Cliquez une maille sur la carte pour voir son indice cèpe, ses composantes et l'évolution sur 15 jours.</p>
        <div class="metrics">
          <div class="metric"><div class="k">Moyenne 48</div><div class="v" id="m-moy">—</div></div>
          <div class="metric"><div class="k">Meilleure maille</div><div class="v" id="m-best">—</div></div>
        </div>
        <div class="top" id="top-zones"></div>
        <div class="legend" id="legend"></div>
      </div>
      <div class="foot" id="foot"></div>
    </aside>
  </main>
</div>
<script>
const CHAMPIPI = /*__CHAMPIPI_DATA__*/null;

const NIVEAUX = [
  {max:15, label:"très faible", col:"var(--n1)"},
  {max:35, label:"faible",      col:"var(--n2)"},
  {max:55, label:"moyen",       col:"var(--n3)"},
  {max:75, label:"bon",         col:"var(--n4)"},
  {max:Infinity, label:"excellent", col:"var(--n5)"},
];
function couleur(indice){
  if(indice===null||indice===undefined) return "#9e9e9e";
  return NIVEAUX.find(n=>indice<n.max).col
    .replace("var(--n1)","#b71c1c").replace("var(--n2)","#ef6c00")
    .replace("var(--n3)","#f9a825").replace("var(--n4)","#7cb342").replace("var(--n5)","#2e7d32");
}

// En-tête département
const D = CHAMPIPI;
document.getElementById("dept-date").textContent =
  D.date_donnees ? ("Données du "+D.date_donnees) : "";
document.getElementById("dept-val").textContent =
  (D.moyenne_departement!==null? D.moyenne_departement : "—")+" · "+D.niveau_departement;
document.getElementById("dept-dot").style.background = couleur(D.moyenne_departement);
document.getElementById("m-moy").textContent =
  (D.moyenne_departement!==null? D.moyenne_departement : "—")+" / 100";
const best = D.top && D.top.length ? D.top[0] : null;
document.getElementById("m-best").textContent = best ? (best.indice+" / 100") : "—";

// Carte
const map = L.map("map",{scrollWheelZoom:true}).setView([44.52,3.55],9);
const ATTRIB="Indice : SIM Météo-France, BRGM, Open-Meteo · Forêts : BD Forêt V2 IGN · Versant : MNT IGN RGE ALTI";
const fondTopo=L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
  {maxZoom:17, attribution:"© OpenTopoMap (CC-BY-SA) · "+ATTRIB});
const fondOSM=L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {maxZoom:17, attribution:"© OpenStreetMap · "+ATTRIB});
const fondSat=L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {maxZoom:18, attribution:"Imagerie © Esri, Maxar, Earthstar Geographics · "+ATTRIB});
fondTopo.addTo(map);   // fond par défaut : relief topographique (lisibilité du versant)
// Sélecteur de fond de carte (Topo ⇄ Plan ⇄ Satellite).
L.control.layers({"Topo (OpenTopoMap)":fondTopo,"Plan (OSM)":fondOSM,"Satellite":fondSat},
  null,{position:"bottomleft"}).addTo(map);

let chart=null;
const BASE_FILL=0.60;   // forêts un peu plus transparentes (relief visible dessous)
// Libellés des classes de versant.
const VERSANT_LBL={nord:"versant nord (ubac)", sud:"versant sud (adret)", neutre:"versant neutre"};
// Config des groupes d'essence embarquée par le robot.
const GRP={}, ESSLBL={};
(D.essence_groupes||[]).forEach(g=>{GRP[g.key]=g; ESSLBL[g.key]=g.label;});
const alphaOf = k => (GRP[k] ? GRP[k].alpha : 1);

// --- Rejeu temporel (historique long) --------------------------------------
// Force de la modulation versant, embarquée par le robot (miroir de VERSANT_K).
const VERSANT_K = (D.versant_k!=null? D.versant_k : 0.40);
// Indice d'une FACE de forêt = indice de la maille modulé par l'exposition et
// le stress du jour (réplique de indice_module() côté Python).
function moduleFace(base, expo, stress){
  if(base===null||base===undefined) return null;
  if(expo===null||expo===undefined) return base;
  let v = base * (1 + VERSANT_K*expo*(stress||0));
  return Math.round(Math.max(0, Math.min(100, v)));
}
// Historique embarqué : {dates:[...], mailles:{mid:{i:[...],s:[...]}}}.
const H = (D.historique && D.historique.dates && D.historique.dates.length) ? D.historique : null;
const HDATES = H ? H.dates : [];
let HCUR = -1;   // -1 = vue du jour (live, valeurs serveur) ; sinon index dans HDATES.

// Moyenne département à l'index k de l'historique.
function moyenneJour(k){
  if(!H) return null;
  let s=0,n=0; const M=H.mailles;
  for(const mid in M){const v=M[mid].i[k]; if(v!=null){s+=v; n++;}}
  return n? Math.round(s/n) : null;
}

// Indice affiché pour une feature : vue live (valeurs serveur) ou rejeu (index
// historique, face modulée par le versant à partir de la série SAFRAN).
function indiceAt(f){
  if(HCUR<0 || !H) return f.properties.indice;
  const m=H.mailles[f.properties.maille_id];
  if(!m) return null;
  return moduleFace(m.i[HCUR], f.properties.expo, m.s[HCUR]);
}

// Style d'un polygone : couleur = indice (date sélectionnée) ; opacité =
// étage de l'essence (les essences principales teintent plus fort).
function styleFor(f){
  const g=f.properties.groupe;
  return {fillColor:couleur(indiceAt(f)), weight:0.4, color:"#3d3d36",
          fillOpacity:BASE_FILL*(g?alphaOf(g):1), opacity:0.4};
}

// Une couche Leaflet par groupe d'essence (permet le filtre par cases).
const parGroupe={};
(D.geojson.features||[]).forEach(f=>{
  const g=f.properties.groupe||"__all__";
  (parGroupe[g]=parGroupe[g]||[]).push(f);
});
const layersByGroup={};
Object.keys(parGroupe).forEach(g=>{
  const lyr=L.geoJSON({type:"FeatureCollection",features:parGroupe[g]},{
    style:styleFor,
    onEachFeature:(f,l)=>{
      l.on("click",()=>{const p=D.mailles[f.properties.maille_id]; if(p) montrerDetail(p, f.properties);});
      l.on("mouseover",()=>l.setStyle({weight:2.2,fillOpacity:0.9}));
      l.on("mouseout",()=>lyr.resetStyle(l));
    }
  });
  layersByGroup[g]=lyr;
});
// Affichage initial : selon "defaut" de chaque groupe (reste décoché).
// On ajoute les étages faibles d'abord pour que les principales soient au-dessus.
["reste","secondaire","principale","__all__"].forEach(et=>{
  Object.keys(layersByGroup).forEach(g=>{
    const meta=GRP[g]; const etage=meta?meta.etage:"__all__";
    if(etage!==et) return;
    if(!meta || meta.defaut) layersByGroup[g].addTo(map);
  });
});
// Cadrage sur l'ensemble des forêts.
const bnds=L.latLngBounds([]);
Object.values(layersByGroup).forEach(l=>{try{bnds.extend(l.getBounds());}catch(e){}});
try{ if(bnds.isValid()) map.fitBounds(bnds,{padding:[10,10]}); }catch(e){}

// --- Contrôle de filtre par essence ---------------------------------------
if((D.essence_groupes||[]).length){
  const ctrl=L.control({position:"topright"});
  ctrl.onAdd=function(){
    const div=L.DomUtil.create("div","filtre");
    const etages=[["principale","Principales"],["secondaire","Secondaires"],["reste","Autres"]];
    let html=`<div class="filtre-h"><span>Essences</span><button id="f-all" type="button">tout</button></div>`;
    etages.forEach(([et,titre])=>{
      const gs=D.essence_groupes.filter(g=>g.etage===et);
      if(!gs.length) return;
      html+=`<div class="grp-t">${titre}</div>`;
      gs.forEach(g=>{
        html+=`<label><input type="checkbox" data-g="${g.key}" ${g.defaut?"checked":""}>`+
              `<span class="sw" style="opacity:${g.alpha}"></span>${g.label}</label>`;
      });
    });
    div.innerHTML=html;
    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.disableScrollPropagation(div);
    return div;
  };
  ctrl.addTo(map);
  const toggle=(g,on)=>{const lyr=layersByGroup[g]; if(!lyr) return;
    if(on) lyr.addTo(map); else map.removeLayer(lyr);};
  document.querySelectorAll('.filtre input[data-g]').forEach(cb=>{
    cb.addEventListener("change",()=>toggle(cb.getAttribute("data-g"),cb.checked));
  });
  const btn=document.getElementById("f-all");
  if(btn) btn.addEventListener("click",()=>{
    const boxes=[...document.querySelectorAll('.filtre input[data-g]')];
    const allOn=boxes.every(b=>b.checked);
    boxes.forEach(b=>{b.checked=!allOn; toggle(b.getAttribute("data-g"),b.checked);});
  });
}

// --- Curseur temporel (rejeu de l'historique) ------------------------------
function niveauLbl(indice){
  if(indice===null||indice===undefined) return "inconnu";
  return NIVEAUX.find(n=>indice<n.max).label;
}
function frDate(d){ if(!d) return ""; const p=d.split("-"); return p.length===3?(p[2]+"/"+p[1]+"/"+p[0]):d; }
// Recolore la carte et met à jour l'en-tête selon HCUR.
function appliquer(){
  Object.values(layersByGroup).forEach(l=>{try{l.setStyle(styleFor);}catch(e){}});
  const dd=document.getElementById("dept-date"), dv=document.getElementById("dept-val"),
        dot=document.getElementById("dept-dot"), mm=document.getElementById("m-moy");
  if(HCUR<0){                       // vue live du jour : valeurs serveur
    dd.textContent = D.date_donnees? "Données du "+D.date_donnees : "";
    dv.textContent = (D.moyenne_departement!=null?D.moyenne_departement:"—")+" · "+D.niveau_departement;
    dot.style.background = couleur(D.moyenne_departement);
    if(mm) mm.textContent=(D.moyenne_departement!=null?D.moyenne_departement:"—")+" / 100";
  } else {                          // rejeu historique
    const moy=moyenneJour(HCUR);
    dd.textContent = "Rejeu du "+frDate(HDATES[HCUR]);
    dv.textContent = (moy!=null?moy:"—")+" · "+niveauLbl(moy);
    dot.style.background = couleur(moy);
    if(mm) mm.textContent=(moy!=null?moy:"—")+" / 100";
  }
}
if(H && HDATES.length>1){
  // index de la date la plus proche d'une chaîne "YYYY-MM-DD".
  const idxProche=(s)=>{ if(s<=HDATES[0]) return 0; if(s>=HDATES[HDATES.length-1]) return HDATES.length-1;
    let lo=0,hi=HDATES.length-1; while(lo<hi){const m=(lo+hi)>>1; if(HDATES[m]<s) lo=m+1; else hi=m;}
    return (lo>0 && (s-HDATES[lo-1] < HDATES[lo]-s))? lo-1 : lo; };
  const rc=L.control({position:"bottomright"});
  rc.onAdd=function(){
    const div=L.DomUtil.create("div","rejeu");
    div.innerHTML =
      `<div class="rejeu-h">🕒 <b>Rejeu</b><span class="rejeu-d" id="rj-date">aujourd'hui</span></div>
       <div class="rejeu-row">
         <button id="rj-mp" type="button" title="− 1 mois">«</button>
         <button id="rj-dp" type="button" title="− 1 jour">‹</button>
         <button id="rj-play" type="button" title="Lecture / pause">▶</button>
         <button id="rj-dn" type="button" title="+ 1 jour">›</button>
         <button id="rj-mn" type="button" title="+ 1 mois">»</button>
         <input type="range" id="rj-range" min="0" max="${HDATES.length-1}" value="${HDATES.length-1}" step="1">
       </div>
       <div class="rejeu-row2">
         <input type="date" id="rj-input" min="${HDATES[0]}" max="${HDATES[HDATES.length-1]}" value="${HDATES[HDATES.length-1]}">
         <button id="rj-now" type="button" title="Revenir au jour courant">⤓ aujourd'hui</button>
       </div>
       <div class="note">Historique ${frDate(HDATES[0])} → ${frDate(HDATES[HDATES.length-1])} (${HDATES.length} j, source SAFRAN). ‹ › jour · « » mois · ▶ lecture · ⤓ revient au jour courant.</div>`;
    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.disableScrollPropagation(div);
    return div;
  };
  rc.addTo(map);
  const range=document.getElementById("rj-range"), lblD=document.getElementById("rj-date"),
        dateIn=document.getElementById("rj-input"), btnPlay=document.getElementById("rj-play");
  let timer=null;
  function stopPlay(){ if(timer){clearInterval(timer); timer=null;} btnPlay.textContent="▶"; }
  function setIdx(k){
    k=Math.max(0,Math.min(HDATES.length-1,k)); HCUR=k;
    range.value=k; dateIn.value=HDATES[k];
    lblD.textContent=frDate(HDATES[k])+(k===HDATES.length-1?" · dernier relevé":"");
    appliquer();
  }
  function setLive(){ stopPlay(); HCUR=-1; range.value=HDATES.length-1;
    dateIn.value=HDATES[HDATES.length-1]; lblD.textContent="aujourd'hui"; appliquer(); }
  const base=()=> HCUR<0? HDATES.length-1 : HCUR;
  const shift=(n)=>{ const d=new Date(HDATES[base()]+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+n);
    setIdx(idxProche(d.toISOString().slice(0,10))); };
  range.addEventListener("input",()=>{stopPlay(); setIdx(+range.value);});
  dateIn.addEventListener("change",()=>{stopPlay(); if(dateIn.value) setIdx(idxProche(dateIn.value));});
  document.getElementById("rj-dp").addEventListener("click",()=>{stopPlay(); shift(-1);});
  document.getElementById("rj-dn").addEventListener("click",()=>{stopPlay(); shift(1);});
  document.getElementById("rj-mp").addEventListener("click",()=>{stopPlay(); shift(-30);});
  document.getElementById("rj-mn").addEventListener("click",()=>{stopPlay(); shift(30);});
  document.getElementById("rj-now").addEventListener("click",setLive);
  btnPlay.addEventListener("click",()=>{
    if(timer){stopPlay(); return;}
    btnPlay.textContent="⏸";
    let i=base(); if(i>=HDATES.length-1) i=0;   // au bout : relance du début
    setIdx(i);
    timer=setInterval(()=>{ i++; if(i>HDATES.length-1){stopPlay(); return;} setIdx(i); }, 110);
  });
  // Défaut : vue live du jour (aucune date sélectionnée).
  setLive();
}

function metric(k,v){return `<div class="metric"><div class="k">${k}</div><div class="v">${v}</div></div>`;}
function composition(rep){
  if(!rep) return "";
  const ent=Object.entries(rep).filter(([k,v])=>v>0);
  if(!ent.length) return "";
  const tot=ent.reduce((s,[,v])=>s+v,0)||1;
  ent.sort((a,b)=>b[1]-a[1]);
  const txt=ent.map(([k,v])=>`${ESSLBL[k]||k} ${Math.round(v/tot*100)}%`).join(" · ");
  return `<p class="hint">Composition boisée : ${txt}.</p>`;
}
// Ligne "versant" affichée quand on clique une face de forêt.
function versantLigne(face, p){
  if(!face || !face.versant) return "";
  const lbl = VERSANT_LBL[face.versant] || face.versant;
  const base = p.indice, ind = face.indice;
  let effet = "";
  if(base!=null && ind!=null && base>0){
    const d = Math.round((ind/base - 1)*100);
    effet = d===0 ? " — sans effet dans les conditions du jour"
      : ` — indice <b>${ind}</b> contre ${base} de base : <b>${d>0?"+":""}${d}%</b> (${d>0?"favorisé":"pénalisé"} aujourd'hui)`;
  }
  const col = face.expo>0.05 ? "#1565c0" : (face.expo<-0.05 ? "#b2182b" : "#8a8a80");
  return `<p class="hint" style="border-left:3px solid ${col};padding-left:8px">
      Face : <b>${lbl}</b> · exposition ${face.expo>0?"+":""}${face.expo}${effet}.</p>`;
}
function montrerDetail(p, face){
  const geo = {acide:"sol acide", neutre:"sol neutre", calcaire:"sol calcaire", inconnu:"sol ?"}[p.geologie_classe]||p.geologie_classe;
  const el = document.getElementById("detail");
  el.innerHTML = `
    <h2>Maille · ${p.altitude!=null? Math.round(p.altitude)+" m":""}
      <span class="pill">${geo}</span></h2>
    <p class="hint">${p.geologie_descr||""}${p.coef_geologie!=null&&p.coef_geologie<0.5?" — terrain défavorable au cèpe (calcaire), indice réduit.":""}${p.coef_foret!=null&&p.coef_foret<0.6?" — maille peu boisée, potentiel réduit faute d'arbres hôtes.":""}${p.coef_essence!=null&&p.coef_essence<0.6?" — essences peu favorables au cèpe (hôtes secondaires), indice réduit.":""}</p>
    ${versantLigne(face, p)}
    <div class="metrics">
      ${metric("Indice cèpe", (p.indice!=null?p.indice:"—")+" · "+p.niveau)}
      ${metric("Pousse estimée", "~"+p.lag_jours+" j")}
      ${metric("Boisement", p.taux_boise!=null?Math.round(p.taux_boise*100)+" %":"—")}
      ${metric("Essence dominante", p.essence_dominante?(ESSLBL[p.essence_dominante]||p.essence_dominante):"—")}
      ${metric("Humidité sol (SWI)", p.swi!=null?p.swi:"—")}
      ${metric("Pluie 15 j", p.pluie_15j!=null?p.pluie_15j+" mm":"—")}
      ${metric("Température", p.temp!=null?p.temp+" °C":"—")}
      ${metric("Anomalie SWI", p.anomalie_swi!=null?p.anomalie_swi:"—")}
    </div>
    ${composition(p.essence_repartition)}
    <div class="chartwrap"><canvas id="chart"></canvas></div>
    <p class="hint">Sous-scores (0–1) : humidité ${p.s_humidite ?? "—"} · pluie ${p.s_pluie ?? "—"} · température ${p.s_temp ?? "—"}. L'indice du jour anticipe déjà la pousse à ~${p.lag_jours} jours.</p>
    <div class="foot" id="foot"></div>`;
  remplirFoot();
  const serie = p.serie||[];
  const ctx = document.getElementById("chart");
  if(chart) chart.destroy();
  chart = new Chart(ctx,{
    data:{
      labels: serie.map(s=>s.date.slice(5)),
      datasets:[
        {type:"line", label:"Indice", data:serie.map(s=>s.indice), yAxisID:"y",
         borderColor:"#2e7d32", backgroundColor:"rgba(46,125,50,.12)", fill:true, tension:.3, pointRadius:2},
        {type:"line", label:"Pluie 15j (mm)", data:serie.map(s=>s.pluie_15j), yAxisID:"y2",
         borderColor:"#1e88e5", borderDash:[4,3], pointRadius:0, tension:.3},
      ]
    },
    options:{responsive:true,maintainAspectRatio:false,interaction:{intersect:false,mode:"index"},
      plugins:{legend:{labels:{boxWidth:12,font:{size:10}}}},
      scales:{
        y:{min:0,max:100,title:{display:true,text:"indice",font:{size:9}},ticks:{font:{size:9}}},
        y2:{position:"right",grid:{drawOnChartArea:false},ticks:{font:{size:9}}},
        x:{ticks:{font:{size:9},maxRotation:0,autoSkip:true,maxTicksLimit:6}}
      }}
  });
}

// Top zones + légende (vue par défaut)
function remplirDefaut(){
  const t = document.getElementById("top-zones");
  if(t && D.top){
    t.innerHTML = "<h2>Meilleurs coins du jour</h2>" + D.top.map(z=>{
      const v = z.versant && VERSANT_LBL[z.versant] ? " · "+VERSANT_LBL[z.versant] : "";
      return `<div class="row"><span class="dot" style="background:${couleur(z.indice)}"></span>
       <b>${z.indice}</b> · ${z.niveau} <span class="pill">${Math.round(z.altitude||0)} m · ${z.geologie}${z.essence?" · "+(ESSLBL[z.essence]||z.essence):""}${v}</span></div>`;}).join("");
  }
  const lg = document.getElementById("legend");
  if(lg){
    lg.innerHTML = "<b>Légende</b>" + NIVEAUX.map(n=>{
      const range = n.max===Infinity? "75–100" : (NIVEAUX.indexOf(n)===0?"0–15":"");
      return `<div class="li"><span class="dot" style="background:${couleur(n.max-1)}"></span>${n.label}</div>`;
    }).join("") + `<div class="li"><span class="dot" style="background:#9e9e9e"></span>donnée manquante</div>`
    + `<div class="li" style="margin-top:6px">Teinte : essences <b>principales</b> pleines, secondaires atténuées, autres pâles. Filtre en haut à droite de la carte.</div>`
    + `<div class="li" style="margin-top:6px">Chaque forêt est découpée par <b>versant</b> — ubac (nord, frais/humide) et adret (sud, chaud/sec). L'indice de chaque face est modulé selon la météo du jour : sol sec ou chaud → l'ubac est favorisé, temps froid → l'adret. Cliquez une face pour le détail.</div>`
    + `<div class="li" style="margin-top:6px">Le <b>rejeu</b> (en bas à droite de la carte) permet de <b>remonter dans le temps</b> sur plusieurs années : curseur, saut jour/mois, choix d'une date, ▶ animation. ⤓ revient au jour courant. Utile pour comparer l'indice à ce que tu as réellement observé en forêt.</div>`;
  }
}
function remplirFoot(){
  const f=document.getElementById("foot");
  if(f) f.innerHTML =
    `Généré le ${D.genere_le} · ${D.nb_mailles} mailles de 8 km.<br>
     Indice indicatif combinant humidité du sol (SWI), pluie sur 15 j et température,
     pondéré par la géologie, le boisement et l'essence hôte, puis <b>modulé par le versant</b>
     (ubac/adret, MNT IGN RGE ALTI 10 m) selon la météo du jour. Il ne remplace pas l'observation de
     terrain ni la prudence sur la comestibilité.<br>
     Sources : Météo-France/SAFRAN (data.gouv), BRGM, Open-Meteo, IGN (BD Forêt V2, RGE ALTI).`;
}
remplirDefaut();
remplirFoot();
</script>
