<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Champipi — Cèpes en Lozère</title>
<!-- PWA / mode terrain : identité d'application + icônes. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2e5e34">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- Librairies AUTO-HÉBERGÉES (vendor/) : plus aucun CDN. Indispensable au mode
     terrain — le service worker les met en cache, la page s'ouvre sans réseau.
     Versions figées : Leaflet 1.9.4, Chart.js 4.4.1, exifr 7.1.3. -->
<link rel="stylesheet" href="vendor/leaflet.css">
<script src="vendor/leaflet.js"></script>
<script src="vendor/chart.umd.min.js"></script>
<!-- Lecture des métadonnées photo (EXIF/GPS) : JPEG + HEIC (iPhone) + PNG. Si le
     fichier ne charge pas, l'import photo bascule en saisie manuelle (marquer + dater). -->
<script src="vendor/exifr.umd.js"></script>
<style>
  :root{
    --n0:#9e9e9e; --n1:#b71c1c; --n2:#ef6c00; --n3:#f9a825; --n4:#7cb342; --n5:#2e7d32;
    --bg:#f5f4f0; --panel:#ffffff; --ink:#2b2b28; --muted:#6b6b63; --line:#e2e0da;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
  #app{display:flex;flex-direction:column;height:100%}
  header{padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:14px}
  header h1{font-size:18px;margin:0;font-weight:650}
  header h1 span{opacity:.55;font-weight:400}
  .dept{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:13px;color:var(--muted)}
  .badge{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:20px;background:#f0efe9;font-weight:600;color:var(--ink)}
  .dot{width:12px;height:12px;border-radius:50%}
  main{flex:1;display:flex;min-height:0;position:relative}
  #map{flex:1;min-width:0}
  aside{position:relative;width:var(--aside-w,340px);max-width:72vw;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:16px}
  aside h2{font-size:15px;margin:0 0 4px}
  .hint{color:var(--muted);font-size:13px;line-height:1.5}
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
  .metric{background:#faf9f5;border:1px solid var(--line);border-radius:10px;padding:9px 11px}
  .metric .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .metric .v{font-size:19px;font-weight:650;margin-top:2px}
  .chartwrap{margin-top:10px;height:var(--chart-h,180px)}
  /* Poignee de largeur du panneau (bureau) — logique dans le bloc JS de fin */
  .aside-resizer{position:absolute;top:0;bottom:0;right:var(--aside-w,340px);width:10px;margin-right:-5px;
    cursor:ew-resize;z-index:800;display:flex;align-items:center;justify-content:center;background:transparent;transition:background .12s}
  .aside-resizer::before{content:"";width:3px;height:36px;border-radius:3px;background:var(--line);transition:background .12s}
  .aside-resizer:hover,.aside-resizer.active{background:rgba(46,125,50,.07)}
  .aside-resizer:hover::before,.aside-resizer.active::before{background:#2e7d32}
  body.aside-resizing{cursor:ew-resize;user-select:none}
  .top{margin-top:8px;font-size:13px}
  .top .row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
  .legend{font-size:12px;color:var(--muted);line-height:1.9;margin-top:14px}
  .legend .li{display:flex;align-items:center;gap:8px}
  .foot{margin-top:16px;font-size:11px;color:var(--muted);line-height:1.6;border-top:1px solid var(--line);padding-top:10px}
  .synth{background:#eef5ee;border:1px solid #cfe3cf;border-radius:10px;padding:10px 12px;margin:6px 0 12px;font-size:13px;line-height:1.5}
  .synth:empty{display:none}
  .synth-t{font-weight:700;margin-bottom:4px}
  .synth-s{margin-top:4px;color:var(--muted)}
  .synth-n{margin-top:6px;font-size:11px;color:var(--muted);font-style:italic}
  .synth b{color:#1b5e20}
  .synth a{color:#1b5e20;text-decoration:underline dotted;cursor:pointer}
  .synth a:hover{background:#dcebdc}
  .synth-btn{display:inline-block;margin-top:7px;border:1px solid #9ccc9c;background:#fff;border-radius:7px;
    padding:3px 10px;font-size:12px;cursor:pointer;color:var(--ink)}
  .synth-btn:hover{background:#f3faf3}
  /* Secteurs favorables (date de prévision) : pastilles numérotées ①②③ */
  .favnum{width:24px;height:24px;border-radius:50%;background:#1e88e5;color:#fff;font-weight:800;font-size:13px;
    display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35);cursor:pointer}
  .favnum-bas{background:#90a4ae}
  .pill{font-size:11px;padding:2px 8px;border-radius:20px;background:#f0efe9;color:var(--muted)}
  /* Filtre essences (contrôle superposé à la carte) */
  .filtre{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:10px;
    padding:8px 10px;font-size:12px;box-shadow:0 1px 6px rgba(0,0,0,.12);max-width:200px}
  .filtre-h{display:flex;align-items:center;justify-content:space-between;font-weight:650;margin-bottom:4px}
  .filtre-h button{border:none;background:none;color:var(--muted);font-size:11px;cursor:pointer;padding:0}
  .filtre .grp-t{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:6px 0 2px}
  .filtre label{display:flex;align-items:center;gap:6px;padding:2px 0;cursor:pointer;line-height:1.2}
  .filtre input{margin:0;cursor:pointer}
  .filtre .sw{width:12px;height:12px;border-radius:3px;background:#2e7d32;flex:none;border:1px solid rgba(0,0,0,.15)}
  /* Curseur temporel (rejeu de l'historique) */
  .rejeu{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:10px;
    padding:8px 12px;font-size:12px;box-shadow:0 1px 6px rgba(0,0,0,.12);min-width:320px}
  .rejeu-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .rejeu-h b{font-weight:650}
  .rejeu-d{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
  .rejeu-row{display:flex;align-items:center;gap:6px}
  .rejeu-row2{display:flex;align-items:center;gap:6px;margin-top:6px}
  .rejeu input[type=range]{flex:1;cursor:pointer;accent-color:#2e7d32;min-width:80px}
  .rj-tag{font-size:10px;color:var(--muted);width:42px;flex:none;text-transform:uppercase;letter-spacing:.03em}
  .rejeu input[type=date]{flex:1;font-size:12px;padding:2px 5px;border:1px solid var(--line);
    border-radius:6px;color:var(--ink);background:#fff;min-width:0}
  .rejeu button{border:1px solid var(--line);background:#faf9f5;border-radius:7px;
    padding:3px 7px;font-size:12px;cursor:pointer;color:var(--ink);line-height:1}
  .rejeu button:hover{background:#f0efe9}
  .rejeu .note{margin-top:5px;font-size:10.5px;color:var(--muted);line-height:1.4}
  /* Contrôle Cueillettes (observations) */
  .obsctrl{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:10px;
    padding:8px 10px;font-size:12px;box-shadow:0 1px 6px rgba(0,0,0,.12);min-width:180px}
  .obs-h{display:flex;align-items:center;gap:6px;font-weight:650;margin-bottom:6px}
  .obs-h span{margin-left:auto;background:#f0efe9;border-radius:20px;padding:1px 8px;font-weight:600}
  .obs-row{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap}
  .obsctrl button,.obs-imp{border:1px solid var(--line);background:#faf9f5;border-radius:7px;
    padding:3px 8px;font-size:12px;cursor:pointer;color:var(--ink);line-height:1}
  .obsctrl button:hover,.obs-imp:hover{background:#f0efe9}
  .obs-row label{display:flex;align-items:center;gap:4px;cursor:pointer}
  .obsform label{display:block;font-size:12px;margin:8px 0 2px;color:var(--muted)}
  .obsform input,.obsform select,.obsform textarea{width:100%;font-size:13px;padding:5px 7px;
    border:1px solid var(--line);border-radius:7px;color:var(--ink);background:#fff;box-sizing:border-box}
  .obsform .rrow{display:flex;align-items:center;gap:10px}
  .obsform .rval{font-size:20px;font-weight:700;min-width:44px;text-align:center}
  .obsbtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .obsbtns button{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px;font-size:13px;cursor:pointer}
  .obsbtns .ok{background:#2e7d32;color:#fff;border-color:#2e7d32;font-weight:650}
  .obsbtns .del{background:#fff;color:#b71c1c;border-color:#e0b4b4}
  /* Poignée de la feuille glissante (masquée sur bureau) */
  .sheet-handle{display:none}
  /* Enveloppe des contrôles repliables : transparente sur bureau */
  .mob-body{display:contents}
  .mob-toggle{display:none}

  /* Bouton « ma position » (géolocalisation) */
  .locctrl button{width:34px;height:34px;font-size:18px;line-height:1;border:none;
    background:#fff;color:#1976d2;cursor:pointer;border-radius:7px;
    box-shadow:0 1px 4px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center}
  .locctrl button:hover{background:#f2f1ec}
  .locctrl button:disabled{opacity:.5;cursor:default}
  /* Calque « stations météo » (pluviomètres source de la correction) */
  .statctrl{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:10px;
    padding:7px 9px;font-size:12px;box-shadow:0 1px 6px rgba(0,0,0,.12);max-width:210px}
  .statctrl .pill{background:#f0efe9;border-radius:20px;padding:1px 7px;font-weight:600}
  .statctrl input{margin:0;cursor:pointer}
  .stat-note{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.3}
  /* Marqueur station = jauge de pluie + (si T°) mini-thermomètre de choc à droite */
  .stmk-wrap{background:none;border:none}
  .stmk-row{display:flex;align-items:flex-end;gap:2px}
  .stmk{position:relative;display:flex;flex-direction:column-reverse;gap:2px;width:17px;padding:2px;cursor:pointer;
    background:#fff;border:2px solid rgba(20,40,60,.7);border-radius:4px;box-shadow:0 2px 6px rgba(0,0,0,.5)}
  /* Mini-thermomètre : niveau = intensité du choc, couleur = sens (bleu refroidissement,
     rouge réchauffement, gris = stable). Affiché seulement si la station a une T°. */
  .thermo{position:relative;width:8px;height:40px;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
  .thermo .tube{position:absolute;left:1px;right:1px;top:1px;bottom:6px;background:#fff;
    border:1px solid rgba(20,40,60,.7);border-radius:3px 3px 0 0;overflow:hidden}
  .thermo .tfill{position:absolute;left:0;right:0;bottom:0}
  .thermo .bulb{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:8px;height:8px;
    border-radius:50%;border:1px solid rgba(20,40,60,.7);background:#fff}
  .stmk i{display:block;height:8px;border-radius:2px;background:#dbe1e6;box-shadow:inset 0 0 0 1px rgba(0,0,0,.10)}
  .stmk:hover{border-color:#0d47a1;box-shadow:0 2px 8px rgba(13,71,161,.6)}
  /* Pastille de fraîcheur (levier 1) : rien si à jour, orange si lacunaire,
     gris + marqueur atténué si muette (probablement hors service). */
  .stmk .stdot{position:absolute;top:-5px;right:-5px;width:9px;height:9px;border-radius:50%;
    border:1.5px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.5);z-index:2}
  .stmk .stdot.lac{background:#f9a825}
  .stmk .stdot.muet{background:#9e9e9e}
  .stmk.muet{opacity:.55;filter:grayscale(.45)}
  /* Badge « choc thermique + sol humide » (appel à pousse) : flocon en coin
     haut-gauche + anneau bleu autour du marqueur, pour le repérer d'un coup d'œil. */
  .stmk.choc{border-color:#1565c0;box-shadow:0 0 0 2px rgba(21,101,192,.35),0 2px 8px rgba(21,101,192,.55)}
  .stmk .stchoc{position:absolute;top:-7px;left:-7px;width:14px;height:14px;border-radius:50%;
    background:#1565c0;color:#fff;font-size:9px;line-height:14px;text-align:center;
    border:1.5px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.5);z-index:3}
  .statctrl .lgd{display:inline-block;width:9px;height:9px;border-radius:50%;
    border:1px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25);vertical-align:-1px;margin-right:2px}
  .statctrl .lgd.lac{background:#f9a825} .statctrl .lgd.muet{background:#9e9e9e}
  .statctrl .lgd.choc{background:#1565c0;color:#fff;font-size:8px;line-height:9px;text-align:center;border-radius:50%}
  /* Graphe de température (bande TN–TX + point TM) dans le panneau station */
  .tbars{position:relative;display:flex;align-items:stretch;gap:3px;height:120px;
    padding:4px 0 2px;margin-top:2px}
  .tbars .tcol{flex:1;position:relative;min-width:0}
  .tbars .trange{position:absolute;left:50%;transform:translateX(-50%);width:5px;
    border-radius:3px;background:linear-gradient(#e53935,#1e88e5)}
  .tbars .tmid{position:absolute;left:50%;transform:translate(-50%,50%);width:9px;height:9px;
    border-radius:50%;background:#fff;border:2px solid #37474f;z-index:2}
  .tbars .tref{position:absolute;left:0;right:0;border-top:1px dashed #b0bec5;font-size:8px;
    color:var(--muted);pointer-events:none}
  .tbars .tref.gel{border-top:1px solid #1565c0}
  .tbars .tband{position:absolute;left:0;right:0;background:rgba(46,125,50,.10);pointer-events:none}
  .tbars .tref span{position:absolute;right:0;top:-9px;background:var(--card,#fff);padding:0 2px}
  .tdays{display:flex;gap:3px;margin-top:1px}
  .tdays .td{flex:1;font-size:8px;color:var(--muted);text-align:center;min-width:0}
  /* Barres de pluie (fenêtre d'affichage) dans le panneau latéral (clic station) */
  .stbars{display:flex;align-items:flex-end;gap:3px;height:98px;padding:6px 0 2px}
  .stbars .sbar2{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .stbars .sbar2 i{display:block;width:100%;max-width:16px;border-radius:2px 2px 0 0;background:#cfd8dc}
  .stbars .sbar2 .mm{font-size:8px;line-height:1;margin-bottom:2px;min-height:9px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .stbars .sbar2 .mm.on{color:#0d47a1;font-weight:650}
  .stbars .sbar2 .mm.off{color:#c7ccd1}
  .stbars .sbar2 .d{font-size:8px;color:var(--muted);margin-top:3px}
  /* ====================== MOBILE ====================== */
  @media(max-width:760px){
    header{padding:9px 14px;gap:8px}
    header h1{font-size:16px}
    .dept{font-size:12px;gap:6px}

    /* La carte occupe tout l'espace ; la feuille se superpose. */
    main{display:block;position:relative}
    #map{position:absolute;inset:0;height:100%}
    .aside-resizer{display:none}          /* pas de redimensionnement de largeur sur mobile */
    .chartwrap{height:180px}              /* la feuille glissante gere sa propre hauteur */

    /* --- Feuille glissante (bottom sheet) --- */
    aside{
      position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;max-width:none;
      height:88vh;border-left:none;border-top:none;border-radius:16px 16px 0 0;
      box-shadow:0 -4px 24px rgba(0,0,0,.18);padding:0 16px 24px;
      transform:translateY(calc(88vh - 104px));  /* réduite : ~104px visibles */
      transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:1200;
      overflow:hidden;
    }
    aside.dragging{transition:none}
    aside.half{transform:translateY(46vh)}
    aside.full{transform:translateY(0)}
    /* Contenu défilable seulement quand la feuille est ouverte. */
    #detail,#foot{overflow-y:auto}
    aside.full #detail{max-height:calc(88vh - 64px);overflow-y:auto}
    aside.half #detail{max-height:38vh;overflow-y:auto}

    .sheet-handle{
      display:block;position:sticky;top:0;background:var(--panel);
      padding:10px 0 8px;cursor:grab;z-index:2;touch-action:none;
    }
    .sheet-handle::before{
      content:"";display:block;width:44px;height:5px;border-radius:3px;
      background:#cfcdc4;margin:0 auto;
    }

    /* Cibles tactiles plus grandes dans le panneau */
    .metrics{gap:10px}
    .metric{padding:11px 12px}
    .metric .v{font-size:20px}
    .top .row{padding:9px 0}
    .obsbtns button,.obsform input,.obsform select,.obsform textarea{
      padding:11px;font-size:15px}
    #d-back,#o-back{padding:8px 12px!important;font-size:14px!important}

    /* --- Contrôles repliés en boutons-icônes --- */
    .leaflet-top,.leaflet-bottom{z-index:1100}
    /* Remonter les contrôles du bas au-dessus de la feuille réduite */
    .leaflet-bottom{bottom:112px}
    .leaflet-control-layers{margin-bottom:6px!important}
    /* Bouton position plus grand au doigt */
    .locctrl button{width:42px;height:42px;font-size:22px;border-radius:50%}

    .mob-collapse{
      padding:0!important;min-width:0!important;width:auto!important;
      border-radius:27px!important;box-shadow:0 2px 8px rgba(0,0,0,.22)!important;
    }
    .mob-collapse .mob-body{display:none}
    .mob-toggle{
      display:flex;align-items:center;justify-content:center;
      width:46px;height:46px;font-size:22px;line-height:1;
      border:none;background:transparent;cursor:pointer;padding:0;border-radius:27px;
    }
    .mob-collapse.open{
      padding:10px 12px!important;border-radius:14px!important;
      max-width:78vw!important;width:auto!important;
    }
    .mob-collapse.open .mob-body{display:block;max-height:52vh;overflow:auto}
    .mob-collapse.open .mob-toggle{
      width:100%;height:auto;justify-content:flex-end;padding:0 0 6px;font-size:18px;
    }
    .mob-collapse.open .mob-toggle::after{content:"✕";margin-left:6px;color:var(--muted);font-size:15px}
    .rejeu.mob-collapse.open{min-width:0;width:78vw!important}
  }
  /* --- Mode terrain (PWA) : bandeau hors-ligne + panneau « Préparer ma sortie » --- */
  #offband{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:1600;display:none;
    background:#b71c1c;color:#fff;font-size:12.5px;font-weight:600;padding:6px 14px;
    border-radius:20px;box-shadow:0 2px 10px rgba(0,0,0,.3);max-width:88vw;text-align:center}
  #offband.on{display:block}
  /* Bandeau de mise à jour (vérification au lancement, téléchargement, à jour) */
  #majband{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:1601;
    display:none;align-items:center;gap:8px;background:#37474f;color:#fff;font-size:12.5px;
    font-weight:600;padding:6px 14px;border-radius:20px;box-shadow:0 2px 10px rgba(0,0,0,.3);
    max-width:88vw;text-align:center;line-height:1.35;transition:background .3s}
  #majband.on{display:flex}
  #majband.ok{background:#2e7d32}
  #majband.dl{background:#1565c0}
  #majband.warn{background:#e65100}
  #majband .majspin{display:none;width:14px;height:14px;flex:none;border-radius:50%;
    border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:majrot .8s linear infinite}
  #majband.check .majspin,#majband.dl .majspin{display:block}
  #majband .majbar{position:absolute;left:12px;right:12px;bottom:2px;height:2px;
    background:rgba(255,255,255,.25);border-radius:2px;overflow:hidden;display:none}
  #majband.dl .majbar{display:block}
  #majband .majbar>i{display:block;height:100%;width:0;background:#fff;transition:width .3s}
  #majband button{flex:none;border:none;border-radius:12px;padding:3px 10px;font:inherit;
    font-size:12px;background:#fff;color:#1b1b1b;cursor:pointer}
  @keyframes majrot{to{transform:rotate(360deg)}}
  .prepctrl>button{width:34px;height:34px;font-size:18px;line-height:1;border:none;
    border-radius:8px;background:rgba(255,255,255,.96);border:1px solid var(--line);
    box-shadow:0 1px 6px rgba(0,0,0,.12);cursor:pointer}
  .prepctrl>button:hover{background:#f2f1ec}
  .prep{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:10px;
    padding:9px 11px;font-size:12px;box-shadow:0 1px 6px rgba(0,0,0,.12);max-width:236px;line-height:1.45}
  .prep-h{display:flex;align-items:center;justify-content:space-between;font-weight:650;margin-bottom:4px}
  .prep-h button{border:none;background:none;color:var(--muted);font-size:11px;cursor:pointer;padding:0}

  .prep .go{width:100%;margin-top:4px;padding:7px 0;border:none;border-radius:8px;cursor:pointer;
    background:#2e7d32;color:#fff;font-weight:650;font-size:12.5px}
  .prep .go:disabled{opacity:.55;cursor:default}
  .prep .bar{height:6px;background:#eceae4;border-radius:4px;overflow:hidden;margin-top:7px;display:none}
  .prep .bar i{display:block;height:100%;width:0;background:#2e7d32;transition:width .2s}

  /* --- Fraîcheur des données : encadré d'avertissement + marque sur la date --- */
  .fraich{display:none;position:relative;margin:0 0 10px;padding:8px 26px 8px 10px;border-radius:8px;
    font-size:12px;line-height:1.4;border:1px solid #f0c27b;background:#fff6e5;color:#6b3d00}
  .fraich.on{display:block}

  .fraich li{margin:1px 0}
  .fraich .fx{position:absolute;top:4px;right:6px;border:none;background:none;cursor:pointer;
    font-size:14px;color:inherit;opacity:.7;padding:2px 4px}
  #dept-date.stale::after{content:" ⚠";color:#e65100}
  #dept-date.stale.bad::after{color:#b71c1c}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🍄 Champipi <span>· cèpes en Lozère</span></h1>
    <div class="dept">
      <span id="dept-date"></span>
      <span class="badge"><span class="dot" id="dept-dot"></span><span id="dept-val"></span></span>
    </div>
  </header>
  <main>
    <div id="map"></div>
    <div class="aside-resizer" id="aside-resizer" title="Glisser pour elargir le panneau (double-clic : largeur par defaut)"></div>
    <aside>
      <div class="sheet-handle" id="sheet-handle" title="Glisser pour ouvrir/fermer"></div>
      <div id="detail">
        <h2>Indice du jour</h2>
        <div class="fraich" id="fraich-box"></div>
        <p class="hint">Cliquez une maille sur la carte pour voir son indice cèpe, ses composantes et l'évolution sur 15 jours.</p>
        <div class="metrics">
          <div class="metric"><div class="k">Moyenne 48</div><div class="v" id="m-moy">—</div></div>
          <div class="metric"><div class="k">Meilleure maille</div><div class="v" id="m-best">—</div></div>
        </div>
        <div id="lune-box"></div>
        <div class="synth" id="prev-synth"></div>
        <div class="top" id="top-zones"></div>
        <div class="legend" id="legend"></div>
      </div>
      <div class="foot" id="foot"></div>
    </aside>
  </main>
</div>
<script>
const CHAMPIPI = /*__CHAMPIPI_DATA__*/null;

const NIVEAUX = [
  {max:15, label:"très faible", col:"var(--n1)"},
  {max:35, label:"faible",      col:"var(--n2)"},
  {max:55, label:"moyen",       col:"var(--n3)"},
  {max:75, label:"bon",         col:"var(--n4)"},
  {max:Infinity, label:"excellent", col:"var(--n5)"},
];
// Couleur de l'indice : DÉGRADÉ CONTINU 0-100 (interpolation RVB entre 5 teintes
// ancre, alignées sur les anciens paliers). Chaque point d'indice a sa nuance —
// indispensable pour VOIR l'évaluation fine par parcelle (l'escalier à 5 couleurs
// écrasait les écarts intra-maille). Les libellés (niveauLbl) restent, eux, à paliers.
const COUL_STOPS=[[0,183,28,28],[25,239,108,0],[50,249,168,37],[70,124,179,66],[100,46,125,50]];
function couleur(indice){
  if(indice===null||indice===undefined||Number.isNaN(indice)) return "#9e9e9e";
  const x=Math.max(0,Math.min(100,indice));
  for(let i=1;i<COUL_STOPS.length;i++){
    const b=COUL_STOPS[i];
    if(x<=b[0]){
      const a=COUL_STOPS[i-1], t=(x-a[0])/(b[0]-a[0]);
      const r=Math.round(a[1]+(b[1]-a[1])*t),
            g=Math.round(a[2]+(b[2]-a[2])*t),
            bl=Math.round(a[3]+(b[3]-a[3])*t);
      return `rgb(${r},${g},${bl})`;
    }
  }
  return "rgb(46,125,50)";
}

// ============================================================================
// BOOTSTRAP MULTI-DÉPARTEMENT (b)
// La page n'embarque plus que le SIGNAL DU JOUR (léger, chiffré). La géométrie
// (geom_XX.json, statique, public) et l'historique long (hist_XX.json) sont des
// fichiers externes chargés à la demande. `D` est reconstruit ici à la forme
// qu'attend le reste du code, en fusionnant les départements chargés.
const RAW      = CHAMPIPI || {};
const PARAMS   = RAW.params || {};
const DEPTS    = RAW.departements || [];        // registre : {code,nom,bbox,geom,hist}
const DEPTDATA = RAW.dept || {};                // signal du jour par département
const LOADED_GEOM = {};                          // code -> true quand geom chargée
let   HIST_STATE  = "absent";                    // absent | leger | chargement | pret

const D = {
  genere_le:       RAW.genere_le,
  lag_indicatif:   PARAMS.lag_indicatif,
  versant_k:       PARAMS.versant_k,
  choc:            PARAMS.choc,
  essence_groupes: PARAMS.essence_groupes || [],
  // Historique long des stations (fichier externe commun à tous les départements,
  // chargé à la demande) : {url, debut, fin, n, postes} ou null.
  stations_hist:   RAW.stations_hist || null,
  mailles:{}, top:[], stations:[], stations_date:null,
  prevision:null, historique:null,
  geojson:{type:"FeatureCollection", features:[]},
  date_donnees:null, moyenne_departement:null, niveau_departement:null, nb_mailles:0,
};

// Fusionne le signal du jour (inline) de tous les départements présents. Les id
// de maille SAFRAN sont uniques au niveau national -> fusion de dicts sûre. La
// moyenne et le top sont recalculés sur l'ensemble chargé.
function mergeDeptInline(){
  const mailles={}; let top=[], stations=[], nb=0, dd=null, sdate=null;
  let prevDates=null; const prevMailles={};
  for(const code in DEPTDATA){
    const dp=DEPTDATA[code]||{};
    Object.assign(mailles, dp.mailles||{});
    (dp.top||[]).forEach(t=>top.push(t));
    (dp.stations||[]).forEach(s=>{ if(!stations.some(x=>x.num===s.num)) stations.push(s); });
    if(dp.stations_date) sdate=dp.stations_date;
    nb += dp.nb_mailles||0;
    if(dp.date_donnees && (!dd || dp.date_donnees>dd)) dd=dp.date_donnees;
    if(dp.prevision && dp.prevision.dates){
      prevDates=dp.prevision.dates; Object.assign(prevMailles, dp.prevision.mailles||{});
    }
  }
  D.mailles=mailles; D.stations=stations; D.stations_date=sdate;
  D.nb_mailles=nb; D.date_donnees=dd;
  let s=0,n=0; for(const mid in mailles){const v=mailles[mid].indice; if(v!=null){s+=v;n++;}}
  D.moyenne_departement = n? Math.round(s/n) : null;
  D.niveau_departement  = niveauLbl(D.moyenne_departement);
  top.sort((a,b)=>b.indice-a.indice); D.top=top.slice(0,5);
  D.prevision = prevDates? {dates:prevDates, mailles:prevMailles} : null;
}
mergeDeptInline();
// Titre : reflète les départements chargés (« cèpes en Lozère · Gard · Ardèche »).
(function(){ const sp=document.querySelector("header h1 span");
  if(sp && DEPTS.length){ sp.textContent = "· cèpes en "+DEPTS.map(d=>d.nom).join(" · "); }
  if(DEPTS.length){ document.title = "Champipi — "+DEPTS.map(d=>d.nom).join(" · "); } })();

// En-tête département (état initial ; réécrit par appliquer() au fil du rejeu).
document.getElementById("dept-date").textContent =
  D.date_donnees ? ("Données du "+D.date_donnees) : "";
document.getElementById("dept-val").textContent =
  (D.moyenne_departement!==null? D.moyenne_departement : "—")+" · "+(D.niveau_departement||"—");
document.getElementById("dept-dot").style.background = couleur(D.moyenne_departement);
document.getElementById("m-moy").textContent =
  (D.moyenne_departement!==null? D.moyenne_departement : "—")+" / 100";
const best = D.top && D.top.length ? D.top[0] : null;
document.getElementById("m-best").textContent = best ? (best.indice+" / 100") : "—";

// Carte
const map = L.map("map",{scrollWheelZoom:true}).setView([44.52,3.55],9);
// Pane dédié aux forêts, SOUS les marqueurs (cueillettes/stations restent cliquables).
map.createPane("foret"); map.getPane("foret").style.zIndex=350;
// Rendu CANVAS des forêts : le passage à une évaluation PAR PARCELLE multiplie
// le nombre de polygones (~1 500 faces → ~15 000 parcelles). Le SVG saturerait ;
// le canvas peint tout sur une seule surface et reste fluide, même sur mobile.
// Le survol/clic par parcelle reste natif (Leaflet fait le test point-in-polygone).
const foretRenderer = L.canvas({pane:"foret", padding:0.5});
// --- Secteurs favorables à une DATE DE PRÉVISION -----------------------------
// Quand le curseur est sur un jour futur, on matérialise les mailles dont
// l'indice prévu ≥ SEUIL_FAV : contour bleu pointillé (emprise des parcelles
// de la maille = ~8 km SAFRAN, on ne prétend pas désigner un bois précis) et
// pastilles ①②③ sur les trois meilleures. Pane au-dessus des forêts, sous les
// marqueurs.
map.createPane("fav"); map.getPane("fav").style.zIndex=450;
const favLayer = L.layerGroup().addTo(map);
const SEUIL_FAV = 55;                       // même seuil que la synthèse fillSynth
let MAILLE_BBOX = {};                       // mid -> [lonMin, latMin, lonMax, latMax]
function calcMailleBbox(){
  MAILLE_BBOX={};
  const walk=(c,b)=>{ if(typeof c[0]==="number"){ if(c[0]<b[0])b[0]=c[0]; if(c[1]<b[1])b[1]=c[1];
      if(c[0]>b[2])b[2]=c[0]; if(c[1]>b[3])b[3]=c[1]; return; } for(let i=0;i<c.length;i++) walk(c[i],b); };
  (D.geojson.features||[]).forEach(f=>{
    const mid=f.properties&&f.properties.maille_id; if(!mid||!f.geometry) return;
    const b=MAILLE_BBOX[mid]||(MAILLE_BBOX[mid]=[Infinity,Infinity,-Infinity,-Infinity]);
    try{ walk(f.geometry.coordinates,b); }catch(e){}
  });
}
function majSecteursFavorables(){
  favLayer.clearLayers();
  if(!H || HCUR<0 || HCUR<=TODAY_IDX) return;           // seulement sur une date future
  // Même liste que la synthèse : TOUTES les mailles classées par indice prévu.
  // Contour = seulement si ≥ SEUIL_FAV (« favorable ») ; pastilles ①②③ = les 3
  // meilleures quoi qu'il arrive (grisées sous le seuil : citées, pas favorables).
  const k=HCUR, arr=[];
  for(const mid in H.mailles){ const v=H.mailles[mid].i?H.mailles[mid].i[k]:null;
    if(v!=null && D.mailles[mid]) arr.push({mid,v}); }
  arr.sort((a,b)=>b.v-a.v);
  arr.forEach((z,i)=>{
    if(i>=3 && z.v<SEUIL_FAV) return;
    const m=D.mailles[z.mid]||{}, bb=MAILLE_BBOX[z.mid];
    const fav=z.v>=SEUIL_FAV;
    if(fav){
      const st={pane:"fav",color:COL_FUTUR,weight:i<3?2.4:1.3,dashArray:"6 4",fill:false,interactive:false};
      if(bb && isFinite(bb[0])) favLayer.addLayer(L.rectangle([[bb[1],bb[0]],[bb[3],bb[2]]],st));
      else if(m.lat!=null && m.lon!=null) favLayer.addLayer(L.circle([m.lat,m.lon],Object.assign({radius:4000},st)));
    }
    if(i<3 && m.lat!=null && m.lon!=null){
      const mk=L.marker([m.lat,m.lon],{icon:L.divIcon({className:"",html:`<div class="favnum${fav?"":" favnum-bas"}">${i+1}</div>`,
        iconSize:[24,24],iconAnchor:[12,12]}), zIndexOffset:1000});
      mk.bindTooltip(`n°${i+1} · indice ${z.v}${fav?"":" (sous le seuil "+SEUIL_FAV+")"} · ${Math.round(m.altitude||0)} m ${m.geologie_classe||""}`,{direction:"top"});
      mk.on("click",()=>{ deselectLayer(); ouvrirDetail(z.mid); });
      favLayer.addLayer(mk);
    }
  });
}
// Centre la carte sur une maille (secteur) et ouvre sa fiche.
function allerAuSecteur(mid){
  const m=D.mailles[mid]; if(!m) return;
  if(m.lat!=null && m.lon!=null){ try{ map.setView([m.lat,m.lon], Math.max(map.getZoom(),11)); }catch(e){} }
  deselectLayer(); ouvrirDetail(mid);
}
// Cadrage initial : union des emprises des départements du registre.
(function(){ const bb=L.latLngBounds([]);
  DEPTS.forEach(d=>{ if(d.bbox) bb.extend(L.latLngBounds([d.bbox[0][0],d.bbox[0][1]],[d.bbox[1][0],d.bbox[1][1]])); });
  try{ if(bb.isValid()) map.fitBounds(bb,{padding:[10,10]}); }catch(e){} })();
const ATTRIB="Indice : SIM Météo-France, BRGM, Open-Meteo · Forêts : BD Forêt V2 IGN · Versant : MNT IGN RGE ALTI";
// crossOrigin : les tuiles sont demandées en CORS -> le service worker peut les
// mettre en cache « en clair » (une réponse opaque coûterait ~7 Mo de quota
// chacune dans Chrome). Ces trois serveurs envoient bien Access-Control-Allow-Origin.
const fondTopo=L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
  {maxZoom:17, crossOrigin:true, attribution:"© OpenTopoMap (CC-BY-SA) · "+ATTRIB});
const fondOSM=L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {maxZoom:17, crossOrigin:true, attribution:"© OpenStreetMap · "+ATTRIB});
const fondSat=L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {maxZoom:18, crossOrigin:true, attribution:"Imagerie © Esri, Maxar, Earthstar Geographics · "+ATTRIB});
fondTopo.addTo(map);   // fond par défaut : relief topographique (lisibilité du versant)
// Sélecteur de fond de carte (Topo ⇄ Plan ⇄ Satellite).
L.control.layers({"Topo (OpenTopoMap)":fondTopo,"Plan (OSM)":fondOSM,"Satellite":fondSat},
  null,{position:"bottomleft"}).addTo(map);

let chart=null;
const BASE_FILL=0.60;   // forêts un peu plus transparentes (relief visible dessous)
// Libellés des classes de versant.
const VERSANT_LBL={nord:"versant nord (ubac)", sud:"versant sud (adret)", neutre:"versant neutre"};
// Config des groupes d'essence embarquée par le robot.
const GRP={}, ESSLBL={};
(D.essence_groupes||[]).forEach(g=>{GRP[g.key]=g; ESSLBL[g.key]=g.label;});
const alphaOf = k => (GRP[k] ? GRP[k].alpha : 1);

// --- Rejeu temporel (historique long) --------------------------------------
// Force de la modulation versant, embarquée par le robot (miroir de VERSANT_K).
const VERSANT_K = (D.versant_k!=null? D.versant_k : 0.40);
// Modulation par ALTITUDE de la parcelle (miroir de config ALT_K / ALT_ECHELLE_M).
const ALT_K       = (PARAMS.alt_k!=null? PARAMS.alt_k : 0.35);
const ALT_ECHELLE = (PARAMS.alt_echelle!=null? PARAMS.alt_echelle : 300.0);
const ALT_SEUIL   = (PARAMS.alt_seuil!=null? PARAMS.alt_seuil : 1000);
const LAG_PLAINE  = (PARAMS.lag_plaine!=null? PARAMS.lag_plaine : 10);
const LAG_ALT     = (PARAMS.lag_altitude!=null? PARAMS.lag_altitude : 15);
// Lag biologique propre à une altitude (réplique de compute_index.lag_jours).
function lagPour(alt){ return (alt!=null && alt>=ALT_SEUIL) ? LAG_ALT : LAG_PLAINE; }
// Fraîcheur relative d'une parcelle dans [-1,+1] (réplique de versant.coolness).
function coolness(alt, altMaille){
  if(alt==null || altMaille==null) return 0;
  return Math.max(-1, Math.min(1, (alt-altMaille)/ALT_ECHELLE));
}
// Fraîcheur d'une feature parcelle depuis son alt propre et l'alt de sa maille.
function coolFeat(f){
  const m=D.mailles[f.properties.maille_id];
  return coolness(f.properties.alt, m? m.altitude : null);
}
// Paramètres du choc thermique (miroir de config.py), pour l'affichage du détail.
const CH = D.choc || {k:0.20,k_chaud:0.10,min:2,opt:6,recent:4,ref:7};
if(CH.gel==null) CH.gel=1.0;   // seuil gel (garde-fou choc station), miroir GEL_SEUIL_C
// Seuils du calque station (miroirs de config.py) — servent au RECALCUL côté page
// quand on rejoue une date passée : le serveur n'envoie que la photo du jour.
if(CH.p15min==null) CH.p15min=20;   // PLUIE_15J_MIN : sol « assez humide »
if(CH.smin==null)   CH.smin=0.5;    // STATION_CHOC_SCORE_MIN : choc « marqué »
if(CH.stj==null)    CH.stj=14;      // STATION_CHOC_JOURS : fenêtre d'analyse
if(CH.serj==null)   CH.serj=20;     // STATION_SERIE_JOURS : série affichée
if(CH.okj==null)    CH.okj=2;       // STATION_FRESH_OK_J
if(CH.muetj==null)  CH.muetj=7;     // STATION_FRESH_MUET_J
if(CH.couv==null)   CH.couv=0.6;    // STATION_COUV_MIN
if(CH.actj==null)   CH.actj=33;     // fenêtre d'ACTIVITÉ du poste (collecte serveur)
// Refroidissement R (°C) à l'index k d'une série de températures : moyenne de la
// fenêtre de référence (avant) moins la fenêtre récente. Réplique de compute_index.
function refroidissementJS(ts, k){
  if(!ts) return null;
  const moy=(a,b)=>{let s=0,n=0;for(let j=Math.max(0,a);j<=b;j++){const v=ts[j];if(v!=null){s+=v;n++;}}return n?s/n:null;};
  const rec=moy(k-CH.recent+1,k), ref=moy(k-CH.recent-CH.ref+1,k-CH.recent);
  if(rec==null||ref==null) return null;
  return ref-rec;
}
function scoreChocJS(R){ if(R==null) return 0; const x=Math.abs(R);
  const s = x<=CH.min?0 : x>=CH.opt?1 : (x-CH.min)/(CH.opt-CH.min);
  return R>0? s : -s; }
// Viabilité thermique (cloche, réplique de score_temperature) : 0 hors plage.
function scoreTempJS(t){
  if(t==null) return 0;
  if(t<=CH.tmin || t>=CH.tmax) return 0;
  if(t<CH.tob) return (t-CH.tmin)/(CH.tob-CH.tmin);
  if(t<=CH.toh) return 1;
  return (CH.tmax-t)/(CH.tmax-CH.toh);
}
// Effet net du choc sur l'indice (%). Le refroidissement (positif) est gaté par
// la viabilité thermique : un plongeon vers le gel ne déclenche rien.
function effetChoc(R, temp){
  let s=scoreChocJS(R);
  if(s>0) s*=scoreTempJS(temp);
  return Math.round((s>=0?CH.k:CH.k_chaud)*s*100);
}
function chocHTML(R, temp){
  if(R==null) return "";
  const eff=effetChoc(R, temp);
  if(Math.abs(R)<CH.min || eff===0){
    const cause = (R>0 && scoreTempJS(temp)===0) ? "température hors plage viable"
                 : "trop faible pour peser";
    return `<p class="hint" style="border-left:3px solid #8a8a80;padding-left:8px">Choc thermique : ${R>0?"refroidissement":"réchauffement"} de ${Math.abs(R).toFixed(1)} °C — ${cause}.</p>`;
  }
  const fav=eff>0, col=fav?"#1565c0":"#b2182b";
  return `<p class="hint" style="border-left:3px solid ${col};padding-left:8px">
     Choc thermique : <b>${R>0?"refroidissement":"réchauffement"} de ${Math.abs(R).toFixed(1)} °C</b>
     (moyenne ${CH.recent} j récents vs ${CH.ref} j avant) → indice <b>${eff>0?"+":""}${eff}%</b>
     (${fav?"favorable, déclencheur de pousse":"défavorable"}).</p>`;
}
// --- Phase de lune : léger bonus en lune MONTANTE, maximal à la pleine lune ----
// Facteur culturel/traditionnel, appliqué comme couche globale par-dessus la
// météo (il ne change PAS le classement des mailles, seulement le niveau absolu).
// Basé sur la nuit précédant le jour affiché. Mets POIDS_LUNE=0 pour désactiver.
const POIDS_LUNE = 0.03;          // bonus max (+3 %) atteint à la pleine lune.
const SYNODIQUE  = 29.53058867;   // durée moyenne d'une lunaison (jours).
// Âge de la lune (jours depuis la dernière nouvelle lune) pour 'YYYY-MM-DD' 00h UTC.
function ageLune(dateStr){
  const [Y,M,D2]=dateStr.split("-").map(Number);
  const jd = Date.UTC(Y, M-1, D2)/86400000 + 2440587.5;   // jour julien
  let age = (jd - 2451550.1) % SYNODIQUE;                  // réf. nouvelle lune 2000-01-06
  if(age<0) age += SYNODIQUE;
  return age;
}
// Phase de la NUIT PRÉCÉDANT dateStr : {illum 0..1, montante, nom, emoji}.
function phaseLune(dateStr){
  const [Y,M,D2]=dateStr.split("-").map(Number);
  const veille = new Date(Date.UTC(Y, M-1, D2-1)).toISOString().slice(0,10);
  const p = ageLune(veille)/SYNODIQUE;                     // 0=nouvelle, .5=pleine
  const illum = (1-Math.cos(2*Math.PI*p))/2;
  const noms = [["🌑","Nouvelle lune"],["🌒","Premier croissant"],["🌓","Premier quartier"],
    ["🌔","Gibbeuse croissante"],["🌕","Pleine lune"],["🌖","Gibbeuse décroissante"],
    ["🌗","Dernier quartier"],["🌘","Dernier croissant"]];
  const [emoji,nom] = noms[Math.round(p*8)%8];
  return {illum, montante:(p<0.5), nom, emoji};
}
// Facteur multiplicatif (>=1) de l'indice : bonus seulement en lune montante.
function facteurLune(dateStr){
  if(!POIDS_LUNE || !dateStr) return 1;
  const ph = phaseLune(dateStr);
  return 1 + (ph.montante ? POIDS_LUNE*ph.illum : 0);
}
// Applique le bonus lune à un indice (arrondi, clampé 0..100). null -> null.
function avecLune(indice, dateStr){
  if(indice==null) return indice;
  return Math.round(Math.min(100, indice*facteurLune(dateStr)));
}

  const effet = bonus>0 ? `bonus pousse <b>+${bonus} %</b>`
    : (ph.montante ? "bonus négligeable (proche nouvelle lune)" : "pas de bonus (lune descendante)");

// Indice d'une PARCELLE = indice de la maille modulé par DEUX termes dynamiques
// pilotés par le même stress du jour : le versant (expo) et l'altitude propre
// (cool). Réplique de versant.indice_parcelle() côté Python.
function moduleFace(base, expo, stress, cool){
  if(base===null||base===undefined) return null;
  let v = base;
  if(expo!==null && expo!==undefined) v *= (1 + VERSANT_K*expo*(stress||0));
  if(cool)                            v *= (1 + ALT_K*cool*(stress||0));
  return Math.round(Math.max(0, Math.min(100, v)));
}
// Historique long : chargé À LA DEMANDE (hist_XX.json). Tant qu'il est absent,
// H=null et toute l'UI retombe sur la vue "live" (chemin de repli déjà géré).
let H = null;
let FUTURESTART = 0;

// Assemble H depuis les hist par département téléchargés (+ prévision inline)
// et calcule la timeline. Appelé une fois l'historique récupéré.
function finaliserHistorique(histParDept){
  let dates=null; const M={};
  for(const code in histParDept){
    const h=histParDept[code]; if(!h||!h.dates) continue;
    if(!dates) dates=h.dates.slice();
    Object.assign(M, h.mailles||{});
  }
  if(!dates){ return false; }
  assemblerH(dates, M);
  return true;
}
// Timeline LÉGÈRE, sans téléchargement : la série courte de chaque maille
// (déjà inline, ~30 j, même lag que l'indice du jour) + la prévision inline.
// Permet au curseur — et donc à la carte à une date de PRÉVISION — de marcher
// dès l'ouverture ; « Historique complet » remplace ensuite H par le rejeu long.
function finaliserHistoriqueLeger(){
  if(H) return false;
  const set=new Set();
  for(const mid in D.mailles) (D.mailles[mid].serie||[]).forEach(x=>{ if(x&&x.date) set.add(x.date); });
  const dates=[...set].sort();
  const aPrev = !!(D.prevision && D.prevision.dates && D.prevision.dates.length);
  if(!dates.length && !aPrev) return false;
  const pos={}; dates.forEach((d,i)=>pos[d]=i);
  const M={}, nn=(v)=>(v==null?null:v);
  for(const mid in D.mailles){
    const sr=D.mailles[mid].serie||[]; if(!sr.length) continue;
    const m={i:dates.map(()=>null),s:dates.map(()=>null),w:dates.map(()=>null),p:dates.map(()=>null),t:dates.map(()=>null)};
    sr.forEach(x=>{ const k=pos[x.date]; if(k==null) return;
      m.i[k]=nn(x.indice); m.s[k]=nn(x.stress); m.w[k]=nn(x.swi); m.p[k]=nn(x.pluie_15j); m.t[k]=nn(x.temp); });
    M[mid]=m;
  }
  assemblerH(dates, M);
  HIST_STATE="leger";
  return true;
}
// Assemble H = passé (dates, mailles) + prévision inline, et calcule la timeline.
function assemblerH(dates, M){
  H={dates:dates.slice(), mailles:M};
  FUTURESTART=H.dates.length;
  if(D.prevision && D.prevision.dates && D.prevision.dates.length){
    const P=D.prevision, PM=P.mailles||{};
    H.dates=H.dates.concat(P.dates);
    const ids=new Set(Object.keys(H.mailles)); Object.keys(PM).forEach(x=>ids.add(x));
    ids.forEach(mid=>{
      const hm=H.mailles[mid]||(H.mailles[mid]={}); const pm=PM[mid];
      ["i","s","w","p","t"].forEach(c=>{
        const passe=hm[c]||Array(FUTURESTART).fill(null);
        hm[c]=passe.concat(pm&&pm[c]?pm[c]:P.dates.map(()=>null));
      });
    });
  }
  HDATES=H.dates;
  TODAY_IDX=FUTURESTART;
  if(HDATES.length){
    const t=new Date(), s=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
    let bi=0,bd=Infinity; const ts=new Date(s+"T00:00:00Z").getTime();
    for(let j=0;j<HDATES.length;j++){const dd=Math.abs(new Date(HDATES[j]+"T00:00:00Z").getTime()-ts); if(dd<bd){bd=dd;bi=j;}}
    TODAY_IDX=bi;
  }
}

// Moyenne département à l'index k de l'historique.
function moyenneJour(k){

// Indice affiché pour une feature : vue live (valeurs serveur) ou rejeu (index

const parGroupe={}, layersByGroup={};

function construireCouches(){

  const etat={}; document.querySelectorAll('.filtre input[data-g]').forEach(cb=>etat[cb.getAttribute("data-g")]=cb.checked);
  Object.values(layersByGroup).forEach(l=>{try{map.removeLayer(l);}catch(e){}});
  for(const k in parGroupe) delete parGroupe[k];
  for(const k in layersByGroup) delete layersByGroup[k];
  (D.geojson.features||[]).forEach(f=>{
    const g=(f.properties&&f.properties.groupe)||"__all__";
    (parGroupe[g]=parGroupe[g]||[]).push(f);
  });
  Object.keys(parGroupe).forEach(g=>{
    const lyr=L.geoJSON({type:"FeatureCollection",features:parGroupe[g]},{
      pane:"foret", renderer:foretRenderer, style:styleFor,
      onEachFeature:(f,l)=>{
        l.on("click",(e)=>{
          if(pendingCapture){ L.DomEvent.stop(e); finirCapture(e.latlng); return; }
          if(D.mailles[f.properties.maille_id]){ selectLayer(l); ouvrirDetail(f.properties.maille_id, f.properties); }});
        l.on("mouseover",()=>{ if(l!==SELLAYER) l.setStyle({weight:2.2,fillOpacity:0.9}); });
        l.on("mouseout",()=>{ if(l!==SELLAYER) lyr.resetStyle(l); });

  function stopPlay(){ if(timer){clearInterval(timer); timer=null;} btnPlay.textContent="▶"; }
  function setIdx(k){
    k=Math.max(0,Math.min(HDATES.length-1,k)); HCUR=k;
    rgPast.value=Math.min(k,TODAY_IDX); rgFut.value=Math.max(k,TODAY_IDX);
    rgPast.style.accentColor = (k<TODAY_IDX?COL_PASSE:COL_AUJ);
    rgFut.style.accentColor  = (k>TODAY_IDX?COL_FUTUR:COL_AUJ);
    dateIn.value=HDATES[k];
    const suff = k<TODAY_IDX?" · passé" : (k>TODAY_IDX?" · prévision":" · aujourd'hui");
    lblD.textContent=frDate(HDATES[k])+suff; lblD.style.color=colPos(k);
    appliquer();
  }
  function setLive(){ stopPlay(); HCUR=-1;
    rgPast.value=TODAY_IDX; rgFut.value=TODAY_IDX;
    rgPast.style.accentColor=COL_AUJ; rgFut.style.accentColor=COL_AUJ;
    dateIn.value=HDATES[TODAY_IDX];
    lblD.textContent="aujourd'hui"; lblD.style.color=COL_AUJ; appliquer(); }
  const base=()=> HCUR<0? TODAY_IDX : HCUR;
  // ±1 jour = pas d'INDEX (jamais bloqué par une date absente) ; ±30 = par date.
  const shift=(n)=>{ if(Math.abs(n)===1){ setIdx(base()+n); return; }
    const d=new Date(HDATES[base()]+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+n);
    setIdx(idxProche(d.toISOString().slice(0,10))); };
  allerADate = (ds)=>{ if(ds) setIdx(idxProche(ds)); };   // utilisé par les cueillettes
  rgPast.addEventListener("input",()=>{stopPlay(); setIdx(+rgPast.value);});
  rgFut.addEventListener("input",()=>{stopPlay(); setIdx(+rgFut.value);});
  dateIn.addEventListener("change",()=>{stopPlay(); if(dateIn.value) setIdx(idxProche(dateIn.value));});
  document.getElementById("rj-dp").addEventListener("click",()=>{stopPlay(); shift(-1);});
  document.getElementById("rj-dn").addEventListener("click",()=>{stopPlay(); shift(1);});
  document.getElementById("rj-mp").addEventListener("click",()=>{stopPlay(); shift(-30);});
  document.getElementById("rj-mn").addEventListener("click",()=>{stopPlay(); shift(30);});
  document.getElementById("rj-now").addEventListener("click",setLive);
  btnPlay.addEventListener("click",()=>{
    if(timer){stopPlay(); return;}
    btnPlay.textContent="⏸";
    let i=base(); if(i>=HDATES.length-1) i=0;   // au bout : relance du début
    setIdx(i);
    timer=setInterval(()=>{ i++; if(i>HDATES.length-1){stopPlay(); return;} setIdx(i); }, 110);
  });
  // Défaut : vue du jour.
  setLive();
  if(typeof IS_MOBILE!=="undefined" && IS_MOBILE && window.__mkCollapse)
    window.__mkCollapse(document.querySelector(".rejeu"),"🕒");
}

function metric(k,v,id){return `<div class="metric"><div class="k">${k}</div><div class="v"${id?` id="${id}"`:""}>${v}</div></div>`;}
function composition(rep){
  if(!rep) return "";
  const ent=Object.entries(rep).filter(([k,v])=>v>0);
  if(!ent.length) return "";
  const tot=ent.reduce((s,[,v])=>s+v,0)||1;
  ent.sort((a,b)=>b[1]-a[1]);
  const txt=ent.map(([k,v])=>`${ESSLBL[k]||k} ${Math.round(v/tot*100)}%`).join(" · ");
  return `<p class="hint">Composition boisée : ${txt}.</p>`;
}
// Valeurs dynamiques d'une maille : live (valeurs serveur) ou date d'historique.
function dynAt(mid){
  const p=D.mailles[mid];
  if(HCUR<0 || !H || !H.mailles[mid])
    return {indice:p.indice, swi:p.swi, pluie:p.pluie_15j, temp:p.temp,
            stress:p.stress, date:D.date_donnees, live:true};
  const m=H.mailles[mid], k=HCUR;
  return {indice:m.i[k], swi:(m.w?m.w[k]:null), pluie:(m.p?m.p[k]:null),
          temp:(m.t?m.t[k]:null), stress:m.s[k], date:HDATES[k], live:false};
}

// Ligne "versant" (face cliquée), recalculée pour la date courante.
function versantHTML(face, base, faceInd){
  if(!face) return "";
  const hasV = !!face.versant;
  const lbl = VERSANT_LBL[face.versant] || face.versant;
  // Effet TOTAL de la parcelle (versant + altitude combinés) vs indice de base.
  let effet = "";
  if(base!=null && faceInd!=null && base>0){
    const d = Math.round((faceInd/base - 1)*100);
    effet = d===0 ? "sans effet ce jour-là"
      : `indice <b>${faceInd}</b> contre ${base} de base : <b>${d>0?"+":""}${d}%</b> (${d>0?"favorisée":"pénalisée"})`;
  }
  // Ligne altitude : dénivelé de la parcelle par rapport à l'altitude moyenne
  // de sa maille (8 km) — c'est ce qui l'individualise thermiquement.
  const m = D.mailles[face.maille_id];
  let altLigne = "";
  if(face.alt!=null && m && m.altitude!=null){
    const dz = Math.round(face.alt - m.altitude);
    const amp = (face.amin!=null && face.amax!=null && face.amax>face.amin)
      ? ` (${face.amin}–${face.amax} m)` : "";
    const sens = dz>15 ? `${dz} m plus haut → plus frais/humide`
      : (dz<-15 ? `${-dz} m plus bas → plus chaud/sec` : "à l'altitude moyenne de la maille");
    altLigne = `<br>Altitude parcelle : <b>${face.alt} m</b>${amp} · ${sens} (maille ${Math.round(m.altitude)} m).`;
  }
  const col = face.expo>0.05 ? "#1565c0" : (face.expo<-0.05 ? "#b2182b" : "#8a8a80");
  const faceLbl = hasV ? `Face : <b>${lbl}</b> · exposition ${face.expo>0?"+":""}${face.expo}` : "Parcelle";
  return `<p class="hint" style="border-left:3px solid ${col};padding-left:8px">
      ${faceLbl}${altLigne}${effet?"<br>Effet net : "+effet+".":"."}</p>`;
}

// Graphe : indice cèpe sur tout l'historique (+ pluie 15 j en contexte) et un
// repère rouge sur la date sélectionnée. Repli sur la série 15 j si pas d'historique.
function construireGraph(mid){
  const ctx=document.getElementById("chart");
  if(chart){ chart.destroy(); chart=null; }
  if(H && H.mailles[mid]){
    const m=H.mailles[mid];
    const kc=HCUR<0?TODAY_IDX:HCUR, xhi=Math.min(HDATES.length-1,kc), xlo=Math.max(0,xhi-20);
    const pluginToday={id:"today",afterDatasetsDraw(c){
      const xs=c.scales.x, ys=c.scales.y;
      if(TODAY_IDX==null || TODAY_IDX<xs.min || TODAY_IDX>xs.max) return;
      const x=xs.getPixelForValue(TODAY_IDX), g=c.ctx;
      g.save(); g.beginPath(); g.moveTo(x,ys.top); g.lineTo(x,ys.bottom);
      g.lineWidth=1.5; g.setLineDash([4,3]); g.strokeStyle="#e65100"; g.stroke();
      g.setLineDash([]); g.fillStyle="#e65100"; g.font="9px sans-serif"; g.textAlign="center";
      g.fillText("auj.", x, ys.top+8); g.restore();
    }};
    chart=new Chart(ctx,{
      data:{ labels:HDATES.map(d=>d.slice(8,10)+"/"+d.slice(5,7)),
        datasets:[
          {type:"line",label:"Indice",data:m.i,yAxisID:"y",borderColor:"#2e7d32",
           backgroundColor:"rgba(46,125,50,.12)",fill:true,tension:.2,pointRadius:0,borderWidth:1.2},
          {type:"line",label:"Pluie 15j (mm)",data:m.p,yAxisID:"y2",borderColor:"#1e88e5",
           borderWidth:0.8,pointRadius:0,tension:.2},
          {type:"scatter",label:"date",data:HDATES.map(()=>null),yAxisID:"y",
           borderColor:"#b71c1c",backgroundColor:"#b71c1c",pointRadius:4},
        ]},
      options:{responsive:true,maintainAspectRatio:false,animation:false,
        interaction:{intersect:false,mode:"index"},
        plugins:{legend:{labels:{boxWidth:12,font:{size:10},filter:it=>it.text!=="date"}}},
        scales:{ y:{min:0,max:100,title:{display:true,text:"indice",font:{size:9}},ticks:{font:{size:9}}},
          y2:{position:"right",grid:{drawOnChartArea:false},ticks:{font:{size:9}}},
          x:{min:xlo,max:xhi,ticks:{font:{size:9},maxRotation:0,autoSkip:true,maxTicksLimit:8}} }},
      plugins:[pluginToday]
    });
  } else {
    const serie=(D.mailles[mid].serie)||[];
    chart=new Chart(ctx,{data:{labels:serie.map(s=>s.date.slice(5)),
      datasets:[{type:"line",label:"Indice",data:serie.map(s=>s.indice),borderColor:"#2e7d32",
        backgroundColor:"rgba(46,125,50,.12)",fill:true,tension:.3,pointRadius:2}]},
      options:{responsive:true,maintainAspectRatio:false,
        scales:{y:{min:0,max:100,ticks:{font:{size:9}}},x:{ticks:{font:{size:9},maxTicksLimit:6}}}}});
  }
}

// Met à jour les valeurs du détail + le repère du graphe selon la date courante.
function majDetailDate(){
  if(!SELMID) return;
  const p=D.mailles[SELMID], dyn=dynAt(SELMID);
  const set=(id,v)=>{const e=document.getElementById(id); if(e) e.textContent=v;};
  // Indice de la PARCELLE sélectionnée (versant + altitude) ; repli maille.
  let faceInd=null;
  if(SELFACE){
    const cool = coolness(SELFACE.alt, p.altitude);
    faceInd = moduleFace(dyn.indice, SELFACE.expo, dyn.stress, cool);
  }
  const indBase = (SELFACE && faceInd!=null) ? faceInd : dyn.indice;
  const indL = avecLune(indBase, dyn.date);
  set("d-indice",(indL!=null?indL:"—")+" · "+niveauLbl(indL));
  set("d-swi",dyn.swi!=null?dyn.swi:"—");
  set("d-pluie",dyn.pluie!=null?dyn.pluie+" mm":"—");
  set("d-temp",dyn.temp!=null?dyn.temp+" °C":"—");
  set("d-date",dyn.live?(dyn.date||"jour courant"):frDate(dyn.date));
  majLuneBox();
  const dv=document.getElementById("d-versant"); if(dv) dv.innerHTML=versantHTML(SELFACE, dyn.indice, faceInd);
  const dc=document.getElementById("d-choc");
  if(dc){ const ts=(H && H.mailles[SELMID])? H.mailles[SELMID].t : null;
    const k = HCUR<0? HDATES.length-1 : HCUR;
    dc.innerHTML = chocHTML(refroidissementJS(ts,k), dyn.temp); }
  const note=document.getElementById("d-note");
  const lagSel = lagPour((SELFACE && SELFACE.alt!=null) ? SELFACE.alt : p.altitude);
  if(note) note.textContent = dyn.live
    ? "Conditions du jour courant. L'indice anticipe la pousse à ~"+lagSel+" j."
    : "Conditions SAFRAN au "+frDate(dyn.date)+" (rejeu).";
  if(chart && H && H.mailles[SELMID] && chart.data.datasets.length>=3){
    const k = HCUR<0? TODAY_IDX : HCUR;
    const arr = HDATES.map(()=>null); arr[k]=H.mailles[SELMID].i[k];
    chart.data.datasets[2].data=arr;
    const gxhi=Math.min(HDATES.length-1,k), gxlo=Math.max(0,gxhi-20);
    chart.options.scales.x.min=gxlo; chart.options.scales.x.max=gxhi;
    chart.update("none");
  }
}

// Top 5 selon la date : live = top serveur (avec versant) ; sinon rang par maille.
function computeTop(k){
  const arr=[];
  for(const mid in H.mailles){ const v=H.mailles[mid].i[k]; if(v==null) continue;
    const p=D.mailles[mid]||{};
    arr.push({mid:mid,indice:v,niveau:niveauLbl(v),altitude:p.altitude,
              geologie:p.geologie_classe,essence:p.essence_dominante}); }
  arr.sort((a,b)=>b.indice-a.indice); return arr.slice(0,5);
}
function remplirTop(){
  const t=document.getElementById("top-zones"); if(!t) return;
  let top, titre;
  if(HCUR<0 || !H){ top=D.top||[]; titre="Meilleurs coins du jour"; }
  else { top=computeTop(HCUR); titre="Meilleurs coins · "+frDate(HDATES[HCUR]); }
  const dt=(HCUR<0||!H)?(D.date_donnees||aujourdhui()):HDATES[HCUR];
  t.innerHTML="<h2>"+titre+"</h2>"+top.map(z=>{
    const v=z.versant && VERSANT_LBL[z.versant]?" · "+VERSANT_LBL[z.versant]:"";
    const zi=avecLune(z.indice, dt);
    return `<div class="row"><span class="dot" style="background:${couleur(zi)}"></span>
     <b>${zi}</b> · ${niveauLbl(zi)} <span class="pill">${Math.round(z.altitude||0)} m · ${z.geologie||""}${z.essence?" · "+(ESSLBL[z.essence]||z.essence):""}${v}</span></div>`;}).join("");
  const mb=document.getElementById("m-best"); if(mb && top.length) mb.textContent=avecLune(top[0].indice, dt)+" / 100";
}

// Rafraîchit le volet quand la date change (détail si une maille est ouverte, sinon top).
function rafraichirVolet(){
  if(SELSTA){
    const c=vuesCourantes();
    let v=null;
    for(let i=0;i<c.liste.length;i++) if(c.liste[i].num===SELSTA){ v=c.liste[i]; break; }
    if(v) montrerStation(v); else stationAbsente(c);
    return;
  }
  if(SELMID) majDetailDate(); else remplirTop();

// La station ouverte n'a rien à montrer à la date choisie : on garde la fiche
// ouverte (SELSTA inchangé) avec un mot d'explication — revenir sur une date
// couverte la ré-affiche telle quelle.
function stationAbsente(c){
  const num=SELSTA;
  const raison = c.mode==="futur" ? "Pas d'observation de station dans le futur : ce sont des mesures, pas une prévision."
    : c.mode==="load" ? "Chargement de l'historique des stations…"
    : c.mode==="idle" ? "Historique des stations pas encore chargé."
    : c.mode==="ko"   ? "Historique des stations indisponible."
    : c.mode==="hors" ? "Cette date est antérieure à l'archive des stations."
    : "Ce poste ne relevait pas à cette date (ouvert plus tard, ou fermé).";

    <div style="display:flex;align-items:center;gap:8px">
